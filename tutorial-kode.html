<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial Kode Pemula & Panduan Sistem Lengkap — OeR Platform</title>
    <style>
        :root {
            --primary-color: #00b4d2; /* Warna Pirus OeR */
            --primary-hover: #008fa8;
            --dark-color: #1e293b;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --code-bg: #0f172a;
            --text-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.8;
            padding-bottom: 50px;
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        /* HEADER NAVIGASI */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-back {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            color: var(--dark-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* LOGO OER */
        .logo-oer {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 24px;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-color);
            border-radius: 50% 50% 50% 5%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
            padding-left: 3px;
            box-shadow: 0 3px 8px rgba(0, 180, 210, 0.4);
        }

        /* SEARCH BAR */
        .search-section {
            padding: 16px 24px;
            background: var(--card-bg);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--light-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 12px 20px;
            gap: 12px;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 15px;
            color: var(--dark-color);
        }

        /* 4 PILIHAN TOPIK */
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 24px 16px 24px;
        }

        .topic-card {
            background: var(--light-bg);
            border: 1px solid var(--border-color);
            padding: 14px 12px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: var(--dark-color);
            transition: all 0.2s ease;
        }

        .topic-card:hover, .topic-card.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(0, 180, 210, 0.3);
        }

        /* KONTEN UTAMA */
        .content-area {
            padding: 24px;
            border-top: 1px solid var(--border-color);
        }

        .content-title {
            font-size: 22px;
            color: var(--primary-color);
            margin-bottom: 16px;
            font-weight: 800;
            line-height: 1.3;
        }

        .illustration-box {
            width: 100%;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #006064;
            margin-bottom: 24px;
            border: 1px dashed var(--primary-color);
            text-align: center;
        }

        .illustration-box svg {
            width: 80px;
            height: 80px;
            margin-bottom: 12px;
            fill: var(--primary-color);
        }

        .section-block {
            margin-bottom: 24px;
        }

        .section-block h4 {
            font-size: 17px;
            color: var(--dark-color);
            margin-bottom: 8px;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .section-block p {
            margin-bottom: 12px;
            font-size: 15px;
            text-align: justify;
        }

        .section-block ul {
            margin-left: 20px;
            margin-bottom: 12px;
            font-size: 15px;
        }

        pre {
            background: var(--code-bg);
            color: #38bdf8;
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            overflow-x: auto;
            margin: 14px 0;
            line-height: 1.5;
            font-family: 'Courier New', Courier, monospace;
        }

        /* IKLAN OER DI TENGAH BACAAN */
        .ad-banner-oer {
            background: linear-gradient(135deg, #00b4d2, #0077b6);
            color: white;
            padding: 20px 24px;
            margin: 20px;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 8px 20px rgba(0, 180, 210, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .ad-banner-oer:hover {
            transform: translateY(-2px);
        }

        .ad-banner-oer h4 {
            font-size: 17px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ad-banner-oer p {
            font-size: 13px;
            opacity: 0.95;
            line-height: 1.5;
        }

        .btn-close-ad {
            position: absolute;
            top: 12px;
            right: 14px;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .btn-close-ad:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* NAVIGASI HALAMAN (1, 2, 3, 4) */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 20px 0 30px 0;
        }

        .page-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--dark-color);
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .page-btn.active, .page-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(0, 180, 210, 0.3);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER DENGAN TOMBOL BACK KE HOME OER -->
        <header>
            <div class="header-left">
                <button class="btn-back" onclick="kembaliKeHome()" title="Kembali ke Home OeR">←</button>
                <a href="https://oer-p.github.io/Media-oer/" class="logo-oer">
                    <div class="logo-icon">▶</div>
                    <span>OeR</span>
                </a>
            </div>
        </header>

        <!-- KOLOM PENCARIAN -->
        <div class="search-section">

        <div class="content-area" id="contentArea"></div>

        <!-- IKLAN OER DI TENGAH BACAAN (BISA DITUTUP DENGAN X) -->
        <div class="ad-banner-oer" id="iklanOeR" onclick="klikIklan()">
            <button class="btn-close-ad" onclick="tutupIklan(event)" title="Tutup Iklan">×</button>
            <h4>🚀 Ekosistem Komunitas OeR Platform</h4>
            <p>Bagikan karya foto, video, audio, serta aplikasi buatanmu secara instan dan aman. Klik banner ini untuk bergabung dengan pembuat konten OeR!</p>
        </div>

        <!-- NAVIGASI HALAMAN (1, 2, 3, 4) DI BAWAH -->
        <div class="pagination-container">
            <button class="page-btn active" id="page-1" onclick="pilihTopik(1)">1</button>
            <button class="page-btn" id="page-2" onclick="pilihTopik(2)">2</button>
            <button class="page-btn" id="page-3" onclick="pilihTopik(3)">3</button>
            <button class="page-btn" id="page-4" onclick="pilihTopik(4)">4</button>
        </div>
    </div>

    <script>
        // DATA MATERI LENGKAP DETAIL DENGAN GAMBAR ILUSTRASI
        const dataMateri = {
            1: {
                judul: "1. Panduan Kode Pemula: HTML, CSS & JavaScript Dasar dari Nol",
                ilmu: `<div class="illustration-box">
                        <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                        <strong>Arsitektur Dasar Web Development</strong>
                        <p style="font-size:12px; margin-top:4px;">Struktur Kerangka (HTML) + Penataan Visual (CSS) + Logika Interaktif (JavaScript)</p>
                       </div>`,
                penjelasan: `
                    <div class="section-block">
                        <h4>A. Pengenalan Kerangka HTML5</h4>
                        <p>Selamat datang di pemrograman web! Dalam membangun sebuah aplikasi web di platform OeR, HTML (HyperText Markup Language) bertindak sebagai pondasi dan kerangka utama. Tanpa HTML, browser tidak akan tahu bagaimana cara menampilkan teks, tombol, gambar, atau formulir pencarian.</p>
                        <p>Setiap elemen dalam HTML dibungkus oleh apa yang disebut sebagai <em>Tag</em>. Tag dibuka dengan tanda <code>&lt;tag&gt;</code> dan ditutup dengan <code>&lt;/tag&gt;</code>. Pembagian struktur dokumen HTML5 terdiri dari:</p>
                        <ul>
                            <li><strong>&lt;!DOCTYPE html&gt;:</strong> Menginformasikan kepada browser bahwa dokumen ini standar HTML5.</li>
                            <li><strong>&lt;head&gt;:</strong> Tempat menyimpan meta-data, judul halaman, serta tautan gaya CSS.</li>
                            <li><strong>&lt;body&gt;:</strong> Area utama di mana semua elemen visual (teks, gambar, tombol) ditampilkan kepada pengguna.</li>
                        </ul>
                    </div>

                    <div class="section-block">
                        <h4>B. Menghias Tampilan dengan CSS3 (Styling)</h4>
                        <p>Jika HTML adalah kerangka tulang, maka CSS (Cascading Style Sheets) adalah pakaian dan penampilannya. CSS bertugas mengatur warna latar belakang, tipe huruf (font), ukuran margin, tata letak responsif, serta animasi saat tombol di-klik.</p>
                        <p>Di platform OeR, kita menggunakan identitas warna Pirus (Cyan/Turquoise `#00b4d2`) sebagai warna utama. Warna ini dipasang menggunakan Variabel CSS agar konsisten di seluruh elemen web.</p>
                    </div>

                    <div class="section-block">
                        <h4>C. Memberikan Kehidupan dengan JavaScript</h4>
                        <p>JavaScript adalah bahasa pemrograman yang membuat halaman web menjadi hidup dan dinamis. Tanpa JavaScript, tombol yang di-klik tidak akan merespons atau berpindah pembahasan secara mulus.</p>
                    </div>

                    <div class="section-block">
                        <h4>D. Contoh Kode Lengkap Pemula</h4>
                        <p>Berikut adalah contoh kode kombinasi dasar yang bisa disalin untuk latihan:</p>
                        <pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="id"&gt;
&lt;head&gt;
    &lt;meta charset="UTF-8"&gt;
    &lt;title&gt;Aplikasi Pemula OeR&lt;/title&gt;
    &lt;style&gt;
        body { font-family: sans-serif; background: #f8fafc; color: #333; }
        .tombol-oer { background: #00b4d2; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .tombol-oer:hover { background: #008fa8; }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;h1&gt;Selamat Datang di OeR Learning!&lt;/h1&gt;
    &lt;p&gt;Klik tombol di bawah ini untuk melihat reaksi logika JavaScript:&lt;/p&gt;
    &lt;button class="tombol-oer" onclick="sapaPengunjung()"&gt;Sapa Saya&lt;/button&gt;

    &lt;script&gt;
        function sapaPengunjung() {
            alert("Halo! Selamat belajar pembuatan web di platform OeR.");
        }
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
                    </div>
                `
            },
            2: {
                judul: "2. Pembahasan Fungsi Sistem di Balik Layar",
                ilmu: `<div class="illustration-box">
                        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        <strong>Sistem Pemrosesan & Logika Alur Kerja</strong>
                        <p style="font-size:12px; margin-top:4px;">Event Handling + Manipulasi DOM + Manajemen Navigasi Halaman</p>
                       </div>`,
                penjelasan: `
                    <div class="section-block">
                        <h4>A. Konsep Dasar Manipulasi DOM (Document Object Model)</h4>
                        <p>Ketika sebuah halaman web dimuat, browser mengubah seluruh dokumen HTML menjadi struktur pohon objek yang disebut <strong>DOM</strong>. Melalui JavaScript, kita dapat mengubah teks, menyembunyikan elemen, atau menambah kelas warna secara instan tanpa perlu memuat ulang (*reload*) halaman.</p>
                        <p>Contoh perintah utama manipulasi DOM yang dipakai pada halaman ini:</p>
                        <ul>
                            <li><code>document.getElementById('contentArea')</code>: Mengambil area wadah utama berdasarkan ID-nya.</li>
                            <li><code>innerHTML = ...</code>: Mengganti seluruh isi HTML di dalam wadah secara langsung.</li>
                            <li><code>classList.add('active')</code>: Menambahkan status tombol pirus aktif.</li>
                        </ul>
                    </div>

                    <div class="section-block">
                        <h4>B. Mekanisme Event Listener (Penanganan Aksi)</h4>
                        <p>Sistem OeR bekerja berdasarkan respon terhadap aksi pengguna. Aksi ini dinamakan <em>Event</em>. Beberapa contoh event interaktif yang berjalan di halaman ini adalah:</p>
                        <ul>
                            <li><code>onclick</code>: Memicu fungsi perpindahan bab saat tombol 1, 2, 3, atau 4 diklik.</li>
                            <li><code>onkeyup</code>: Memproses pengetikan kata kunci di kolom pencarian secara real-time.</li>
                            <li><code>DOMContentLoaded</code>: Mendeteksi saat halaman selesai dimuat agar parameter pencarian otomatis dibaca.</li>
                        </ul>
                    </div>

                    <div class="section-block">
                        <h4>C. Logika Alur Fungsi Utama</h4>
                        <p>Berikut adalah bentuk fungsi JavaScript yang mengendalikan interaksi halaman ini:</p>
                        <pre><code>// 1. Fungsi Mengubah Bab Topik
function pilihTopik(nomor) {
    const materi = dataMateri[nomor];
    
    // Perbarui Tampilan Konten Utama
    document.getElementById('contentArea').innerHTML = materi.penjelasan;
    
    // Atur Status Aktif Tombol 1, 2, 3, 4
    for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById('btn-topik-' + i);
        if (i === nomor) btn.classList.add('active');
        else btn.classList.remove('active');
    }
}

// 2. Fungsi Tombol Back Kembali ke Home
function kembaliKeHome() {
    window.location.href = "https://oer-p.github.io/Media-oer/";
}</code></pre>
                    </div>
                `
            },
            3: {
                judul: "3. Penggunaan Open API & Integrasi Data Luar",
                ilmu: `<div class="illustration-box">

                penjelasan: `
                    <div class="section-block">
                        <h4>A. Apa itu Open API?</h4>
                        <p><strong>API (Application Programming Interface)</strong> adalah jembatan komunikasi yang memungkinkan dua sistem atau aplikasi yang berbeda saling bertukar data. Dengan Open API, web OeR dapat mengambil informasi terbaru dari server luar—seperti daftar berita, data cuaca, informasi pengguna, atau file media—secara otomatis.</p>
                    </div>

                    <div class="section-block">
                        <h4>B. Memahami Format Data JSON</h4>
                        <p>Data yang dikirimkan oleh Open API hampir selalu berbentuk <strong>JSON (JavaScript Object Notation)</strong>. Format ini sangat ringan dan mudah dibaca oleh komputer maupun manusia.</p>
                        <p>Contoh struktur data JSON dari server OeR:</p>
                        <pre><code>{
  "status": "success",
  "total_tutorial": 4,
  "data": [
    {
      "id": 1,
      "judul": "Tutorial Kode Pemula",
      "kategori": "Web Development"
    }
  ]
}</code></pre>
                    </div>

                    <div class="section-block">
                        <h4>C. Menggunakan Async / Await Fetch API</h4>
                        <p>Untuk mengambil data dari API tanpa membuat web terasa macet (lag), kita menggunakan konsep <em>Asynchronous JavaScript</em> dengan fungsi <code>fetch()</code>:</p>
                        <pre><code>// Fungsi Mengambil Data dari Open API
async function muatDataTutorialOeR() {
    try {
        // 1. Kirim Permintaan ke Server
        const response = await fetch('https://api.github.com/repos/Oer-p/Media-oer');
        
        // 2. Ubah Respon Menjadi Format JSON
        const data = await response.json();
        
        // 3. Tampilkan Hasil Data ke Layar Web
        console.log("Nama Repository:", data.name);
        console.log("Jumlah Bintang (Stars):", data.stargazers_count);
    } catch (error) {
        console.error("Gagal terhubung ke Open API:", error);
    }
}</code></pre>
                    </div>
                `

                penjelasan: `
                    <div class="section-block">
                        <h4>A. Prinsip Desain UI/UX Platform OeR</h4>
                        <p>Pengalaman Pengguna (User Experience / UX) dan Tampilan Antarmuka (User Interface / UI) adalah aspek krusial. Pengunjung harus merasa nyaman, tidak bingung saat membaca, serta dengan mudah menemukan tombol navigasi.</p>
                        <p>Beberapa aturan standar tampilan web OeR meliputi:</p>

                            <li><strong>Konsistensi Warna:</strong> Penggunaan kombinasi Cyan/Pirus `#00b4d2` sebagai aksen tombol utama, dengan latar belakang terang `#f8fafc` agar teks nyaman dibaca.</li>
                            <li><strong>Kemudahan Navigasi:</strong> Tombol Kembali (`←`) diletakkan di sudut kiri atas yang selalu terlihat (Sticky Header).</li>
                            <li><strong>Dual Navigation:</strong> Pengunjung bisa berpindah pembahasan lewat 4 kartu pilihan di atas maupun tombol angka (1, 2, 3, 4) di paling bawah.</li>
                        </ul>
                    </div>

                    <div class="section-block">
                        <h4>B. Penerapan CSS Flexbox & CSS Grid</h4>
                        <p>Halaman ini dibangun menggabungkan dua teknik tata letak paling modern di CSS:</p>
                        <ul>
                            <li><strong>CSS Flexbox:</strong> Digunakan untuk menyusun Header (Tombol Back & Logo OeR) secara sejajar horizontal.</li>
                            <li><strong>CSS Grid:</strong> Digunakan untuk membagi 4 kotak pilihan topik menjadi 2 kolom rapi di layar HP maupun laptop.</li>
                        </ul>
                    </div>

                    <div class="section-block">
                        <h4>C. Kode CSS Layout Responsif</h4>
                        <pre><code>/* Tata Letak 4 Pilihan Topik Menggunakan CSS Grid */
.topics-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Membagi rata 2 Kolom */
    gap: 12px;
}

/* Header Menggunakan CSS Flexbox */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}</code></pre>
                    </div>
                `
            }
        };

        // FUNGSI MEMILIH TOPIK PEMBAHASAN
        function pilihTopik(nomor) {
            const materi = dataMateri[nomor];
            const areaUtama = document.getElementById('contentArea');

            // Render Gambar Ilustrasi + Judul + Penjelasan Lengkap
            areaUtama.innerHTML = `
                <h3 class="content-title">${materi.judul}</h3>
                ${materi.ilmu}
                ${materi.penjelasan}
            `;

            // Update Status Aktif pada Tombol Topik (Atas) dan Pagination (Bawah)
            for (let i = 1; i <= 4; i++) {
                const btnTopik = document.getElementById(`btn-topik-${i}`);
                const btnPage = document.getElementById(`page-${i}`);

                if (i === nomor) {
                    if(btnTopik) btnTopik.classList.add('active');
                    if(btnPage) btnPage.classList.add('active');
                } else {
                    if(btnTopik) btnTopik.classList.remove('active');
                    if(btnPage) btnPage.classList.remove('active');
                }
            }

            // Scroll Halus Kembali ke Atas
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // FUNGSI TOMBOL BACK KEMBALI KE HOME OER
        function kembaliKeHome() {
            window.location.href = "https://oer-p.github.io/Media-oer/";
        }

        // FUNGSI MENUTUP IKLAN OER (TOMBOL X)
        function tutupIklan(event) {
            event.stopPropagation(); // Mencegah pemicu event klik iklan
            const iklan = document.getElementById('iklanOeR');
            if (iklan) iklan.style.display = 'none';
        }

        // FUNGSI KLIK IKLAN OER
        function klikIklan() {
            window.location.href = "https://oer-p.github.io/Media-oer/";
        }

        // FUNGSI PENCARIAN REALTIME DENGAN PENELUSURAN KATA KUNCI
        function cariMateriRealtime() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            if (input === "") return;

            for (let id in dataMateri) {
                const item = dataMateri[id];
                const gabunganTeks = (item.judul + " " + item.penjelasan).toLowerCase();

                if (gabunganTeks.includes(input)) {
                    pilihTopik(Number(id));
                    break;
                }
            }
        }

        // OTOMATIS MEMBACA QUERY PARAMETER DARI SEARCH UTAMA (?q=...)
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');

            if (query) {
                document.getElementById('searchInput').value = query;
                const q = query.toLowerCase();

                if (q.includes('sistem') || q.includes('fungsi') || q.includes('logika')) {
                    pilihTopik(2);
                } else if (q.includes('api') || q.includes('open api') || q.includes('fetch')) {
                    pilihTopik(3);
                } else if (q.includes('tampilan') || q.includes('ui') || q.includes('ux') || q.includes('desain')) {
                    pilihTopik(4);
                } else {
                    pilihTopik(1);
                }
            } else {
                pilihTopik(1); // Default Buka Bab 1
            }
        });
    </script>
