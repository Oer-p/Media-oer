<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050707">
<meta name="description" content="OER — Temukan Teman">
<title>OER — Teman</title>

<!-- SUPABASE CLIENT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #050707;
  --surface: #0b1011;
  --surface-hover: #111a1b;
  --border: #1c2b2c;
  --text: #f2fafa;
  --muted: #819394;
  --cyan: #00e5d0;
  --cyan-soft: rgba(0,229,208,.09);
  --green: #20d890;
  --red: #ff5d72;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at top, rgba(0,229,208,.055), transparent 42%), var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* TOPBAR */
.topbar {
  height: 72px;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(5,7,7,.94);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1240px;
  height: 100%;
  padding: 0 24px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 28px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-word {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
}
.brand-word span { color: var(--cyan); }

.search-box {
  max-width: 410px;
  flex: 1;
  height: 42px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
}
.search-box input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 13px;
}

/* LAYOUT */
.layout {
  max-width: 900px;
  margin: auto;
  padding: 25px 24px 40px;
}
.section-title {
  font-size: 15px;
  font-weight: 750;
  margin: 24px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.user-card {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.user-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--cyan-soft);
  flex-shrink: 0;
}
.user-name {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-meta {
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
}
.btn-action {
  padding: 8px 14px;
  background: var(--cyan-soft);
  border: 1px solid rgba(0,229,208,.3);
  border-radius: 10px;
  color: var(--cyan);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
  white-space: nowrap;
}
.btn-action:hover {
  background: var(--cyan);
  color: var(--bg);
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 20px;
}
.back-link:hover { color: var(--cyan); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="https://oer-p.github.io/Media-oer/" class="brand">
      <div class="brand-word">OER<span>.</span></div>
    </a>
    <div class="search-box">
      <input type="text" id="searchInput" oninput="filterUsers()" placeholder="Cari teman atau kota...">
    </div>
  </div>
</header>

<main class="layout">
  <a href="https://oer-p.github.io/Media-oer/" class="back-link">← Kembali ke Beranda Home</a>
  
  <h2 class="section-title" style="color: var(--green);">🟢 Aktif Sekarang</h2>
  <div id="activeList" style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;">
    <div style="color: var(--muted); font-size: 12px;">Memuat data...</div>
  </div>

  <h2 class="section-title" style="color: var(--cyan);">📍 Teman di Sekitar Anda</h2>
  <div id="nearbyGrid" class="grid-cards">
    <div style="color: var(--muted); font-size: 12px;">Memuat data...</div>
  </div>

  <h2 class="section-title" style="color: #a855f7;">👥 Mungkin Anda Kenal</h2>
  <div id="generalGrid" class="grid-cards">
    <div style="color: var(--muted); font-size: 12px;">Memuat data...</div>
  </div>
</main>

<script>
const OER_CONFIG = {
  SUPABASE_URL: "https://jhopfzmyxuafdbwwkjbf.supabase.co",
  SUPABASE_KEY: "sb_publishable_FE4-8ZuWD3FgKCcjxjaErg_w97N3fwk"
};

const supabase = window.supabase.createClient(OER_CONFIG.SUPABASE_URL, OER_CONFIG.SUPABASE_KEY);
let allProfiles = [];
let myCity = "Jakarta";

document.addEventListener("DOMContentLoaded", async () => {
  try {
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
      const { data: myProfile } = await supabase.from('profiles').select('city').eq('id', user.id).single();
      if (myProfile && myProfile.city) myCity = myProfile.city;
    }

    const { data, error } = await supabase.from('profiles').select('*');
    if (error) throw error;

    allProfiles = data || [];
    renderUI(allProfiles);
  } catch (err) {
    console.error("Error:", err.message);
  }
});

function renderUI(profiles) {
  const activeEl = document.getElementById("activeList");
  const nearbyEl = document.getElementById("nearbyGrid");
  const generalEl = document.getElementById("generalGrid");

  const activeUsers = profiles.filter(p => p.is_online);
  const nearbyUsers = profiles.filter(p => p.city?.toLowerCase() === myCity.toLowerCase());
  const generalUsers = profiles.filter(p => p.city?.toLowerCase() !== myCity.toLowerCase());

  activeEl.innerHTML = activeUsers.length ? activeUsers.map(u => `
    <div style="text-align: center; flex-shrink: 0; width: 70px;">
      <img src="${u.avatar_url || 'https://via.placeholder.com/50'}" class="user-avatar" style="margin: 0 auto 4px;">
      <div style="font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${u.full_name || u.username}</div>
    </div>
  `).join('') : '<div style="color: var(--muted); font-size: 12px;">Tidak ada yang online.</div>';

  nearbyEl.innerHTML = nearbyUsers.length ? nearbyUsers.map(u => createUserCard(u)).join('') : '<div style="color: var(--muted); font-size: 12px;">Belum ada pengguna di kota ini.</div>';
  generalEl.innerHTML = generalUsers.length ? generalUsers.map(u => createUserCard(u)).join('') : '<div style="color: var(--muted); font-size: 12px;">Tidak ada rekomendasi lain.</div>';
}

function createUserCard(user) {
  return `
    <div class="user-card">
      <div class="user-info">
        <img src="${user.avatar_url || 'https://via.placeholder.com/50'}" class="user-avatar">
        <div style="min-width: 0;">
          <div class="user-name">${user.full_name || user.username || 'Pengguna'}</div>
          <div class="user-meta">📍 ${user.city || 'Indonesia'}</div>
        </div>
      </div>
      <button onclick="sendRequest('${user.id}', this)" class="btn-action">Tambah</button>
    </div>
  `;
}

async function sendRequest(receiverId, btn) {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { alert('Silakan login terlebih dahulu.'); return; }

  btn.disabled = true;
  btn.innerText = "...";

  const { error } = await supabase.from('friendships').insert([
    { sender_id: user.id, receiver_id: receiverId, status: 'pending' }
  ]);

  if (error) {
    if (error.code === '23505') {
      btn.innerText = "Terkirim";
      btn.style.color = "var(--muted)";
    } else {
      alert("Gagal: " + error.message);
      btn.disabled = false;
      btn.innerText = "Tambah";
    }
  } else {
    btn.innerText = "Terkirim";
    btn.style.color = "var(--green)";
  }
}

function filterUsers() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const filtered = allProfiles.filter(p => 
    (p.full_name && p.full_name.toLowerCase().includes(q)) ||
    (p.city && p.city.toLowerCase().includes(q))
  );
  renderUI(filtered);
}
</script>

</body>
</html>
