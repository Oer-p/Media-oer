<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OoeR - Ruang Belajar Bertingkat</title>
<style>
  :root {
    --text: #202124; --muted: #5f6368; --border: #dfe1e5;
    --bg: #fff; --soft: #f8f9fa; --blue: #4285f4;
    --green: #34a853; --shadow: 0 1px 6px #20212430;
  }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--text);
    font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; align-items: center;
  }
  .container { width: min(100%, 750px); background: var(--soft); padding: 25px; border-radius: 16px; box-shadow: var(--shadow); }
  h1 { text-align: center; color: var(--blue); font-size: 24px; margin-bottom: 5px; }
  p.subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 25px; }
  
  .subject-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .subject-btn { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); font-weight: bold; cursor: pointer; text-align: center; }
  .subject-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

  .level-header { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; }
  .level-title { font-weight: bold; color: #174ea6; font-size: 15px; }
  
  .question-box { background: var(--bg); border: 1px solid var(--border); padding: 18px; border-radius: 12px; margin-bottom: 15px; }
  .question-title { font-weight: bold; font-size: 15px; margin-bottom: 12px; line-height: 1.5; color: var(--text); }
  
  .options-list { display: grid; gap: 8px; }
  .option-label { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14px; background: var(--bg); }
  .option-label:hover { background: #f1f3f4; }
  
  .btn-action { width: 100%; background: var(--green); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  .btn-action:hover { opacity: 0.9; }

  .result-card { display: none; background: var(--bg); border: 2px solid var(--green); padding: 20px; border-radius: 12px; text-align: center; margin-top: 15px; }
  .score-big { font-size: 32px; font-weight: bold; color: var(--green); margin: 10px 0; }
</style>
</head>
<body>

<div class="container">
  <h1>📚 Ruang Belajar Bertingkat OoeR</h1>
  <p class="subtitle">Soal Asli & Berganti Sesuai Level!</p>

  <div class="subject-grid" id="subjectGrid">
    <button class="subject-btn active" onclick="changeSubject('Matematika')">Matematika</button>
    <button class="subject-btn" onclick="changeSubject('Fisika')">Fisika</button>
    <button class="subject-btn" onclick="changeSubject('BahasaInggris')">Bahasa Inggris</button>
  </div>

  <div class="level-header">
    <span class="level-title" id="levelIndicator">Matematika | Level 1 (Standar)</span>
    <span id="levelProgress" style="font-size: 13px; color: var(--muted);">Soal 1-10 dari 30</span>
  </div>

  <div id="quizArea"></div>

  <button type="button" class="btn-action" id="submitLevelBtn" onclick="submitLevel()">Selesaikan Level Ini & Cek Skor</button>

  <div class="result-card" id="resultCard">
    <h2>🎉 Hasil Level Tercapai!</h2>
    <div class="score-big" id="levelScoreText">Skor: 0 / 10</div>
    <p id="levelDesc">Bagus! Kamu bisa lanjut ke tantangan level berikutnya.</p>
    <button type="button" class="btn-action" style="background:var(--blue);" id="nextLevelBtn" onclick="nextLevel()">Lanjut ke Level Berikutnya ➔</button>
  </div>
</div>

        { q: "Momen inersia silinder pejal terhadap sumbunya adalah...", options: ["A. I = mR²", "B. I = 1/2 mR²", "C. I = 2/5 mR²", "D. I = 1/12 mR²"], ans: "B" },
        { q: "Waktu paruh zat radioaktif jika tersisa 25% setelah 10 hari adalah...", options: ["A. 2.5 hari", "B. 5 hari", "C. 7.5 hari", "D. 20 hari"], ans: "B" }
      ]
    },
    BahasaInggris: {
      1: [
        { q: "She ___ to school every morning.", options: ["A. go", "B. goes", "C. going", "D. gone"], ans: "B" },
        { q: "What is the antonym of 'Happy'?", options: ["A. Joyful", "B. Sad", "C. Excited", "D. Smart"], ans: "B" },

        { q: "My father is a doctor. ___ works in the hospital.", options: ["A. She", "B. They", "C. He", "D. It"], ans: "C" },

  function initQuiz() {
    const quizArea = document.getElementById('quizArea');
    const currentQuestions = questionBank[currentSubject][currentLevel];
    let html = '';
    
    let startIdx = (currentLevel - 1) * 10 + 1;
    let endIdx = currentLevel * 10;

    const displaySubjectName = currentSubject === 'BahasaInggris' ? 'Bahasa Inggris' : currentSubject;
    document.getElementById('levelIndicator').innerText = `${displaySubjectName} | Level ${currentLevel} (${getLevelName(currentLevel)})`;
    document.getElementById('levelProgress').innerText = `Soal ${startIdx}-${endIdx} dari 30`;

    currentQuestions.forEach((item, index) => {
      let qNum = startIdx + index;
      html += `
        <div class="question-box">
          <div class="question-title">${qNum}. ${item.q}</div>
          <div class="options-list">
            ${item.options.map(opt => `
              <label class="option-label">
                <input type="radio" name="q_${qNum}" value="${opt.charAt(0)}"> ${opt}
              </label>
            `).join('')}
          </div>
        </div>
      `;
    });

    quizArea.innerHTML = html;
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('submitLevelBtn').style.display = 'block';
  }

  function getLevelName(lvl) {
    if (lvl === 1) return "Standar / Pemula";
    if (lvl === 2) return "Menengah / Sulit";
    if (lvl === 3) return "Tingkat Dewa / Master";
    return "";
  }

  function changeSubject(subj) {
    currentSubject = subj;
    currentLevel = 1;
    
    document.querySelectorAll('.subject-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('onclick').includes(subj));
    });

    initQuiz();
  }

  function submitLevel() {
    const currentQuestions = questionBank[currentSubject][currentLevel];
    let startIdx = (currentLevel - 1) * 10 + 1;
    let correctCount = 0;

    currentQuestions.forEach((item, index) => {
      let qNum = startIdx + index;
      const selected = document.querySelector(`input[name="q_${qNum}"]:checked`);
      if (selected && selected.value === item.ans) {
        correctCount++;
      }
    });

    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('submitLevelBtn').style.display = 'none';
    
    const resultCard = document.getElementById('resultCard');
    resultCard.style.display = 'block';
    document.getElementById('levelScoreText').innerText = `Skor Level ${currentLevel}: ${correctCount} / 10`;

    const nextBtn = document.getElementById('nextLevelBtn');
    if (currentLevel >= 3) {
      nextBtn.innerText = "🏆 Selamat! Semua Level Selesai (Ulangi Pelajaran)";
    } else {
      nextBtn.innerText = `Lanjut ke Level ${currentLevel + 1} ➔`;
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function nextLevel() {
    if (currentLevel < 3) {
      currentLevel++;
      initQuiz();
    } else {
      currentLevel = 1;
      initQuiz();
    }
  }

  // Jalankan awal
  initQuiz();
</script>

</body>
</html>
