<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --text:#202124;--muted:#5f6368;--border:#dfe1e5;
  --bg:#fff;--soft:#f8f9fa;--blue:#4285f4;
  --red:#ea4335;--yellow:#fbbc05;--green:#34a853;
  --shadow:0 1px 6px #20212430;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column
}
body.dark{
  --text:#e8eaed;--muted:#aeb4bc;--border:#41454c;
  --bg:#202124;--soft:#303134;--shadow:0 2px 10px #0005
}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
button{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--blue);outline-offset:3px
}

/* HEADER */
header{
  width:100%;min-height:76px;padding:14px 34px;
  display:flex;align-items:center;justify-content:space-between;gap:20px
}
.account-area{display:flex;align-items:center;gap:10px;position:relative}
.account-button{
  display:flex;align-items:center;gap:10px;border:0;
  background:transparent;cursor:pointer;padding:4px;border-radius:24px
}
.account-button:hover{background:var(--soft)}
.avatar{
  width:42px;height:42px;border-radius:50%;display:grid;
  place-items:center;overflow:hidden;background:#e8f0fe;
  color:#174ea6;font-weight:700;font-size:17px;flex-shrink:0
}
.avatar img{width:100%;height:100%;object-fit:cover}
.account-label{font-size:15px}
.chevron{font-size:13px;color:var(--muted)}
.account-menu{
  display:none;position:absolute;top:54px;left:0;min-width:220px;
  padding:8px;border:1px solid var(--border);border-radius:14px;
  background:var(--bg);box-shadow:var(--shadow);z-index:100
}
.account-menu.show{display:block}
.account-menu button{
  width:100%;padding:12px;border:0;border-radius:8px;
  background:transparent;text-align:left;cursor:pointer
}
.account-menu button:hover{background:var(--soft)}
.header-tools{display:flex;align-items:center;gap:8px}
.icon-button{
  width:42px;height:42px;display:grid;place-items:center;border:0;
  border-radius:50%;background:transparent;color:var(--text);cursor:pointer
}
.icon-button:hover{background:var(--soft)}
.icon-button svg{width:23px;height:23px}

/* LOGO AND SEARCH */
main{
  width:100%;flex:1;display:flex;flex-direction:column;
  align-items:center;padding:80px 20px 45px
}
.hero{width:100%;display:flex;flex-direction:column;align-items:center}
.logo{
  display:flex;align-items:center;justify-content:center;gap:0;
  height:116px;margin-bottom:38px;user-select:none;white-space:nowrap
}
.logo-o{
  width:91px;height:91px;position:relative;display:inline-block;
  border-radius:50%;background:conic-gradient(
    from -43deg,var(--red) 0deg 105deg,
    var(--yellow) 105deg 225deg,var(--blue) 225deg 360deg
  );flex-shrink:0
}
.logo-o::after{
  content:"";position:absolute;inset:17px;border-radius:50%;background:var(--bg)
}
.logo-oe,.logo-r{
  font-family:Arial,Helvetica,sans-serif;font-size:112px;
  font-weight:500;line-height:1;letter-spacing:-7px
}
.logo-oe{color:var(--red);margin-left:9px}
.logo-r{color:var(--green);margin-left:2px;letter-spacing:-5px}
.search-wrap{position:relative;width:min(100%,690px)}
.search-box{
  width:100%;min-height:58px;display:flex;align-items:center;gap:14px;
  padding:0 20px;border:1px solid var(--border);border-radius:32px;
  background:var(--bg);transition:box-shadow .18s,border-color .18s
}
.search-box:hover,.search-box:focus-within{
  border-color:transparent;box-shadow:var(--shadow)
}
.search-icon{width:23px;height:23px;color:var(--muted);flex-shrink:0}
#searchInput{
  width:100%;min-width:0;padding:15px 0;border:0;outline:none;
  color:var(--text);background:transparent;font-size:16px
}
#searchInput::placeholder{color:var(--muted)}
.search-action{
  border:0;background:transparent;color:var(--blue);
  cursor:pointer;display:grid;place-items:center;padding:5px;flex-shrink:0
}
.search-action svg{width:23px;height:23px}
.suggestions{
  display:none;position:absolute;top:64px;left:0;right:0;z-index:50;
  overflow:hidden;padding:8px 0;border-radius:18px;background:var(--bg);
  box-shadow:var(--shadow)
}
.suggestions.show{display:block}
.suggestion{
  display:flex;align-items:center;gap:13px;width:100%;padding:12px 20px;
  border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer
}
.suggestion:hover{background:var(--soft)}
.search-buttons{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.search-buttons button{
  padding:11px 17px;border:1px solid transparent;border-radius:5px;
  background:var(--soft);font-size:13px;cursor:pointer
}
.search-buttons button:hover{border-color:var(--border)}
#notice{
  min-height:18px;margin:14px 0 0;color:var(--muted);
  font-size:12px;text-align:center
}

/* SHORTCUTS */
.shortcuts{
  width:min(100%,690px);display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:46px
}
.shortcut,.service-shortcut{
  min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:10px 4px 12px;border:0;border-radius:12px;
  background:transparent;cursor:pointer;text-align:center
}
.shortcut:hover,.service-shortcut:hover{background:var(--soft)}
.shortcut-icon,.service-shortcut .service-logo{
  width:58px;height:58px;display:grid;place-items:center;
  border-radius:19px;background:#f1f3f4;color:#5f6368;font-weight:bold
}
.shortcut-icon svg{width:27px;height:27px}
.shortcut-icon.youtube{background:#fce8e6;color:#ea4335}
.shortcut-icon.study{background:#e8f0fe;color:#1a73e8}
.shortcut-icon.news{background:#e6f4ea;color:#188038}
.shortcut-icon.social{background:#f3e8fd;color:#8430ce}
.shortcut-icon.add{background:var(--soft);color:var(--muted)}
.shortcut-label,.service-shortcut .service-name{max-width:100%;font-size:12px;overflow-wrap:anywhere}

.service-website { background: #e0f2fe; color: #0369a1; }
.service-ads { background: #fef3c7; color: #92400e; }
.service-market { background: #dcfce7; color: #166534; }

/* DIALOGS & OVERLAYS */
.overlay{
  display:none;position:fixed;inset:0;z-index:200;align-items:center;
  justify-content:center;padding:18px;background:#0005
}
.overlay.show{display:flex}
.dialog{
  width:min(100%,550px);max-height:85vh;overflow:auto;padding:22px;
  border:1px solid var(--border);border-radius:18px;
  background:var(--bg);box-shadow:var(--shadow)
}
.dialog-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;margin-bottom:16px
}
.dialog-head h2{font-size:19px;margin:0}
.close-button{
  width:35px;height:35px;border:0;border-radius:50%;
  background:var(--soft);cursor:pointer;font-size:20px
}
.dialog-list{display:grid;gap:8px}
.dialog-item{
  display:flex;align-items:center;gap:12px;padding:12px;
  border-radius:10px;overflow-wrap:anywhere
}
.dialog-item:hover{background:var(--soft)}
.dialog-item button{
  margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--muted)
}
.dialog-empty{color:var(--muted);font-size:14px;line-height:1.6}
.dialog-input, .dialog-textarea{
  width:100%;padding:12px;margin:8px 0;border:1px solid var(--border);
  border-radius:10px;background:var(--bg);color:var(--text)
}
.primary-button{
  padding:11px 16px;border:0;border-radius:9px;
  background:var(--blue);color:white;cursor:pointer;font-weight:bold;width:100%;
}
.primary-button:hover{opacity:0.9;}

/* CONTENT SECTIONS */
.content-section{width:min(100%,900px);margin:48px auto 0}
.section-heading{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:14px
}
.section-heading h2{margin:0;font-size:20px}
.section-heading span{font-size:12px;color:var(--muted)}

.feed-box{
  background:var(--soft);border:1px solid var(--border);
  padding:15px;border-radius:12px;margin-top:10px;
}
.feed-card{
  background:var(--bg);border:1px solid var(--border);
  padding:12px;border-radius:8px;margin-bottom:10px;font-size:13px;
}

footer{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
  gap:15px;min-height:58px;padding:16px 28px;border-top:1px solid var(--border);
  background:var(--soft);color:var(--muted);font-size:12px;margin-top:50px;
}
.footer-links{display:flex;gap:20px;flex-wrap:wrap}

@media(max-width:700px){
  header{min-height:66px;padding:10px 14px}
  .shortcuts{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
}
</style>
</head>

<script>
(() => {
  "use strict";

  // SINKRONISASI KONEKSI SUPABASE LENGKAP
  const SUPABASE_URL = "https://jhopfzmyxuafdbwwkjbf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FE4-8ZuWD3FgKCcjxjaErg_w97N3fwk";

  const $ = id => document.getElementById(id);
  let supabaseClient = null;

  if (window.supabase?.createClient) {
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (err) {
      console.error("Supabase Error:", err);
    }
  }

  $("year").textContent = new Date().getFullYear();

  // 1. TANYA AI & SIMPAN KE DATABASE
  $("btnTanyaAI")?.addEventListener("click", async () => {
    const student = $("studentName").value.trim();
    const prompt = $("aiPrompt").value.trim();
    const output = $("aiResponse");

    if (!student || !prompt) {
      alert("Isi Nama Kamu dan Pertanyaan terlebih dahulu!");
      return;
    }

    output.innerText = "⏳ OoeR AI sedang berpikir...";

    try {
      // Panggil Supabase Edge Function 'oer-learning'
      const { data, error } = await supabaseClient.functions.invoke('oer-learning', {
        body: { prompt: prompt }
      });

      if (error) throw error;

      const jawaban = data?.answer || "AI tidak memberikan jawaban.";
      output.innerText = "🤖 JAWABAN AI:\n" + jawaban;

      // Simpan riwayat diskusi ke database Supabase
      await supabaseClient.from('oer_discussions').insert([
        { sender_name: student, role: 'student', message: prompt },
        { sender_name: 'Guru AI OoeR', role: 'teacher', message: jawaban }
      ]);

      loadDatabaseFeed();
    } catch (err) {
      output.innerText = "Gagal memproses AI: " + (err.message || err);
    }
  });

  // 2. GURU POSTING MATERI KE DATABASE
  $("btnPostMateri")?.addEventListener("click", async () => {
    const teacher = $("teacherName").value.trim();
    const title = $("materialTitle").value.trim();
    const content = $("materialContent").value.trim();

    if (!teacher || !title || !content) {
      alert("Semua bidang materi harus diisi!");
      return;
    }

    try {
      const { error } = await supabaseClient.from('oer_materials').insert([
        { title: `[${teacher}] ${title}`, content_text: content }
      ]);

      if (error) throw error;

      alert("Materi berhasil tersimpan di database Supabase!");
      $("materialTitle").value = "";
      $("materialContent").value = "";
      loadDatabaseFeed();
    } catch (err) {
      alert("Gagal menyimpan materi: " + err.message);
    }
  });

  // 3. AMBIL DATA NYATA DARI SUPABASE
  async function loadDatabaseFeed() {
    const feed = $("dbFeed");
    feed.innerText = "Memuat data terbaru...";

    try {
      const { data: materials } = await supabaseClient.from('oer_materials').select('*').order('created_at', { ascending: false }).limit(3);
      const { data: discussions } = await supabaseClient.from('oer_discussions').select('*').order('created_at', { ascending: false }).limit(3);

      let html = "<b>--- MATERI TERBARU ---</b><br>";
      if (materials && materials.length > 0) {
        materials.forEach(m => {
          html += `<div class="feed-card"><b>${m.title}</b><br>${m.content_text}</div>`;
        });
      } else {
        html += "<div class='feed-card'>Belum ada materi.</div>";
      }

      html += "<br><b>--- DISKUSI TERAKHIR ---</b><br>";
      if (discussions && discussions.length > 0) {
        discussions.forEach(d => {
          html += `<div class="feed-card"><b>${d.sender_name} (${d.role}):</b> ${d.message}</div>`;
        });
      } else {
        html += "<div class='feed-card'>Belum ada diskusi.</div>";
      }

      feed.innerHTML = html;
    } catch (err) {
      feed.innerText = "Gagal mengambil data dari Supabase.";
    }
  }

  $("btnRefreshData")?.addEventListener("click", loadDatabaseFeed);
  $("ruangBelajarBtn")?.addEventListener("click", () => {
    $("ruang-belajar-section").scrollIntoView({ behavior: "smooth" });
    loadDatabaseFeed();
  });
  $("aiButton")?.addEventListener("click", () => {
    $("ruang-belajar-section").scrollIntoView({ behavior: "smooth" });
    $("aiPrompt").focus();
  });

  // TEMA & DIALOG
  $("settingsButton")?.addEventListener("click", () => $("settingsOverlay").classList.add("show"));
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => $("settingsOverlay").classList.remove("show")));
  $("themeButton")?.addEventListener("click", () => {
    document.body.classList.toggle("dark");
  });

})();
</script>
</body>
</html>
