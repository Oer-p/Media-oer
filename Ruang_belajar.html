<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Ruang Belajar Bertingkat OoeR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='37' fill='none' stroke='%234285F4' stroke-width='15'/%3E%3C/svg%3E">

<style>
:root{
  --text:#202124;--muted:#5f6368;--border:#dfe1e5;
  --bg:#fff;--soft:#f8f9fa;--blue:#4285f4;
  --red:#ea4335;--yellow:#fbbc05;--green:#34a853;
  --shadow:0 1px 6px #20212430;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px
}
.container{width:min(100%,750px)}

.top-nav{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:20px}
.back-btn{padding:8px 14px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;text-decoration:none}
.back-btn:hover{background:var(--soft)}

.leaderboard-card{
  background:linear-gradient(135deg, #e8f0fe, #fce8e6);
  border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:24px;
  box-shadow:var(--shadow)
}
.leaderboard-card h3{margin:0 0 10px;font-size:16px;color:var(--text);display:flex;align-items:center;gap:6px}
.rank-list{display:grid;gap:6px}
.rank-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600}
.rank-empty{font-size:13px;color:var(--muted);text-align:center;padding:8px;background:var(--bg);border-radius:8px;}

h1{font-size:22px;margin:0 0 6px;text-align:center}
.subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px}

.subject-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.subject-tab{
  padding:8px 14px;border:1px solid var(--border);border-radius:12px;
  background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;font-weight:600
}
.subject-tab.active{background:var(--blue);border-color:var(--blue);color:white}

.quiz-info{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:600}
.question-card{
  background:var(--bg);border:1px solid var(--border);border-radius:14px;
  padding:18px;margin-bottom:16px;box-shadow:var(--shadow)
}
.question-card h3{font-size:15px;margin:0 0 12px;line-height:1.5}
.options{display:grid;gap:8px}
.option-label{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;background:var(--bg)
}
.option-label:hover{background:var(--soft)}
.option-label input{accent-color:var(--blue)}

.submit-section{text-align:center;margin:30px 0 50px}
.primary-btn{
  padding:14px 28px;border:0;border-radius:12px;background:var(--blue);
  color:white;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:var(--shadow)
}
.primary-btn:disabled{background:#bdc1c6;cursor:not-allowed;box-shadow:none}
.result-box{margin-top:20px;padding:16px;border-radius:12px;background:#e6f4ea;color:#137333;font-weight:bold;text-align:center;display:none}
</style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a class="back-btn" href="./index.html">← Kembali ke OoeR</a>
    <span id="userStatusInfo" style="font-size:12px;font-weight:600;color:var(--muted)">Status: Tamu</span>
  </div>

  <div class="leaderboard-card">
    <h3>🏆 Papan Peringkat Mingguan (Top 3)</h3>
    <div class="rank-list" id="rankList"></div>
  </div>

  <h1>Ruang Belajar Bertingkat OoeR</h1>
  <div class="subtitle">Bank Soal 1000+ & Pembaruan Otomatis Setiap Minggu</div>

  <div class="subject-tabs" id="subjectTabs">
    <button class="subject-tab active" data-subject="matematika">Matematika</button>
    <button class="subject-tab" data-subject="fisika">Fisika</button>
    <button class="subject-tab" data-subject="biologi">Biologi</button>
    <button class="subject-tab" data-subject="kimia">Kimia</button>
    <button class="subject-tab" data-subject="bhs_indonesia">B. Indonesia</button>
    <button class="subject-tab" data-subject="bhs_inggris">B. Inggris</button>
    <button class="subject-tab" data-subject="sejarah">Sejarah</button>
    <button class="subject-tab" data-subject="geografi">Geografi</button>
    <button class="subject-tab" data-subject="ekonomi">Ekonomi</button>
    <button class="subject-tab" data-subject="ppkn">PPKn</button>
  </div>

  <div class="quiz-info" id="quizInfo">Memuat soal dari bank data...</div>

  <form id="quizForm">
    <div id="questionsContainer"></div>
    
    <div class="submit-section">
      <button class="primary-btn" id="submitQuizBtn" type="button" disabled>Cek Nilai & Simpan Poin</button>
      <div class="result-box" id="resultBox"></div>
    </div>
  </form>
</div>

<!-- Memuat soal langsung dari file soal.js -->
<script src="./soal.js"></script>
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  let currentSubject = "matematika";

  function getActiveUser() {
    try {
      return JSON.parse(localStorage.getItem("oer_active_user")) || { name: "Pengguna Tamu", email: "guest" };
    } catch {
      return { name: "Pengguna Tamu", email: "guest" };
    }
  }

  function getLeaderboardData() {
    let scores = JSON.parse(localStorage.getItem("oer_leaderboard")) || [];
    return scores.sort((a, b) => b.score - a.score).slice(0, 3);
  }

  function renderLeaderboard() {
    const list = $("rankList");
    list.replaceChildren();
    const topScores = getLeaderboardData();

    if (topScores.length === 0) {
      const emptyMsg = document.createElement("div");
      emptyMsg.className = "rank-empty";
      emptyMsg.textContent = "Belum ada ranking. Jadilah yang pertama mendapatkan nilai tinggi!";
      list.appendChild(emptyMsg);
      return;
    }

    topScores.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "rank-item";
      row.innerHTML = `<span>#${index+1} ${item.name}</span> <span style="color:var(--blue)">${item.score} Poin</span>`;
      list.appendChild(row);
    });
  }

  function getWeeklyRotatedQuestions(allQuestions) {
    if (!allQuestions || allQuestions.length === 0) return [];
    
    const now = new Date();
    const startOfYear = new Date(now.getFullYear(), 0, 1);
    const weekNumber = Math.ceil(((now - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
    
    const startIndex = (weekNumber * 5) % allQuestions.length;
    let rotated = [];
    for (let i = 0; i < Math.min(5, allQuestions.length); i++) {
      rotated.push(allQuestions[(startIndex + i) % allQuestions.length]);
    }
    return rotated;
  }

  function initQuiz() {
    if (typeof globalBankSoal === "undefined") {
      $("quizInfo").textContent = "Gagal memuat bank soal. Pastikan file soal.js tersedia dan mendefinisikan globalBankSoal.";
      return;
    }
    renderQuiz(currentSubject);
  }

  function renderQuiz(subject) {
    currentSubject = subject;
    const container = $("questionsContainer");
    container.replaceChildren();
    $("resultBox").style.display = "none";
    $("submitQuizBtn").disabled = true;

    const rawQuestions = globalBankSoal[subject] || [];
    const questions = getWeeklyRotatedQuestions(rawQuestions);

    if (questions.length === 0) {
      $("quizInfo").textContent = "Belum ada soal untuk mata pelajaran ini.";
      return;
    }

    $("quizInfo").textContent = `${subject.toUpperCase().replace('_', ' ')} | Rotasi Minggu Ini (${questions.length} Soal)`;

    questions.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "question-card";
      
      let optionsHtml = "";
      item.options.forEach((opt, optIndex) => {
        optionsHtml += `
          <label class="option-label">
            <input type="radio" name="q_${item.id}" value="${optIndex}" data-qid="${item.id}">
            <span>${opt}</span>
          </label>
        `;
      });

      card.innerHTML = `<h3>${index + 1}. ${item.q}</h3><div class="options">${optionsHtml}</div>`;
      container.appendChild(card);
    });

    const allInputs = container.querySelectorAll("input[type='radio']");
    allInputs.forEach(input => {
      input.addEventListener("change", checkAllAnswered);
    });
  }

  function checkAllAnswered() {
    const rawQuestions = globalBankSoal[currentSubject] || [];
    const questions = getWeeklyRotatedQuestions(rawQuestions);
    let answeredCount = 0;

    questions.forEach(item => {
      const answered = document.querySelector(`input[name="q_${item.id}"]:checked`);
      if (answered) answeredCount++;
    });

    $("submitQuizBtn").disabled = (answeredCount < questions.length);
  }

  $("submitQuizBtn").addEventListener("click", () => {
    const rawQuestions = globalBankSoal[currentSubject] || [];
    const questions = getWeeklyRotatedQuestions(rawQuestions);
    let score = 0;

    questions.forEach(item => {
      const selected = document.querySelector(`input[name="q_${item.id}"]:checked`);
      if (selected && parseInt(selected.value) === item.correct) {
        score += 100;
      }
    });

    const user = getActiveUser();
    let leaderboard = JSON.parse(localStorage.getItem("oer_leaderboard")) || [];
    
    let existingUser = leaderboard.find(u => u.name === user.name);
    if (existingUser) {
      existingUser.score += score;
    } else {
      leaderboard.push({ name: user.name, score: score });
    }

    localStorage.setItem("oer_leaderboard", JSON.stringify(leaderboard));
    renderLeaderboard();

    const resultBox = $("resultBox");
    resultBox.style.display = "block";
    resultBox.textContent = `🎉 Kuis Selesai! Kamu mendapatkan ${score} Poin. Poin tersimpan dan papan peringkat diperbarui!`;
    window.scrollTo({top: document.body.scrollHeight, behavior: "smooth"});
  });

  document.querySelectorAll(".subject-tab").forEach(tab => {
    tab.addEventListener("click", (e) => {
      document.querySelectorAll(".subject-tab").forEach(t => t.classList.remove("active"));
      e.target.classList.add("active");
      renderQuiz(e.target.dataset.subject);
    });
  });

  const activeUser = getActiveUser();
  if (activeUser && activeUser.name !== "Pengguna Tamu") {
    $("userStatusInfo").textContent = `Akun: ${activeUser.name}`;
  }

  renderLeaderboard();
  initQuiz();

})();
</script>

</body>
</html>
