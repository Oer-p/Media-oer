<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OoeR Blog & Creator Space</title>
<style>
  :root {
    --bg: #ffffff; --text: #1a1a1a; --muted: #666666; --border: #e0e0e0;
    --card-bg: #f9f9f9; --primary: #1a73e8; --primary-hover: #1557b0;
    --shadow: 0 4px 12px rgba(0,0,0,0.05);
  }
  body.dark {
    --bg: #18191a; --text: #e4e6eb; --muted: #b0b3b8; --border: #383a3f;
    --card-bg: #242526; --primary: #4dabf7; --primary-hover: #3b82f6;
    --shadow: 0 4px 12px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;flex-direction:column;
  }
  /* Navigasi Atas */
  header{
    display:flex;align-items:center;justify-content:space-between;padding:16px 32px;
    border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--text);}
  .brand-dot{
    width:28px;height:28px;border-radius:50%;display:inline-block;
    background:conic-gradient(#ea4335 0deg 90deg, #fbbc05 90deg 180deg, #34a853 180deg 270deg, #4285f4 270deg 360deg);
  }
  .nav-btns{display:flex;gap:10px;align-items:center;}
  .btn{
    padding:8px 18px;border-radius:20px;border:1px solid var(--border);background:var(--bg);
    color:var(--text);font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;transition:0.2s;
  }
  .btn:hover{background:var(--card-bg);}
  .btn-primary{background:var(--primary);color:white;border-color:transparent;}
  .btn-primary:hover{background:var(--primary-hover);}

  main{width:min(100%, 800px);margin:30px auto;flex:1;padding:0 20px;}

  /* Header Blog */
  .blog-intro{text-align:center;margin-bottom:35px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  .blog-intro h1{margin:0 0 10px;font-size:32px;font-weight:800;}
  .blog-intro p{margin:0;color:var(--muted);font-size:15px;}

  /* Tab Kategori Blog */
  .categories{display:flex;gap:8px;justify-content:center;margin-bottom:30px;flex-wrap:wrap;}
  .cat-tab{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:13px;cursor:pointer;}
  .cat-tab.active{background:var(--primary);color:white;border-color:transparent;}

  /* Daftar Postingan Blog (Feed) */
  .feed{display:flex;flex-direction:column;gap:24px;}
  .post-card{
    background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:24px;
    box-shadow:var(--shadow);transition:transform 0.2s;
  }
  .post-card:hover{transform:translateY(-2px);}
  .post-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .tag{background:rgba(26,115,232,0.1);color:var(--primary);padding:3px 8px;border-radius:6px;font-weight:bold;}
  .post-card h2{margin:0 0 10px;font-size:22px;line-height:1.3;cursor:pointer;}
  .post-card h2:hover{color:var(--primary);}
  .post-snippet{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  
  /* Modal Tulis Artikel / Blog Baru */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;padding:20px;}
  .overlay.show{display:flex;}
  .modal{
    width:min(100%, 700px);background:var(--bg);color:var(--text);padding:30px;border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto;border:1px solid var(--border);
  }
  .form-group{margin-bottom:16px;}
  .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .form-control{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;}
  .form-control:focus{border-color:var(--primary);outline:none;}

  footer{text-align:center;padding:24px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;margin-top:50px;}
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <span class="brand-dot"></span>
    <span>OoeR Blog</span>
  </a>
  <div class="nav-btns">
    <button class="btn" onclick="location.href='index.html'">Beranda</button>
    <button class="btn btn-primary" onclick="openEditor()">✍️ Tulis Artikel</button>
  </div>
</header>

<main>
  <div class="blog-intro">
    <h1>Ruang Publikasi & Artikel OoeR</h1>
    <p>Baca catatan, tutorial, cerita, dan bagikan karya tulisanmu sendiri ke komunitas.</p>
  </div>

  <!-- Filter Kategori -->
  <div class="categories">
    <button class="cat-tab active" onclick="filterBlog('semua', this)">Semua Tulisan</button>
    <button class="cat-tab" onclick="filterBlog('Teknologi', this)">💻 Teknologi & Kode</button>
    <button class="cat-tab" onclick="filterBlog('Edukasi', this)">📚 Edukasi & Belajar</button>
    <button class="cat-tab" onclick="filterBlog('Opini', this)">💡 Opini & Catatan</button>
  </div>

  <!-- Feed Artikel -->
  <div class="feed" id="blogFeed"></div>
</main>

<footer>
  <p>© 2026 OoeR Blog Platform · Terintegrasi dengan OoeR Search</p>
</footer>

<!-- MODAL EDITOR BLOG (Blogger / Medium Style) -->
<div class="overlay" id="editorModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2 style="margin:0;font-size:20px;">Tulis Artikel / Blog Baru</h2>
      <button class="btn" style="padding:4px 10px;" onclick="closeEditor()">✕</button>
    </div>
    <form id="blogForm">
      <div class="form-group">
        <label>Nama Penulis / Kreator</label>
        <input type="text" id="authorName" class="form-control" required placeholder="Contoh: Arip Rahman">
      </div>
      <div class="form-group">
        <label>Judul Artikel</label>
        <input type="text" id="blogTitle" class="form-control" required placeholder="Contoh: Cara Mudah Memahami Logika Pemrograman Web">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="blogCategory" class="form-control">
          <option value="Teknologi">💻 Teknologi & Kode</option>
          <option value="Edukasi">📚 Edukasi & Belajar</option>
          <option value="Opini">💡 Opini & Catatan</option>
        </select>
      </div>
      <div class="form-group">
        <label>URL Foto Sampul (Opsional)</label>
        <input type="url" id="blogImage" class="form-control" placeholder="https://images.unsplash.com/...">
      </div>
      <div class="form-group">
        <label>Isi Artikel Lengkap</label>
        <textarea id="blogContent" class="form-control" rows="8" required placeholder="Tulis isi artikel kamu di sini secara lengkap..."></textarea>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button type="button" class="btn" onclick="closeEditor()">Batal</button>
        <button type="submit" class="btn btn-primary">Terbitkan Sekarang 🚀</button>
      </div>
    </form>
  </div>
</div>

<script>
(() => {
  "use strict";

  const defaultPosts = [
    {
      id: "p1",
      title: "Membangun Ekosistem Browser Web Sendiri di GitHub Pages",
      category: "Teknologi",
      author: "Arip Rahman",
      date: "21 Oktober 2026",
      image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=700&auto=format&fit=crop",
      content: "Membuat platform web sendiri memberikan kebebasan penuh dalam mengatur fitur, penyimpanan lokal, hingga sistem pencarian. Dengan memanfaatkan HTML, CSS, dan JavaScript murni, kita bisa menciptakan browser mini yang fungsional tanpa server yang rumit."
    }
  ];

  function getPosts() {
    try {
      const stored = JSON.parse(localStorage.getItem("oer_blog_posts") || "null");
      if (Array.isArray(stored) && stored.length > 0) return stored;
    } catch {}
    localStorage.setItem("oer_blog_posts", JSON.stringify(defaultPosts));
    return defaultPosts;
  }

  let currentCategory = "semua";

  function renderFeed() {
    const feed = document.getElementById("blogFeed");
    const posts = getPosts();
    const filtered = posts.filter(p => currentCategory === "semua" || p.category === currentCategory);

    feed.replaceChildren();

    if (!filtered.length) {
      feed.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted);">Belum ada tulisan di kategori ini.</div>`;
      return;
    }

    filtered.forEach(p => {
      const card = document.createElement("article");
      card.className = "post-card";
      card.innerHTML = `
        <div class="post-meta">
          <span class="tag">${p.category}</span>
          <span>${p.date} • Oleh <b>${p.author}</b></span>
        </div>
        <h2>${p.title}</h2>
        ${p.image ? `<img src="${p.image}" alt="Cover" style="width:100%;height:180px;object-fit:cover;border-radius:8px;margin-bottom:12px;" onerror="this.style.display='none'">` : ""}
        <p class="post-snippet">${p.content}</p>
        <div style="display:flex;justify-content:flex-end;">
          <span style="font-size:13px;color:var(--primary);font-weight:600;cursor:pointer;" onclick="alert('${p.content.replace(/'/g, "\\'")}')">Baca Selengkapnya →</span>
        </div>
      `;
      feed.appendChild(card);
    });
  }

  window.filterBlog = (cat, btn) => {
    currentCategory = cat;
    document.querySelectorAll(".cat-tab").forEach(t => t.classList.toggle("active", t === btn));
    renderFeed();
  };

  window.openEditor = () => document.getElementById("editorModal").classList.add("show");
  window.closeEditor = () => document.getElementById("editorModal").classList.remove("show");

  document.getElementById("blogForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const newPost = {
      id: "post_" + Date.now(),
      title: document.getElementById("blogTitle").value.trim(),
      category: document.getElementById("blogCategory").value,
      author: document.getElementById("authorName").value.trim(),
      date: new Date().toLocaleDateString("id-ID", { day: 'numeric', month: 'long', year: 'numeric' }),
      image: document.getElementById("blogImage").value.trim(),
      content: document.getElementById("blogContent").value.trim()
    };

    const posts = getPosts();
    posts.unshift(newPost);
    localStorage.setItem("oer_blog_posts", JSON.stringify(posts));

    // Sinkronisasi otomatis ke search.html
    try {
      const history = JSON.parse(localStorage.getItem("oer_search_history") || "[]");
      if (!history.includes(newPost.title)) {
        history.unshift(newPost.title);
        localStorage.setItem("oer_search_history", JSON.stringify(history));
      }
    } catch {}

    alert("🎉 Berhasil! Artikel blog kamu telah diterbitkan.");
    document.getElementById("blogForm").reset();
    closeEditor();
    renderFeed();
  });

  renderFeed();
})();
</script>

</body>
</html>
