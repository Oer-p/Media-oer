<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OoeR Space — Portal Kreator & Publikasi Profesional</title>
<style>
  :root {
    --primary: #1a73e8;
    --bg: #f8f9fa;
    --card: #ffffff;
    --text: #202124;
    --border: #dadce0;
    --muted: #5f6368;
    --danger: #d93025;
    --success: #188038;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 60px; }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand-area { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo-o {
    width: 24px; height: 24px; border-radius: 50%;
    background: conic-gradient(#4285f4 0 120deg, #fbbc05 120deg 235deg, #ea4335 235deg 300deg, #34a853 300deg);
    position: relative; flex-shrink: 0;
  }
  .logo-o::after { content: ""; position: absolute; inset: 5px; background: var(--card); border-radius: 50%; }
  .brand-title { font-size: 16px; font-weight: bold; color: var(--text); }

  .header-btns { display: flex; align-items: center; gap: 6px; }
  .btn-sm {
    padding: 6px 12px; font-size: 12px; border-radius: 18px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    text-decoration: none; color: var(--text); font-weight: 500;
  }
  .btn-sm.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

  .container { max-width: 900px; margin: 16px auto; padding: 0 12px; }

  /* AUTH */
  .auth-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px; max-width: 420px; margin: 40px auto; text-align: center;
  }
  .auth-input {
    width: 100%; padding: 12px; font-size: 14px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 12px; outline: none;
  }
  .btn-auth {
    width: 100%; padding: 12px; background: var(--primary); color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
  }

  /* EDITOR CONTAINER */
  .editor-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .input-title {
    width: 100%; padding: 12px; font-size: 18px; font-weight: bold;
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  .editor-tools {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
    background: #f1f3f4; border-radius: 8px; align-items: center;
  }
  .tool-btn {
    padding: 6px 10px; font-size: 12px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; cursor: pointer;
  }
  .tool-btn.active { background: var(--primary); color: #fff; }

  .editor-textarea {
    width: 100%; min-height: 380px; padding: 14px; font-size: 15px; line-height: 1.6;
    border: 1px solid var(--border); border-radius: 8px; outline: none; resize: vertical;
    font-family: monospace;
  }

  /* UPLOAD GAMBAR & PENGATURAN TEMA */
  .extra-settings {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  @media(max-width: 600px) { .extra-settings { grid-template-columns: 1fr; } }
  
  .setting-box { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; background: #fafafa; }
  .setting-box h4 { font-size: 12px; margin-bottom: 6px; color: var(--muted); }
  .setting-box input, .setting-box select { width: 100%; padding: 8px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; }

  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  .btn-action { padding: 10px 20px; font-size: 14px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; }
  .btn-cancel { background: #e8eaed; color: var(--text); }
  .btn-publish { background: var(--success); color: #fff; transition: 0.2s; }
  .btn-publish:hover { opacity: 0.9; transform: scale(1.02); }

  /* DAFTAR PUBLIKASI SAYA */
  .my-articles-section { margin-top: 30px; }
  .section-title { font-size: 18px; margin-bottom: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  .article-list { display: flex; flex-direction: column; gap: 10px; }
  .article-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .article-info h4 { font-size: 15px; margin-bottom: 4px; color: var(--text); }
  .article-info p { font-size: 12px; color: var(--muted); }
  .article-item-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-icon {
    padding: 6px 10px; font-size: 12px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; cursor: pointer; text-decoration: none; color: var(--text);
  }
  .btn-icon.danger { color: var(--danger); border-color: #fce8e6; }

  /* EFEK NOTIFIKASI SUKSES */
  #successModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-content {
    background: #fff; padding: 25px 30px; border-radius: 14px; text-align: center; max-width: 320px; width: 90%;
    animation: popUp 0.3s ease-out;
  }
  @keyframes popUp { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* TEMA BACA ARTIKEL ALA BLOGGER */
  .read-container { border-radius: 12px; padding: 30px; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  /* Tema 1: Clean White (Default) */
  .theme-clean { background: #ffffff; color: #202124; border: 1px solid var(--border); }
  /* Tema 2: Dark Elegant */
  .theme-dark { background: #181a1f; color: #abb2bf; border: 1px solid #373b44; }
  /* Tema 3: Warm Paper */
  .theme-warm { background: #fdfaf6; color: #5c4033; border: 1px solid #e3dcd2; }

  .read-title { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
  .read-meta { font-size: 13px; opacity: 0.8; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .read-banner { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 20px; }
  .read-content { font-size: 16px; line-height: 1.8; overflow-wrap: anywhere; }
</style>
</head>
<body>

<header>
  <a href="website.html" class="brand-area">
    <div class="logo-o"></div>
    <span class="brand-title">OoeR Space</span>
  </a>
  <div class="header-btns" id="headerUserArea"></div>
</header>

<main class="container">

  <!-- 1. LOGIN / DAFTAR -->
  <div id="authArea" class="auth-card" style="display:none;">
    <h2>Masuk OoeR Account</h2>
    <p style="color:var(--muted); font-size:13px; margin:10px 0 20px;">Masukan nama kreator kamu untuk mulai mengelola artikel.</p>
    <form onsubmit="handleLogin(event)">
      <input type="text" id="usernameInput" class="auth-input" placeholder="Nama Kreator..." required autocomplete="off">
      <button type="submit" class="btn-auth">Masuk & Mulai Menulis 🚀</button>
    </form>
  </div>

  <!-- 2. EDITOR UTAMA -->
  <div id="editorArea" style="display:none;">
    <div class="editor-card">
      <input type="hidden" id="editArticleId" value="">
      <input type="text" id="articleTitle" class="input-title" placeholder="Judul Artikel Utama...">
      
      <div class="editor-tools">
        <select id="articleCategory" class="tool-btn">
          <option>💻 Teknologi & Kode</option>
          <option>📖 Sastra & Puisi</option>
          <option>📰 Berita & Umum</option>
        </select>
        <select id="articleTheme" class="tool-btn">
          <option value="theme-clean">🎨 Tema: Clean White</option>
          <option value="theme-dark">🌙 Tema: Dark Elegant</option>
          <option value="theme-warm">📜 Tema: Warm Paper</option>
        </select>
        <button class="tool-btn" type="button" onclick="insertFormat('<b>', '</b>')"><b>B</b></button>
        <button class="tool-btn" type="button" onclick="insertFormat('<i>', '</i>')"><i>I</i></button>
        <button class="tool-btn" type="button" onclick="insertFormat('<div class=&quot;code-block&quot;>', '</div>')">💻 Blok Kode</button>
      </div>

      <!-- LAYAR KETIK (HTML, CSS, JS LENGKAP) -->
      <textarea id="articleContent" class="editor-textarea" placeholder="Tulis artikel atau sisipkan kode HTML / CSS / JS lengkap di sini..."></textarea>

      <!-- PENGATURAN TAMBAHAN (FOTO & HALAMAN SAMBUNG) -->
      <div class="extra-settings">
        <div class="setting-box">
          <h4>🖼️ Foto Sampul (Upload/URL PNG/JPG)</h4>
          <input type="file" id="imageUploadInput" accept="image/*" onchange="handleImageUpload(event)" style="margin-bottom:6px;">
          <input type="text" id="articleImage" placeholder="Atau ketik URL Gambar...">
        </div>
        <div class="setting-box">
          <h4>📑 Pengaturan Halaman Sambung</h4>
          <input type="text" id="nextPageUrl" placeholder="Tautan Halaman Berikutnya (Opsional)">
        </div>
      </div>

      <div class="actions">
        <button class="btn-action btn-cancel" type="button" onclick="resetEditor()">Batal / Bersihkan</button>
        <button class="btn-action btn-publish" type="button" onclick="publishArticle()">Publikasikan Artikel ✨</button>
      </div>
    </div>

    <!-- DAFTAR PUBLIKASI SAYA -->
    <section class="my-articles-section">
      <div class="section-title">
        <span>📚 Daftar Publikasi Saya</span>
        <span id="creatorInfoTag" style="font-size:12px; color:var(--muted); font-weight:normal;"></span>
      </div>
      <div id="myArticlesList" class="article-list"></div>
    </section>
  </div>

  <!-- 3. MODE BACA ARTIKEL (PRATINJAU / READER) -->
  <div id="readerArea" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <a href="website.html" style="color:var(--primary); font-weight:bold; text-decoration:none;">⬅ Kembali ke Dashboard Kreator</a>
      <a href="search.html" style="color:var(--primary); font-weight:bold; text-decoration:none;">🔍 Cari di OoeR Search</a>
    </div>
    <div id="readerWrapper" class="read-container">
      <h1 id="readTitle" class="read-title"></h1>
      <div id="readMeta" class="read-meta"></div>
      <img id="readBanner" class="read-banner" src="" alt="" style="display:none;">
      <div id="readContent" class="read-content"></div>
      <div id="readNextPage" style="margin-top:35px;"></div>
    </div>
  </div>

</main>

<script>
  let uploadedImageBase64 = "";

  function insertFormat(start, end) {
    const ta = document.getElementById("articleContent");
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.substring(0, s) + start + ta.value.substring(s, e) + end + ta.value.substring(e);
    ta.focus();
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        uploadedImageBase64 = uploadEvent.target.result;
        document.getElementById("articleImage").value = uploadedImageBase64;
      };
      reader.readAsDataURL(file);
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById("usernameInput").value.trim();
    if (!u) return;
    localStorage.setItem("oer_logged_user", u);
    checkAuthStatus();
  }

  function logout() {
    if (confirm("Keluar dari akun?")) {
      localStorage.removeItem("oer_logged_user");
      checkAuthStatus();
    }
  }

  function checkAuthStatus() {
    const user = localStorage.getItem("oer_logged_user");
    const header = document.getElementById("headerUserArea");
    const params = new URLSearchParams(location.search);
    if (params.get("view")) return;

    if (!user) {
      document.getElementById("authArea").style.display = "block";
      document.getElementById("editorArea").style.display = "none";
      header.innerHTML = `<a href="search.html" class="btn-sm">🔍 Search</a><a href="index.html" class="btn-sm">🏠 Beranda</a>`;
    } else {
      document.getElementById("authArea").style.display = "none";
      document.getElementById("editorArea").style.display = "block";
      header.innerHTML = `<span style="font-size:13px; font-weight:bold;">👤 ${user}</span><button onclick="logout()" class="btn-sm" style="color:var(--danger)">Keluar</button><a href="search.html" class="btn-sm">🔍 Search</a>`;
      document.getElementById("creatorInfoTag").textContent = `Masuk sebagai: ${user}`;
      renderMyArticles();
    }
  }

  function publishArticle() {
    const idField = document.getElementById("editArticleId").value;
    const title = document.getElementById("articleTitle").value.trim();
    const content = document.getElementById("articleContent").value.trim();
    const category = document.getElementById("articleCategory").value;
    const theme = document.getElementById("articleTheme").value;
    const image = document.getElementById("articleImage").value.trim() || uploadedImageBase64;
    const nextPage = document.getElementById("nextPageUrl").value.trim();
    const author = localStorage.getItem("oer_logged_user") || "Kreator";

    if (!title || !content) {
      alert("Judul dan isi artikel wajib diisi!");
      return;
    }

    const uniqueId = idField || ("art_" + Date.now());
    const articleObj = {
      id: uniqueId,
      title, category, content, theme, image, nextPage, author,
      url: `website.html?view=${uniqueId}`,
      date: new Date().toLocaleDateString("id-ID", { day: 'numeric', month: 'short', year: 'numeric' })
    };

    let list = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
    if (idField) {
      list = list.map(item => item.id === idField ? articleObj : item);
    } else {
      list.unshift(articleObj);
    }
    localStorage.setItem("oer_user_websites", JSON.stringify(list));

    showSuccessPopup();
  }

  function showSuccessPopup() {
    const modal = document.createElement("div");
    modal.id = "successModal";
    modal.innerHTML = `
      <div class="modal-content">
        <h3 style="color:var(--success); margin-bottom:8px;">✨ Berhasil Dipublikasikan!</h3>
        <p style="font-size:13px; color:var(--muted); margin-bottom:15px;">Artikel kamu tersimpan dan terhubung ke OoeR Search.</p>
        <button onclick="closeModalAndRedirect()" style="padding:8px 16px; background:var(--primary); color:#fff; border:0; border-radius:6px; font-weight:bold; cursor:pointer;">Lihat Daftar Publikasi</button>
      </div>
    `;
    document.body.appendChild(modal);
  }

  function closeModalAndRedirect() {
    const m = document.getElementById("successModal");
    if (m) m.remove();
    resetEditor();
    checkAuthStatus();
  }

  function resetEditor() {
    document.getElementById("editArticleId").value = "";
    document.getElementById("articleTitle").value = "";
    document.getElementById("articleContent").value = "";
    document.getElementById("articleImage").value = "";
    document.getElementById("nextPageUrl").value = "";
    uploadedImageBase64 = "";
  }

  function renderMyArticles() {
    const container = document.getElementById("myArticlesList");
    const user = localStorage.getItem("oer_logged_user");
    const all = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
    const mine = all.filter(a => a.author === user);

    if (mine.length === 0) {
      container.innerHTML = `<div style="padding:20px; text-align:center; color:var(--muted); background:#fff; border:1px dashed var(--border); border-radius:10px;">Belum ada artikel. Tulis di atas sekarang!</div>`;
      return;
    }

    container.innerHTML = "";
    mine.forEach(item => {
      const card = document.createElement("div");
      card.className = "article-item";
      card.innerHTML = `
        <div class="article-info">
          <h4>${item.title}</h4>
          <p><span>${item.category}</span> • ${item.date}</p>
        </div>
        <div class="article-item-btns">
          <a href="website.html?view=${item.id}" class="btn-icon">👁️ Pratinjau</a>
          <button class="btn-icon" onclick="editArticle('${item.id}')">✏️ Edit</button>
          <button class="btn-icon danger" onclick="deleteArticle('${item.id}')">🗑️ Hapus</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function editArticle(id) {
    const all = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
    const target = all.find(a => a.id === id);
    if (target) {
      document.getElementById("editArticleId").value = target.id;
      document.getElementById("articleTitle").value = target.title;
      document.getElementById("articleCategory").value = target.category || "💻 Teknologi & Kode";
      document.getElementById("articleTheme").value = target.theme || "theme-clean";
      document.getElementById("articleContent").value = target.content;
      document.getElementById("articleImage").value = target.image || "";
      document.getElementById("nextPageUrl").value = target.nextPage || "";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function deleteArticle(id) {
    if (confirm("Hapus artikel ini dari publikasi?")) {
      let all = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
      all = all.filter(a => a.id !== id);
      localStorage.setItem("oer_user_websites", JSON.stringify(all));
      renderMyArticles();
    }
  }

  window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(location.search);
    const viewId = params.get("view");

    if (viewId) {
      const all = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
      const target = all.find(a => a.id === viewId);

      if (target) {
        document.getElementById("authArea").style.display = "none";
        document.getElementById("editorArea").style.display = "none";
        document.getElementById("readerArea").style.display = "block";
        document.getElementById("headerUserArea").innerHTML = `<a href="search.html" class="btn-sm">🔍 OoeR Search</a><a href="website.html" class="btn-sm primary">✍️ Tulis Baru</a>`;

        document.getElementById("readerWrapper").className = "read-container " + (target.theme || "theme-clean");
        document.getElementById("readTitle").innerText = target.title;
        document.getElementById("readMeta").innerHTML = `<span>Kategori: <b>${target.category}</b></span> • <span>Penulis: <b>${target.author}</b></span> • <span>${target.date}</span>`;
        
        if (target.image) {
          const img = document.getElementById("readBanner");
          img.src = target.image;
          img.style.display = "block";
        }

        document.getElementById("readContent").innerHTML = target.content;

        if (target.nextPage) {
          document.getElementById("readNextPage").innerHTML = `<a href="${target.nextPage}" style="display:inline-block; padding:10px 20px; background:var(--primary); color:#fff; text-decoration:none; border-radius:8px; font-weight:bold;">Lanjut ke Halaman Berikutnya ➡️</a>`;
        }
      } else {
        alert("Artikel tidak ditemukan.");
        location.href = "website.html";
      }
    } else {
      checkAuthStatus();
    }
  });
</script>

</body>
</html>
