<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17191d">
<title>OoeR Website — Portal Kreator</title>
<style>
:root{--bg:#17191d;--panel:#202329;--text:#f1f3f4;--muted:#aeb4bf;--border:#373b44;--blue:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:#111317}
.brand{font-size:22px;font-weight:800;color:var(--blue);text-decoration:none}
.container{max-width:800px;margin:20px auto;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
input,textarea,select{width:100%;padding:12px;margin-top:8px;margin-bottom:16px;background:#17191d;border:1px solid var(--border);color:var(--text);border-radius:8px;font:inherit}
button{padding:10px 18px;border:0;border-radius:8px;background:var(--blue);color:#17191d;font-weight:bold;cursor:pointer}
button:hover{opacity:0.9}
.tabs-editor{display:flex;gap:8px;margin-bottom:12px}
.tab-btn{background:#2e3239;color:var(--text);flex:1}
.tab-btn.active{background:var(--blue);color:#17191d}

/* TAMPILAN PEMBACA ARTIKEL (READER VIEW) DENGAN BANNER GAMBAR & GAYA ELEGAN */
.read-container {
  width: 100%;
  max-width: 800px;
  margin: 20px auto;
  padding: 30px 24px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  box-sizing: border-box;
}
.read-container h1, .read-title {
  font-size: 30px;
  line-height: 1.35;
  word-break: break-word;
  margin-bottom: 14px;
  color: var(--text);
}
.read-meta {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 14px;
}
.read-banner {
  width: 100%;
  max-height: 380px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
  display: none;
}
.read-content {
  font-size: 16px;
  line-height: 1.9;
  color: #d2d5da;
  word-break: break-word;
}
.read-content h2 { font-size: 22px; color: var(--blue); margin-top: 32px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.read-content p { margin-bottom: 18px; text-align: justify; }
.read-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 14px 0; border: 1px solid var(--border); }
.read-content blockquote { border-left: 4px solid var(--blue); padding: 12px 16px; margin: 20px 0; background: #252932; border-radius: 0 8px 8px 0; font-style: italic; color: #e8eaed; }
.read-content .code-box { background: #111317; color: #9cdcfe; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 14px; overflow-x: auto; margin: 20px 0; border: 1px solid var(--border); }

.read-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 35px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
@media(max-width:600px){
  .read-container{padding:16px}
  .read-container h1{font-size:24px}
}
</style>
</head>
<body>

<header>
  <a class="brand" href="./">OoeR Space</a>
  <div id="headerUserArea"></div>
</header>

<main class="container">
  <!-- AREA AUTENTIKASI KREATOR -->
  <div id="authArea" class="card">
    <h2>Masuk sebagai Kreator</h2>
    <p style="color:var(--muted);font-size:14px;margin-bottom:14px;">Masukkan nama kreator kamu untuk mulai menulis dan mempublikasikan karya.</p>
    <input type="text" id="creatorNameInput" placeholder="Contoh: Leilani">
    <button type="button" onclick="loginCreator()">Masuk ke Portal</button>
  </div>

  <!-- AREA EDITOR ARTIKEL -->
  <div id="editorArea" class="card" style="display:none;">
    <h2 id="editorHeading">Tulis Karya Baru</h2>
    <input type="hidden" id="editArticleId">
    
    <label>Judul Artikel (Wajib minimal 2 kalimat):</label>
    <input type="text" id="articleTitle" placeholder="Contoh: Mengenal Ekosistem OoeR. Inilah Solusi Portal Kreator Mandiri!">

    <div style="display:flex;gap:12px;">
      <div style="flex:1;">
        <label>Kategori:</label>
        <select id="articleCategory">
          <option value="📰 Berita & Umum">📰 Berita & Umum</option>
          <option value="💻 Teknologi & Kode">💻 Teknologi & Kode</option>
          <option value="📚 Pendidikan">📚 Pendidikan</option>
          <option value="🎨 Seni & Kreatif">🎨 Seni & Kreatif</option>
        </select>
      </div>
      <div style="flex:1;">
        <label>Tema Tampilan:</label>
        <select id="articleTheme">
          <option value="theme-dark">Dark Elegant</option>
          <option value="theme-clean">Clean White</option>
          <option value="theme-warm">Warm Paper</option>
        </select>
      </div>
    </div>

    <label>URL Foto Sampul (Banner Utama):</label>
    <input type="text" id="articleImage" placeholder="https://images.unsplash.com/...">

    <label>Isi Konten Artikel (Dibagi Menjadi 2 Halaman):</label>
    <div class="tabs-editor">
      <button type="button" class="tab-btn active" id="tabBtn1" onclick="switchEditorTab(0)">Halaman 1</button>
      <button type="button" class="tab-btn" id="tabBtn2" onclick="switchEditorTab(1)">Halaman 2</button>
    </div>
    <textarea id="articleContentBox" rows="10" placeholder="Tulis konten HTML atau teks di sini..."></textarea>

    <div style="display:flex;gap:10px;margin-top:10px;">
      <button type="button" onclick="publishArticle()" style="background:#34a853;color:#fff;">Publikasikan Artikel ✨</button>
      <button type="button" onclick="resetEditor()" style="background:#ea4335;color:#fff;">Batal</button>
    </div>

    <hr style="border:0;border-top:1px solid var(--border);margin:25px 0;">

    <h3>Karya Saya yang Dipublikasikan</h3>
    <div id="myArticlesList" style="margin-top:12px;"></div>
  </div>

  <!-- AREA PEMBACA ARTIKEL (READER VIEW) -->
  <div id="readerArea" style="display:none;">
    <div id="readerWrapper" class="read-container">
      <h1 id="readTitle" class="read-title"></h1>
      <div id="readMeta" class="read-meta"></div>
      <img id="readBanner" class="read-banner" alt="Foto Sampul Artikel">
      <div id="readContent" class="read-content"></div>
      
      <div class="read-nav">
        <button type="button" id="prevPageBtn" onclick="changeReaderPage(-1)" style="display:none;">← Halaman Sebelumnya</button>
        <span id="pageIndicator" style="font-size:13px;color:var(--muted);"></span>
        <button type="button" id="nextPageBtn" onclick="changeReaderPage(1)" style="display:none;">Halaman Selanjutnya →</button>
      </div>
    </div>
  </div>
</main>

<script>
let articlePages = ["", ""];
let currentEditorIndex = 0;
let currentReaderPages = [];
let currentReaderIndex = 0;

function loginCreator(){
  const name = document.getElementById("creatorNameInput").value.trim();
  if(!name){ alert("Masukkan nama kreator terlebih dahulu!"); return; }
  localStorage.setItem("oer_logged_user", name);
  checkAuthStatus();
}

function checkAuthStatus(){
  const user = localStorage.getItem("oer_logged_user");
  if(user){
    document.getElementById("authArea").style.display = "none";
    document.getElementById("editorArea").style.display = "block";
    document.getElementById("headerUserArea").innerHTML = `<span>Halo, <b>${user}</b></span> <a href="search.html" style="color:var(--blue);margin-left:12px;text-decoration:none;">🔍 OoeR Search</a> <button onclick="logout()" style="margin-left:10px;padding:4px 10px;font-size:12px;">Keluar</button>`;
    renderMyArticles();
  } else {
    document.getElementById("authArea").style.display = "block";
    document.getElementById("editorArea").style.display = "none";
  }
}

function logout(){
  localStorage.removeItem("oer_logged_user");
  checkAuthStatus();
}

function switchEditorTab(index){
  saveCurrentPageContent();
  currentEditorIndex = index;
  document.getElementById("articleContentBox").value = articlePages[index];
  document.getElementById("tabBtn1").className = index === 0 ? "tab-btn active" : "tab-btn";
  document.getElementById("tabBtn2").className = index === 1 ? "tab-btn active" : "tab-btn";
}

function saveCurrentPageContent(){
  articlePages[currentEditorIndex] = document.getElementById("articleContentBox").value;
}

function renderEditorPagesTabs(){
  articlePages = ["", ""];
  currentEditorIndex = 0;
  document.getElementById("articleContentBox").value = "";
  document.getElementById("tabBtn1").className = "tab-btn active";
  document.getElementById("tabBtn2").className = "tab-btn";
}

function publishArticle(){
  saveCurrentPageContent();
  const idField = document.getElementById("editArticleId").value;
  const title = document.getElementById("articleTitle").value.trim();
  const category = document.getElementById("articleCategory").value;
  const theme = document.getElementById("articleTheme").value;
  const image = document.getElementById("articleImage").value.trim();
  const author = localStorage.getItem("oer_logged_user") || "Kreator";

  const sentenceCount = title.split(/[.!?]+/).filter(Boolean).length;
  if(!title || sentenceCount < 2){
    alert("Judul artikel wajib minimal 2 kalimat (atau lebih) agar lebih deskriptif!");
    return;
  }

  if(articlePages[0].trim() === "" && articlePages[1].trim() === ""){
    alert("Minimal isi salah satu halaman artikel!");
    return;
  }

  const uniqueId = idField || ("art_" + Date.now());
  const articleObj = {
    id: uniqueId,
    title, category, pages: articlePages, theme, image, author,
    url: `website.html?view=${uniqueId}`,
    date: new Date().toLocaleDateString("id-ID", { day: 'numeric', month: 'short', year: 'numeric' })
  };

  let list = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
  if(idField){
    list = list.map(item => item.id === idField ? articleObj : item);
  } else {
    list.unshift(articleObj);
  }

  localStorage.setItem("oer_user_websites", JSON.stringify(list));
  alert("Artikel berhasil dipublikasikan!");
  
  // LANGSUNG BUKA PRATINJAU ARTIKEL YANG BARU DIBUAT
  location.href = `website.html?view=${uniqueId}`;
}

function resetEditor(){
  document.getElementById("editArticleId").value = "";
  document.getElementById("articleTitle").value = "";
  document.getElementById("articleImage").value = "";
  renderEditorPagesTabs();
  document.getElementById("editorHeading").innerText = "Tulis Karya Baru";
}

function renderMyArticles(){
  const user = localStorage.getItem("oer_logged_user");
  let list = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
  const myContainer = document.getElementById("myArticlesList");
  
  const userArticles = list.filter(item => item.author === user);
  if(!userArticles.length){
    myContainer.innerHTML = `<p style="color:var(--muted);font-size:14px;">Belum ada artikel yang dipublikasikan.</p>`;
    return;
  }

  let html = "";
  userArticles.forEach(art => {
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);">
      <div>
        <a href="website.html?view=${art.id}" style="color:var(--blue);text-decoration:none;font-weight:bold;font-size:15px;">${art.title}</a>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;">${art.date} • ${art.category}</div>
      </div>
      <div style="display:flex;gap:6px;">
        <a href="website.html?view=${art.id}" style="padding:5px 10px;font-size:12px;background:var(--blue);color:#17191d;text-decoration:none;border-radius:6px;font-weight:bold;">Lihat</a>
        <button onclick="editArticle('${art.id}')" style="padding:5px 10px;font-size:12px;background:#fbbc05;color:#000;">Edit</button>
        <button onclick="deleteArticle('${art.id}')" style="padding:5px 10px;font-size:12px;background:#ea4335;color:#fff;">Hapus</button>
      </div>
    </div>`;
  });
  myContainer.innerHTML = html;
}

function editArticle(id){
  let list = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
  const art = list.find(item => item.id === id);
  if(!art) return;

  document.getElementById("editArticleId").value = art.id;
  document.getElementById("articleTitle").value = art.title;
  document.getElementById("articleCategory").value = art.category;
  document.getElementById("articleTheme").value = art.theme || "theme-dark";
  document.getElementById("articleImage").value = art.image || "";
  
  articlePages = art.pages && art.pages.length >= 2 ? art.pages : [art.content || "", ""];
  currentEditorIndex = 0;
  document.getElementById("articleContentBox").value = articlePages[0];
  document.getElementById("editorHeading").innerText = "Edit Artikel";
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function deleteArticle(id){
  if(!confirm("Yakin ingin menghapus artikel ini?")) return;
  let list = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
  list = list.filter(item => item.id !== id);
  localStorage.setItem("oer_user_websites", JSON.stringify(list));
  renderMyArticles();
}

function updateReaderView(){
  document.getElementById("readContent").innerHTML = currentReaderPages[currentReaderIndex] || "";
  document.getElementById("pageIndicator").innerText = `Halaman ${currentReaderIndex + 1} dari ${currentReaderPages.length}`;
  document.getElementById("prevPageBtn").style.display = currentReaderIndex > 0 ? "block" : "none";
  document.getElementById("nextPageBtn").style.display = currentReaderIndex < currentReaderPages.length - 1 ? "block" : "none";
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function changeReaderPage(dir){
  currentReaderIndex += dir;
  if(currentReaderIndex < 0) currentReaderIndex = 0;
  if(currentReaderIndex >= currentReaderPages.length) currentReaderIndex = currentReaderPages.length - 1;
  updateReaderView();
}

window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const viewId = params.get("view");

  if(viewId){
    let all = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
    const target = all.find(a => a.id === viewId);

    if(target){
      document.getElementById("authArea").style.display = "none";
      document.getElementById("editorArea").style.display = "none";
      document.getElementById("readerArea").style.display = "block";
      document.getElementById("headerUserArea").innerHTML = `<a href="website.html" style="color:var(--muted);text-decoration:none;font-size:13px;margin-right:12px;">← Kembali ke Portal</a><a href="search.html" style="color:var(--blue);text-decoration:none;font-weight:bold;">🔍 OoeR Search</a>`;

      document.getElementById("readTitle").innerText = target.title;
      document.getElementById("readMeta").innerHTML = `<span>Kategori: <b>${target.category}</b></span> • <span>Penulis: <b>${target.author}</b></span> • <span>${target.date}</span>`;
      
      // MENGATUR GAMBAR BANNER UTAMA AGAR MUNCUL DAN TIDAK POLOS
      if(target.image){
        const img = document.getElementById("readBanner");
        img.src = target.image;
        img.style.display = "block";
      }

      currentReaderPages = target.pages && target.pages.length >= 2 ? target.pages : [target.pages?.[0] || target.content || "", ""];
      currentReaderIndex = 0;
      updateReaderView();
    } else {
      alert("Artikel tidak ditemukan.");
      location.href = "website.html";
    }
  } else {
    checkAuthStatus();
    renderEditorPagesTabs();
  }
});
</script>
</body>
</html>
