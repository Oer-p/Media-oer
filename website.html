<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OoeR Blog Space — Editor Artikel & Website</title>
<style>
  :root {
    --primary: #1a73e8;
    --bg: #f8f9fa;
    --card: #ffffff;
    --text: #202124;
    --border: #dadce0;
    --muted: #5f6368;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 40px; }

  /* HEADER RINGKAS & LOGO DI KIRI */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-o {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: conic-gradient(#4285f4 0 120deg, #fbbc05 120deg 235deg, #ea4335 235deg 300deg, #34a853 300deg);
    position: relative;
    flex-shrink: 0;
  }
  .logo-o::after {
    content: "";
    position: absolute;
    inset: 5px;
    background: var(--card);
    border-radius: 50%;
  }

  .brand-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text);
  }

  .header-btns {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* TOMBOL ATAS DIKECILKAN */
  .btn-sm {
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    color: var(--text);
    font-weight: 500;
  }
  .btn-sm.primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* CONTAINER UTAMA EDITOR LEBIH LUAS */
  .editor-container {
    max-width: 900px;
    margin: 16px auto;
    padding: 0 12px;
  }

  .editor-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-title {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    font-weight: bold;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
  }

  .editor-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    background: #f1f3f4;
    border-radius: 8px;
    align-items: center;
  }

  .tool-btn {
    padding: 6px 10px;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .tool-btn.active {
    background: var(--primary);
    color: #fff;
  }

  /* LAYAR KETIK DIBUAT SANGAT GEDEH / LEGA */
  .editor-textarea {
    width: 100%;
    min-height: 380px;
    padding: 14px;
    font-size: 15px;
    line-height: 1.6;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    resize: vertical;
  }

  /* PENGATURAN MULTI-HALAMAN (PAGINATION / PAGES) */
  .page-settings {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px;
    background: #fafafa;
  }

  .page-settings h4 {
    font-size: 13px;
    margin-bottom: 8px;
    color: var(--muted);
  }

  .page-inputs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .input-sub {
    flex: 1;
    min-width: 140px;
    padding: 8px;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
  }

  .btn-action {
    padding: 10px 20px;
    font-size: 14px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-cancel { background: #e8eaed; color: var(--text); }
  .btn-publish { background: var(--primary); color: #fff; }

  /* TAMPILAN PRATINJAU HASIL KODE (LIVE RENDER) */
  .preview-box {
    margin-top: 20px;
    padding: 16px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="brand-area">
    <div class="logo-o"></div>
    <span class="brand-title">OoeR Space</span>
  </div>
  <div class="header-btns">
    <a href="index.html" class="btn-sm">🏠 Beranda</a>
    <button class="btn-sm primary" id="btnNewArticle">✍️ Tulis</button>
  </div>
</header>

<main class="editor-container">
  <div class="editor-card">
    <input type="text" id="articleTitle" class="input-title" placeholder="Judul Artikel Utama...">
    
    <div class="editor-tools">
      <select id="articleCategory" class="tool-btn">
        <option>💻 Teknologi & Kode</option>
        <option>📖 Sastra & Puisi</option>
        <option>📰 Berita & Umum</option>
      </select>
      <button class="tool-btn" type="button" onclick="insertFormat('<b>', '</b>')"><b>B</b></button>
      <button class="tool-btn" type="button" onclick="insertFormat('<i>', '</i>')"><i>I</i></button>
      <button class="tool-btn" type="button" onclick="insertFormat('<u>', '</u>')"><u>U</u></button>
      <button class="tool-btn" type="button" id="btnCodeMode" onclick="toggleCodeMode()">💻 Mode Kode HTML</button>
    </div>

    <!-- LAYAR KETIK DIBUAT LEBIH GEDEH -->
    <textarea id="articleContent" class="editor-textarea" placeholder="Tuliskan isi artikel atau kode HTML di sini..."></textarea>

    <!-- PENGATURAN HALAMAN (PAGES) UNTUK MENYAMBUNGKAN MULTI-HALAMAN -->
    <div class="page-settings">
      <h4>📑 Pengaturan Halaman (Page Link)</h4>
      <div class="page-inputs">
        <input type="text" id="pageSlug" class="input-sub" placeholder="Slug URL (contoh: page-1 / tentang)">
        <input type="text" id="nextPageUrl" class="input-sub" placeholder="Tautan Halaman Selanjutnya (Optional)">
      </div>
    </div>

    <div class="actions">
      <button class="btn-action btn-cancel" type="button" onclick="clearEditor()">Batal</button>
      <button class="btn-action btn-publish" type="button" onclick="publishArticle()">Publikasikan Artikel 🚀</button>
    </div>
  </div>

  <!-- BUKTI HASIL RENDER ARTIKEL BISA DILIHAT DI SINI -->
  <div id="previewContainer" class="preview-box" style="display:none;">
    <h3 id="previewTitle"></h3>
    <hr style="margin: 10px 0; border: 0; border-top: 1px solid #eee;">
    <div id="previewBody"></div>
    <div id="previewPageNav" style="margin-top: 15px;"></div>
  </div>
</main>

<script>
  let isCodeMode = false;

  function insertFormat(start, end) {
    const textarea = document.getElementById("articleContent");
    const selStart = textarea.selectionStart;
    const selEnd = textarea.selectionEnd;
    const text = textarea.value;
    textarea.value = text.substring(0, selStart) + start + text.substring(selStart, selEnd) + end + text.substring(selEnd);
    textarea.focus();
  }

  function toggleCodeMode() {
    isCodeMode = !isCodeMode;
    const btn = document.getElementById("btnCodeMode");
    btn.classList.toggle("active", isCodeMode);
    alert(isCodeMode ? "Mode Kode HTML Aktif: Kode HTML yang ditulis akan dirender langsung saat dipublikasikan." : "Mode Teks Biasa Aktif.");
  }

  function publishArticle() {
    const title = document.getElementById("articleTitle").value.trim();
    const content = document.getElementById("articleContent").value;
    const category = document.getElementById("articleCategory").value;
    const slug = document.getElementById("pageSlug").value.trim() || "halaman-1";
    const nextPage = document.getElementById("nextPageUrl").value.trim();

    if (!title || !content) {
      alert("Harap isi Judul dan Isi Artikel!");
      return;
    }

    // SIMPAN DATA KE LOCALSTORAGE DENGAN GAMBAR & FORMAT KODE
    const newArticle = {
      id: Date.now(),
      title: title,
      category: category,
      content: content,
      slug: slug,
      nextPage: nextPage,
      date: new Date().toLocaleDateString("id-ID")
    };

    let existingWorks = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");
    existingWorks.unshift(newArticle);
    localStorage.setItem("oer_user_websites", JSON.stringify(existingWorks));

    // TAMPILKAN LANGSUNG KE HASIL ARTIKEL (LIVE RENDER KODE)
    document.getElementById("previewTitle").innerText = title;
    document.getElementById("previewBody").innerHTML = content; // Menderetkan kode HTML langsung
    
    if (nextPage) {
      document.getElementById("previewPageNav").innerHTML = `<a href="${nextPage}" style="color:#1a73e8; font-weight:bold;">Lanjut ke Halaman Berikutnya ➡️</a>`;
    } else {
      document.getElementById("previewPageNav").innerHTML = "";
    }

    document.getElementById("previewContainer").style.display = "block";
    alert("Artikel berhasil dipublikasikan dan tersambung ke sistem pencarian OoeR!");
  }

  function clearEditor() {
    document.getElementById("articleTitle").value = "";
    document.getElementById("articleContent").value = "";
    document.getElementById("previewContainer").style.display = "none";
  }
</script>

</body>
</html>
