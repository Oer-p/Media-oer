<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#131314">
<title>OoeR AI Assistant — Tanya & Diskusi Cerdas</title>

<style>
:root {
  --bg: #131314;
  --card: #1e1f20;
  --soft: #282a2d;
  --border: #3c4043;
  --text: #ffffff;
  --muted: #9aa0a6;
  --blue: #4285f4;
  --blue-glow: rgba(66, 133, 244, 0.2);
  --red: #ea4335;
  --yellow: #fbbc05;
  --green: #34a853;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden; display: flex; flex-direction: column;
}

/* HEADER CHAT */
header {
  height: 58px; padding: 0 16px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 1px solid var(--border);
  background: rgba(19, 19, 20, 0.9); backdrop-filter: blur(10px);
  position: relative; z-index: 10; flex-shrink: 0;
}
.back-btn, .action-icon-btn {
  color: var(--text); display: flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 50%; text-decoration: none;
  background: transparent; border: none; cursor: pointer; transition: background .2s;
}
.back-btn:hover, .action-icon-btn:hover { background: var(--soft); }

.header-brand {
  display: flex; align-items: center; gap: 8px; text-decoration: none;
}
.logo-circle {
  width: 24px; height: 24px; border-radius: 50%;
  background: conic-gradient(from -43deg, var(--red) 0deg 105deg, var(--yellow) 105deg 225deg, var(--blue) 225deg 360deg);
  position: relative;
}
.logo-circle:after {
  content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--bg);
}
.brand-name { font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
.ai-badge {
  background: var(--blue-glow); border: 1px solid var(--blue); color: #8ab4f8;
  font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
}

/* AREA PESAN CHAT */
.chat-container {
  flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column;
  gap: 16px; scroll-behavior: smooth;
}
.chat-container::-webkit-scrollbar { width: 5px; }
.chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* WELCOME HERO DI TENGAH */
.welcome-hero {
  margin: auto auto 10px; text-align: center; max-width: 440px; padding: 20px 0;
  display: flex; flex-direction: column; align-items: center;
}
.hero-orb {
  width: 68px; height: 68px; border-radius: 50%;
  background: conic-gradient(from 180deg, var(--blue), var(--green), var(--yellow), var(--red), var(--blue));
  display: grid; place-items: center; margin-bottom: 16px;
  box-shadow: 0 0 35px rgba(66, 133, 244, 0.35); animation: spinSlow 12s linear infinite;
}
@keyframes spinSlow { 100% { transform: rotate(360deg); } }
.hero-orb-inner {
  width: 54px; height: 54px; border-radius: 50%; background: var(--card);
  display: grid; place-items: center; font-size: 26px;
}

.welcome-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; color: #fff; }
.welcome-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 20px; }

/* REKOMENDASI PROMPT CHIPS */
.prompt-chips {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
}
.chip-btn {
  background: var(--card); border: 1px solid var(--border); color: #e3e3e3;
  padding: 8px 14px; border-radius: 18px; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 6px;
}
.chip-btn:hover { background: var(--soft); border-color: var(--blue); color: #fff; transform: translateY(-1px); }

/* BUBBLE PESAN */
.message-row { display: flex; gap: 10px; width: 100%; max-width: 680px; margin: 0 auto; }
.message-row.user { justify-content: flex-end; }
.message-row.bot { justify-content: flex-start; }

.bot-avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--soft);
  border: 1px solid var(--border); display: grid; place-items: center; font-size: 16px;
  flex-shrink: 0; margin-top: 4px;
}

.message-bubble {
  padding: 13px 16px; border-radius: 18px; font-size: 14.5px; line-height: 1.6;
  max-width: 85%; word-break: break-word; position: relative;
}
.message-row.user .message-bubble {
  background: #2563eb; color: #ffffff; border-bottom-right-radius: 4px;
}
.message-row.bot .message-bubble {
  background: var(--card); color: #e8eaed; border: 1px solid var(--border);
  border-bottom-left-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.25);
}

.bubble-tools {
  display: flex; align-items: center; gap: 12px; margin-top: 8px; padding-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: var(--muted);
}
.bubble-btn {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; gap: 4px; padding: 2px 0; font-size: 11px;
}
.bubble-btn:hover { color: #fff; }

/* TYPING INDICATOR */
.typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 6px 4px; }
.typing-dots span {
  width: 6px; height: 6px; background: #8ab4f8; border-radius: 50%;
  animation: bounceDot 1.4s infinite ease-in-out both;
}
.typing-dots span:nth-child(1) { animation-delay: -0.32s; }
.typing-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounceDot {
  0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}

/* FOOTER & INPUT BAR */
footer {
  padding: 10px 14px 14px; background: rgba(19, 19, 20, 0.95);
  border-top: 1px solid var(--border); flex-shrink: 0;
}
.footer-wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.input-pill {
  background: var(--card); border: 1px solid var(--border); border-radius: 26px;
  display: flex; align-items: center; padding: 4px 8px 4px 16px; min-height: 50px;
  transition: border-color .2s, box-shadow .2s;
}
.input-pill:focus-within {
  border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-glow);
}

#chatInput {
  flex: 1; background: transparent; border: none; outline: none;
  color: #fff; font-size: 15px; min-width: 0; resize: none; max-height: 100px;
  line-height: 1.4; padding: 8px 0;
}
#chatInput::placeholder { color: var(--muted); }

.tool-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

.mic-btn, .send-btn {
  width: 38px; height: 38px; border-radius: 50%; border: none;
  display: grid; place-items: center; cursor: pointer; transition: all .2s;
}
.mic-btn { background: transparent; color: var(--muted); }
.mic-btn:hover { background: var(--soft); color: var(--blue); }
.mic-btn.listening {
  color: var(--red); background: rgba(234, 67, 53, 0.15); animation: pulseRed 1.2s infinite;
}
@keyframes pulseRed { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

.send-btn { background: var(--blue); color: #fff; }
.send-btn:hover { background: #3367d6; }
.send-btn:disabled { background: var(--soft); color: var(--muted); cursor: not-allowed; opacity: 0.6; }
</style>
</head>
<body>

<header>
  <a class="back-btn" href="./" title="Kembali ke Beranda OoeR">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>
  <div class="header-brand">
    <div class="logo-circle"></div>
    <div class="brand-name">OoeR <span class="ai-badge">AI Assistant</span></div>
  </div>
  <button class="action-icon-btn" id="btnClearChat" title="Hapus Percakapan">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
    </svg>
  </button>
</header>

<div class="chat-container" id="chatArea">
  <!-- Sambutan Awal -->
  <div class="welcome-hero" id="welcomeHero">
    <div class="hero-orb">
      <div class="hero-orb-inner">✦</div>
    </div>
    <div class="welcome-title">Ada yang bisa OoeR bantu?</div>
    <div class="welcome-desc">Asisten AI pintar untuk menjawab pertanyaan, merangkum bacaan, dan mencari inspirasi ide kreatif.</div>
    
    <div class="prompt-chips">
      <button class="chip-btn" data-prompt="Jelaskan secara singkat apa itu kecerdasan buatan (AI)">💡 Apa itu AI?</button>
      <button class="chip-btn" data-prompt="Berikan 5 ide konten media sosial yang menarik untuk bisnis">📱 Ide Konten Medsos</button>
      <button class="chip-btn" data-prompt="Bantu buatkan jadwal belajar produktif untuk pemula">📅 Jadwal Produktif</button>
      <button class="chip-btn" data-prompt="Tulis pesan ucapan selamat ulang tahun yang hangat dan berkesan">🎉 Ucapan Ultah</button>
    </div>
  </div>
</div>

<footer>
  <div class="footer-wrap">
    <div class="input-pill">
      <textarea id="chatInput" rows="1" placeholder="Tanya apa saja ke OoeR AI..."></textarea>
      <div class="tool-actions">
        <button class="mic-btn" id="btnVoice" title="Bicara lewat Suara">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11z"/>
          </svg>
        </button>
        <button class="send-btn" id="btnSend" title="Kirim">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>
</footer>

<script>
(() => {
  "use strict";

  // ENDPOINT EDGE FUNCTION SUPABASE (CHAT-GEMINI)
  const SUPABASE_KEY = "sb_publishable_FE4-8ZuWD3FgKCcjxjaErg_w97N3fwk";
  const CHAT_ENDPOINT = "https://jhopfzmyxuafdbwwkjbf.supabase.co/functions/v1/chat-gemini";

  const $ = id => document.getElementById(id);
  const chatArea = $("chatArea");
  const chatInput = $("chatInput");
  const btnSend = $("btnSend");
  const btnVoice = $("btnVoice");
  const btnClearChat = $("btnClearChat");
  const welcomeHero = $("welcomeHero");

  let conversationHistory = [];

  // Muat riwayat tersimpan dari LocalStorage jika ada
  try {
    const saved = localStorage.getItem("ooer_chat_history");
    if (saved) {
      conversationHistory = JSON.parse(saved);
      if (conversationHistory.length > 0) {
        if (welcomeHero) welcomeHero.style.display = "none";
        conversationHistory.forEach(msg => appendMessageUI(msg.role, msg.text, false));
      }
    }
  } catch (e) {}

  function saveHistory() {
    try {
      localStorage.setItem("ooer_chat_history", JSON.stringify(conversationHistory.slice(-20)));
    } catch (e) {}
  }

  function appendMessageUI(role, text, animate = true) {
    if (welcomeHero) welcomeHero.style.display = "none";

    const row = document.createElement("div");
    row.className = `message-row ${role}`;

    if (role === "bot") {
      const avatar = document.createElement("div");
      avatar.className = "bot-avatar";
      avatar.textContent = "✦";
      row.appendChild(avatar);
    }

    const bubble = document.createElement("div");
    bubble.className = "message-bubble";
    bubble.innerHTML = formatMessageText(text);

    if (role === "bot") {
      const tools = document.createElement("div");
      tools.className = "bubble-tools";

      // Tombol Salin
      const btnCopy = document.createElement("button");
      btnCopy.className = "bubble-btn";
      btnCopy.innerHTML = "📋 Salin";
      btnCopy.onclick = () => {
        navigator.clipboard.writeText(text);
        btnCopy.innerHTML = "✓ Tersalin!";
        setTimeout(() => btnCopy.innerHTML = "📋 Salin", 2000);
      };

      // Tombol Suara (Bicara)
      const btnSpeak = document.createElement("button");
      btnSpeak.className = "bubble-btn";
      btnSpeak.innerHTML = "🔊 Dengar";
      btnSpeak.onclick = () => speakText(text);

      tools.append(btnCopy, btnSpeak);
      bubble.appendChild(tools);
    }

    row.appendChild(bubble);
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function showTypingIndicator() {
    const row = document.createElement("div");
    row.className = "message-row bot";
    row.id = "typingIndicator";

    const avatar = document.createElement("div");
    avatar.className = "bot-avatar";
    avatar.textContent = "✦";

    const bubble = document.createElement("div");
    bubble.className = "message-bubble";
    bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;

    row.append(avatar, bubble);
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = $("typingIndicator");
    if (el) el.remove();
  }

  function formatMessageText(str) {
    return str
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/\*(.*?)\*/g, '<i>$1</i>')
      .replace(/`([^`]+)`/g, '<code style="background:#282a2d;padding:2px 5px;border-radius:4px;color:#8ab4f8;">$1</code>')
      .replace(/\n/g, '<br>');
  }

  function speakText(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/[*_#`]/g, '');
    const utter = new SpeechSynthesisUtterance(cleanText);
    utter.lang = "id-ID";
    utter.rate = 1.0;
    window.speechSynthesis.speak(utter);
  }

  async function sendMessage(userText) {
    const text = userText.trim();
    if (!text) return;

    appendMessageUI("user", text);
    conversationHistory.push({ role: "user", text: text });
    saveHistory();

    chatInput.value = "";
    chatInput.style.height = "auto";
    btnSend.disabled = true;

    showTypingIndicator();

    try {
      const response = await fetch(CHAT_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          message: text,
          history: conversationHistory.slice(-6)
        })
      });

      const data = await response.json();
      removeTypingIndicator();

      const botReply = data.reply || data.answer || data.message || "Maaf, OoeR AI sedang kesulitan memproses respon saat ini.";
      appendMessageUI("bot", botReply);
      conversationHistory.push({ role: "bot", text: botReply });
      saveHistory();

    } catch (err) {
      removeTypingIndicator();
      appendMessageUI("bot", "Koneksi terputus. Pastikan internet Anda aktif dan coba lagi.");
    } finally {
      btnSend.disabled = false;
    }
  }

  // Event Listeners
  btnSend.addEventListener("click", () => sendMessage(chatInput.value));

  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(chatInput.value);
    }
  });

  // Auto-resize input
  chatInput.addEventListener("input", () => {
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + "px";
  });

  // Rekomendasi Prompt Pills
  document.querySelectorAll(".chip-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const prompt = btn.dataset.prompt;
      sendMessage(prompt);
    });
  });

  // Hapus Chat
  btnClearChat.addEventListener("click", () => {
    if (confirm("Hapus seluruh riwayat percakapan?")) {
      conversationHistory = [];
      localStorage.removeItem("ooer_chat_history");
      chatArea.replaceChildren();
      if (welcomeHero) {
        welcomeHero.style.display = "flex";
        chatArea.appendChild(welcomeHero);
      }
    }
  });

  // Fitur Bicara (Microphone)
  if (btnVoice) {
    btnVoice.addEventListener("click", () => {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert("Browser Anda belum mendukung input suara.");
        return;
      }

      const mic = new SpeechRec();
      mic.lang = "id-ID";
      mic.interimResults = false;

      mic.onstart = () => btnVoice.classList.add("listening");
      mic.onresult = (e) => {
        const voiceText = e.results[0][0].transcript;
        chatInput.value = voiceText;
        sendMessage(voiceText);
      };
      mic.onend = () => btnVoice.classList.remove("listening");
      mic.start();
    });
  }
})();
</script>
</body>
</html>
