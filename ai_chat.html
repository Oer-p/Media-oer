
<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#242424">
<meta name="description" content="OoeR — ruang percakapan dan bantuan digital.">
<title>OoeR</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                ooer: {
                    bg: '#242424',
                    card: '#303030',
                    input: '#3A3A3A',
                    border: '#484848',
                    blue: '#4285F4',
                    red: '#EA4335',
                    yellow: '#FBBC05',
                    green: '#34A853'
                }
            },
            fontFamily: {
                sans: ['Inter', 'sans-serif']
            }
        }
    }
};
</script>

<style>
* { box-sizing: border-box; }

html, body {
    background: #242424;
    color: #E0E0E0;
    font-family: Inter, sans-serif;
}

body {
    min-height: 100dvh;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #242424; }
::-webkit-scrollbar-thumb {
    background: #484848;
    border-radius: 5px;
}
::-webkit-scrollbar-thumb:hover { background: #606060; }

button:focus-visible,
textarea:focus-visible {
    outline: 2px solid #888888;
    outline-offset: 2px;
}

#chat-container {
    overscroll-behavior: contain;
    scrollbar-color: #484848 #242424;
}

#user-input {
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #606060 transparent;
}

.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
}

@keyframes typing {
    0%, 100% { transform: translateY(0); opacity: .35; }
    50% { transform: translateY(-4px); opacity: 1; }
}

.dot-1 { animation: typing 1.2s infinite 0s; }
.dot-2 { animation: typing 1.2s infinite .2s; }
.dot-3 { animation: typing 1.2s infinite .4s; }

.markdown-body {
    overflow-wrap: anywhere;
    line-height: 1.7;
}

.markdown-body p { margin-bottom: .65rem; }
.markdown-body p:last-child { margin-bottom: 0; }

.markdown-body ul {
    list-style: disc;
    padding-left: 1.3rem;
    margin-bottom: .65rem;
}

.markdown-body ol {
    list-style: decimal;
    padding-left: 1.3rem;
    margin-bottom: .65rem;
}

.markdown-body li { margin: .25rem 0; }

.markdown-body h1,
.markdown-body h2,
.markdown-body h3 {
    font-weight: 700;
    margin: .9rem 0 .45rem;
}

.markdown-body h1 { font-size: 1.4rem; }
.markdown-body h2 { font-size: 1.2rem; }
.markdown-body h3 { font-size: 1.05rem; }

.markdown-body a {
    color: #A8C7FA;
    text-decoration: underline;
    overflow-wrap: anywhere;
}

.markdown-body blockquote {
    border-left: 3px solid #888888;
    padding-left: .8rem;
    margin: .7rem 0;
    color: #C9C9C9;
}

.markdown-body code:not(pre code) {
    background: #414141;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: .88em;
    font-family: monospace;
    overflow-wrap: anywhere;
}

.markdown-body pre {
    background: #292929;
    border: 1px solid #484848;
    border-radius: 10px;
    padding: 14px;
    margin: 10px 0;
    overflow-x: auto;
    position: relative;
    white-space: pre;
}

.markdown-body pre code {
    font-family: monospace;
    font-size: .85rem;
    color: #E0E0E0;
}

.markdown-body table {
    display: block;
    width: 100%;
    overflow-x: auto;
    border-collapse: collapse;
    margin: .7rem 0;
}

.markdown-body th,
.markdown-body td {
    border: 1px solid #505050;
    padding: 7px 10px;
    text-align: left;
}

.markdown-body th { background: #3A3A3A; }

.message-bubble {
    min-width: 0;
    overflow-wrap: anywhere;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body class="bg-ooer-bg text-gray-200 font-sans flex flex-col h-screen overflow-hidden">

<header class="bg-ooer-card border-b border-ooer-border px-3 sm:px-4 py-3 flex items-center justify-between z-20 flex-shrink-0">
    <div class="flex items-center gap-2">
        <a href="index.html"
           class="text-gray-300 hover:text-white p-2 rounded-full hover:bg-ooer-input transition flex items-center justify-center"
           title="Kembali ke Home"
           aria-label="Kembali ke Home">
            <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>

        <div class="flex items-center gap-2">
            <div class="flex items-center text-2xl font-extrabold tracking-tight" aria-label="OoeR">
                <span class="text-ooer-blue">O</span><span class="text-ooer-red">o</span><span class="text-ooer-yellow">e</span><span class="text-ooer-green">R</span>
            </div>
            <span class="text-sm font-semibold text-gray-200">OoeR</span>
        </div>
    </div>

    <button type="button"
            onclick="clearChatHistory()"
            class="text-gray-300 hover:text-white p-2.5 rounded-xl hover:bg-ooer-input transition text-sm flex items-center gap-2"
            title="Hapus percakapan"
            aria-label="Hapus percakapan">
        <i class="fa-regular fa-trash-can"></i>
        <span class="hidden sm:inline text-xs">Hapus</span>
    </button>
</header>

<main id="chat-container"
      class="flex-1 overflow-y-auto px-3 sm:px-4 py-5 space-y-5 w-full max-w-3xl mx-auto">

    <div id="welcome-card" class="py-8 text-center">
        <div class="flex items-center justify-center gap-1 text-4xl font-extrabold tracking-tight mb-3">
            <span class="text-ooer-blue">O</span><span class="text-ooer-red">o</span><span class="text-ooer-yellow">e</span><span class="text-ooer-green">R</span>
        </div>
    </div>

    <div id="opening-message" class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-full bg-ooer-input border border-ooer-border flex-shrink-0 flex items-center justify-center text-gray-200 font-bold text-xs">
            O
        </div>

        <div class="message-bubble bg-ooer-card border border-ooer-border rounded-2xl rounded-tl-none p-3.5 max-w-[90%] sm:max-w-[85%]">
            <p class="text-sm text-gray-200">Halo! Ada yang bisa saya bantu?</p>
            <div class="mt-2 flex justify-end">
                <button type="button"
                        onclick="copyMessageText(this)"
                        class="text-xs text-gray-400 hover:text-white transition flex items-center gap-1">
                    <i class="fa-regular fa-copy"></i> Salin
                </button>
            </div>
        </div>
    </div>
</main>

<footer class="bg-ooer-bg border-t border-ooer-border px-3 py-3 sm:px-4 sm:py-4 w-full flex-shrink-0">
    <div id="quick-prompts"
         class="flex items-center gap-2 overflow-x-auto pb-2 mb-2 no-scrollbar text-xs max-w-3xl mx-auto">
        <button type="button"
                onclick="useQuickPrompt('Rangkum artikel berikut dengan poin-poin utama:')"
                class="bg-ooer-card hover:bg-ooer-input text-gray-300 hover:text-white px-3 py-2 rounded-full border border-ooer-border whitespace-nowrap transition">
            <i class="fa-regular fa-file-lines mr-1"></i> Rangkum artikel
        </button>

        <button type="button"
                onclick="useQuickPrompt('Jelaskan topik ini dengan bahasa sederhana:')"
                class="bg-ooer-card hover:bg-ooer-input text-gray-300 hover:text-white px-3 py-2 rounded-full border border-ooer-border whitespace-nowrap transition">
            <i class="fa-solid fa-book-open mr-1"></i> Jelaskan topik
        </button>

        <button type="button"
                onclick="useQuickPrompt('Bantu saya mencari ide kreatif tentang:')"
                class="bg-ooer-card hover:bg-ooer-input text-gray-300 hover:text-white px-3 py-2 rounded-full border border-ooer-border whitespace-nowrap transition">
            <i class="fa-regular fa-lightbulb mr-1"></i> Cari ide
        </button>
    </div>

    <form id="chat-form"
          onsubmit="handleSubmit(event)"
          class="relative flex items-end gap-1.5 bg-ooer-input border border-ooer-border rounded-2xl p-2 focus-within:border-gray-500 transition max-w-3xl mx-auto">

        <textarea id="user-input"
                  rows="1"
                  maxlength="12000"
                  placeholder="Ketik pesan..."
                  aria-label="Ketik pesan"
                  class="w-full bg-transparent text-gray-100 text-sm px-3 py-2.5 focus:outline-none resize-none max-h-32 placeholder:text-gray-400"
                  oninput="adjustTextareaHeight(this); checkInputStatus();"
                  onkeydown="handleKeyDown(event)"></textarea>

        <div class="flex items-center gap-1 pb-1 pr-1">
            <button type="button"
                    id="mic-btn"
                    onclick="toggleSpeechRecognition()"
                    class="p-2.5 text-gray-300 hover:text-white rounded-xl hover:bg-[#4A4A4A] transition"
                    title="Input suara"
                    aria-label="Input suara">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <button type="submit"
                    id="send-btn"
                    disabled
                    class="p-2.5 bg-[#555555] text-white rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed hover:bg-[#666666] flex items-center justify-center"
                    aria-label="Kirim pesan">
                <i class="fa-solid fa-arrow-up text-sm"></i>
            </button>
        </div>
    </form>

    <p class="text-[10px] text-gray-500 text-center mt-2">
        Periksa kembali informasi penting sebelum menggunakannya.
    </p>
</footer>

<script>
const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const welcomeCard = document.getElementById('welcome-card');

let isGenerating = false;
let recognition = null;

/* Koneksi Supabase yang sudah digunakan */
const SUPABASE_URL = 'https://jhopfzmyxuafdbwwkjbf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_FE4-8ZuWD3FgKCcjxjaErg_w97N3fwk';
const EDGE_FUNCTION_NAME = 'smooth-handler';

function adjustTextareaHeight(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 128) + 'px';
}

function checkInputStatus() {
    sendBtn.disabled = !userInput.value.trim() || isGenerating;
}

function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!isGenerating && userInput.value.trim()) {
            document.getElementById('chat-form').requestSubmit();
        }
    }
}

function useQuickPrompt(text) {
    if (isGenerating) return;
    userInput.value = text;
    adjustTextareaHeight(userInput);
    checkInputStatus();
    userInput.focus();
}

async function handleSubmit(e) {
    e.preventDefault();

    const text = userInput.value.trim();
    if (!text || isGenerating) return;

    if (welcomeCard) welcomeCard.style.display = 'none';

    userInput.value = '';
    userInput.style.height = 'auto';
    isGenerating = true;
    checkInputStatus();

    appendUserBubble(text);
    const typingId = appendTypingIndicator();

    try {
        const answer = await fetchGeminiResponse(text);
        removeElement(typingId);
        appendAIBubble(answer);
    } catch (error) {
        console.error('OoeR error:', error);
        removeElement(typingId);
        appendAIBubble(
            'Maaf, pesan belum dapat diproses.\n\n**Detail:** ' +
            (error.message || 'Terjadi kesalahan yang tidak diketahui.')
        );
    } finally {
        isGenerating = false;
        checkInputStatus();
        userInput.focus();
    }
}

function appendUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'flex justify-end';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble bg-[#454545] border border-[#555555] text-gray-100 rounded-2xl rounded-tr-sm p-3.5 max-w-[90%] sm:max-w-[85%]';

    const p = document.createElement('p');
    p.className = 'text-sm leading-relaxed whitespace-pre-wrap select-text';
    p.textContent = text;

    bubble.appendChild(p);
    row.appendChild(bubble);
    chatContainer.appendChild(row);
    scrollToBottom();
}

function appendAIBubble(text) {
    const row = document.createElement('div');
    row.className = 'flex items-start gap-3';

    const avatar = document.createElement('div');
    avatar.className = 'w-8 h-8 rounded-full bg-ooer-input border border-ooer-border flex-shrink-0 flex items-center justify-center text-gray-200 font-bold text-xs';
    avatar.textContent = 'O';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble bg-ooer-card border border-ooer-border rounded-2xl rounded-tl-none p-3.5 max-w-[90%] sm:max-w-[85%]';

    const markdown = document.createElement('div');
    markdown.className = 'markdown-body text-sm text-gray-200 select-text';
    markdown.innerHTML = renderSafeMarkdown(text);

    const actions = document.createElement('div');
    actions.className = 'mt-3 pt-2 border-t border-ooer-border flex justify-end';

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'text-xs text-gray-400 hover:text-white transition flex items-center gap-1';
    copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin';
    copyBtn.onclick = () => copyMessageText(copyBtn);

    actions.appendChild(copyBtn);
    bubble.append(markdown, actions);
    row.append(avatar, bubble);

    markdown.querySelectorAll('pre').forEach(pre => {
        const codeBtn = document.createElement('button');
        codeBtn.type = 'button';
        codeBtn.className = 'absolute top-2 right-2 bg-[#414141] text-gray-300 hover:text-white px-2 py-1 rounded text-xs border border-ooer-border';
        codeBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin kode';

        codeBtn.onclick = async () => {
            const code = pre.querySelector('code');
            if (!code) return;

            const ok = await copyToClipboard(code.innerText);
            codeBtn.innerHTML = ok
                ? '<i class="fa-solid fa-check"></i> Tersalin'
                : 'Gagal menyalin';

            setTimeout(() => {
                codeBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin kode';
            }, 1800);
        };

        pre.appendChild(codeBtn);
    });

    chatContainer.appendChild(row);
    scrollToBottom();
}

function renderSafeMarkdown(text) {
    const raw = window.marked
        ? marked.parse(text, { breaks: true, gfm: true })
        : escapeHTML(text).replace(/\n/g, '<br>');

    const doc = new DOMParser().parseFromString(raw, 'text/html');

    doc.querySelectorAll(
        'script, iframe, object, embed, form, input, button, textarea, link, meta, style'
    ).forEach(el => el.remove());

    doc.querySelectorAll('*').forEach(el => {
        [...el.attributes].forEach(attr => {
            const name = attr.name.toLowerCase();
            const value = attr.value.trim().toLowerCase();

            if (name.startsWith('on')) el.removeAttribute(attr.name);

            if ((name === 'href' || name === 'src') &&
                (value.startsWith('javascript:') || value.startsWith('data:'))) {
                el.removeAttribute(attr.name);
            }
        });
    });

    return doc.body.innerHTML;
}

function appendTypingIndicator() {
    const id = 'typing-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    const row = document.createElement('div');
    row.id = id;
    row.className = 'flex items-start gap-3';

    row.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-ooer-input border border-ooer-border flex-shrink-0 flex items-center justify-center text-gray-200 font-bold text-xs">O</div>
        <div class="bg-ooer-card border border-ooer-border rounded-2xl rounded-tl-none p-4 flex items-center gap-1.5">
            <span class="w-2 h-2 bg-gray-400 rounded-full dot-1"></span>
            <span class="w-2 h-2 bg-gray-400 rounded-full dot-2"></span>
            <span class="w-2 h-2 bg-gray-400 rounded-full dot-3"></span>
        </div>`;

    chatContainer.appendChild(row);
    scrollToBottom();
    return id;
}

/* Request ke Supabase Edge Function */
async function fetchGeminiResponse(prompt) {
    const endpoint = `${SUPABASE_URL}/functions/v1/${EDGE_FUNCTION_NAME}`;

    let response;
    try {
        response = await fetch(endpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_PUBLISHABLE_KEY,
                'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
            },
            body: JSON.stringify({ message: prompt })
        });
    } catch (error) {
        throw new Error(
            'Tidak dapat menghubungi Supabase. Periksa koneksi internet dan pengaturan CORS.'
        );
    }

    const rawText = await response.text();
    let data;

    try {
        data = rawText ? JSON.parse(rawText) : {};
    } catch {
        throw new Error(`Respons server bukan JSON (HTTP ${response.status}).`);
    }

    if (!response.ok) {
        let detail = data.message || data.error?.message || data.error;

        if (typeof detail !== 'string') detail = JSON.stringify(detail || data);

        throw new Error(`Supabase HTTP ${response.status}: ${detail}`);
    }

    if (data.error) {
        const detail = typeof data.error === 'string'
            ? data.error
            : data.error.message || JSON.stringify(data.error);
        throw new Error(detail);
    }

    const answer = data.reply || data.answer;

    if (typeof answer !== 'string' || !answer.trim()) {
        throw new Error('Balasan tidak ditemukan. Pastikan Edge Function mengembalikan "reply" atau "answer".');
    }

    return answer.trim();
}

function clearChatHistory() {
    if (isGenerating) {
        alert('Tunggu sampai jawaban selesai sebelum menghapus percakapan.');
        return;
    }

    if (!confirm('Hapus seluruh percakapan yang sedang tampil?')) return;

    chatContainer.innerHTML = '';
    if (welcomeCard) {
        welcomeCard.style.display = 'block';
        chatContainer.appendChild(welcomeCard);
    }

    const row = document.createElement('div');
    row.id = 'opening-message';
    row.className = 'flex items-start gap-3';
    row.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-ooer-input border border-ooer-border flex-shrink-0 flex items-center justify-center text-gray-200 font-bold text-xs">O</div>
        <div class="message-bubble bg-ooer-card border border-ooer-border rounded-2xl rounded-tl-none p-3.5 max-w-[90%] sm:max-w-[85%]">
            <p class="text-sm text-gray-200">Halo! Ada yang bisa saya bantu?</p>
            <div class="mt-2 flex justify-end">
                <button type="button" onclick="copyMessageText(this)" class="text-xs text-gray-400 hover:text-white transition flex items-center gap-1">
                    <i class="fa-regular fa-copy"></i> Salin
                </button>
            </div>
        </div>`;

    chatContainer.appendChild(row);
    scrollToBottom();
    userInput.focus();
}

async function copyMessageText(btn) {
    const bubble = btn.closest('.message-bubble');
    if (!bubble) return;

    const content = bubble.querySelector('.markdown-body') || bubble.querySelector('p');
    if (!content) return;

    const ok = await copyToClipboard(content.innerText);
    const original = btn.innerHTML;

    btn.innerHTML = ok
        ? '<i class="fa-solid fa-check"></i> Tersalin'
        : '<i class="fa-solid fa-triangle-exclamation"></i> Gagal';

    setTimeout(() => { btn.innerHTML = original; }, 1800);
}

async function copyToClipboard(text) {
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
        }
    } catch (error) {
        console.warn('Clipboard API gagal:', error);
    }

    try {
        const area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        area.style.pointerEvents = 'none';
        document.body.appendChild(area);
        area.focus();
        area.select();
        const success = document.execCommand('copy');
        area.remove();
        return success;
    } catch (error) {
        return false;
    }
}

function toggleSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert('Input suara tidak didukung browser ini. Coba gunakan Chrome dan izinkan akses mikrofon.');
        return;
    }

    if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            micBtn.classList.add('text-white', 'animate-pulse');
            micBtn.title = 'Mendengarkan...';
        };

        recognition.onresult = event => {
            const transcript = event.results[0][0].transcript;
            userInput.value += (userInput.value ? ' ' : '') + transcript;
            adjustTextareaHeight(userInput);
            checkInputStatus();
        };

        recognition.onerror = event => {
            console.warn('Kesalahan input suara:', event.error);
            if (event.error === 'not-allowed') {
                alert('Izin mikrofon ditolak. Aktifkan izin mikrofon untuk situs ini.');
            }
        };

        recognition.onend = () => {
            micBtn.classList.remove('text-white', 'animate-pulse');
            micBtn.title = 'Input suara';
        };
    }

    try {
        recognition.start();
    } catch (error) {
        console.warn('Pengenalan suara sedang berjalan atau belum siap.', error);
    }
}

function removeElement(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

function scrollToBottom() {
    requestAnimationFrame(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    });
}

function escapeHTML(str) {
    return String(str).replace(/[&<>'"]/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
    }[ch]));
}

checkInputStatus();
</script>
