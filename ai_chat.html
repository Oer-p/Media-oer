<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0b0e">
<meta name="description" content="OoeR AI — Asisten kecerdasan digital premium.">
<title>OoeR AI</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome & Google Fonts -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Markdown Parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
  --bg-deep: #0a0b0e;
  --bg-surface: #13151b;
  --bg-card: #181b24;
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.18);
  --accent-glow: rgba(255, 255, 255, 0.05);
}

* { 
  box-sizing: border-box; 
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-deep);
  color: #ededed;
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100dvh;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 99px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* Subtle Glow Effect */
.bg-glow-radial {
  background: radial-gradient(circle at 50% 15%, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
}

/* Animasi Titik Mengetik */
@keyframes typingDot {
  0%, 100% { transform: translateY(0); opacity: 0.3; }
  50% { transform: translateY(-4px); opacity: 1; }
}
.dot-1 { animation: typingDot 1.2s infinite 0s; }
.dot-2 { animation: typingDot 1.2s infinite 0.2s; }
.dot-3 { animation: typingDot 1.2s infinite 0.4s; }

/* Markdown Typography */
.markdown-body {
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.markdown-body p { margin-bottom: 0.8rem; }
.markdown-body p:last-child { margin-bottom: 0; }
.markdown-body ul { list-style: disc; padding-left: 1.25rem; margin-bottom: 0.8rem; }
.markdown-body ol { list-style: decimal; padding-left: 1.25rem; margin-bottom: 0.8rem; }
.markdown-body li { margin: 0.25rem 0; }
.markdown-body h1, .markdown-body h2, .markdown-body h3 {
  font-weight: 700;
  color: #ffffff;
  margin: 1.2rem 0 0.5rem;
}
.markdown-body h1 { font-size: 1.35rem; }
.markdown-body h2 { font-size: 1.2rem; }
.markdown-body h3 { font-size: 1.05rem; }
.markdown-body a {
  color: #93c5fd;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.markdown-body blockquote {
  border-left: 3px solid rgba(255, 255, 255, 0.3);
  padding-left: 0.85rem;
  margin: 0.8rem 0;
  color: #b3b3b3;
  font-style: italic;
}
.markdown-body code:not(pre code) {
  background: rgba(255, 255, 255, 0.08);
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 0.85em;
  font-family: 'JetBrains Mono', monospace;
  color: #e5e7eb;
}
.markdown-body pre {
  background: #0d0f14;
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 12px 0;
  overflow-x: auto;
  position: relative;
}
.markdown-body pre code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: #f3f4f6;
}
</style>
</head>

<body class="flex flex-col h-screen overflow-hidden bg-glow-radial">

  <!-- HEADER ELEGAN & MINIMALIS -->
  <header class="h-14 border-b border-white/[0.08] bg-[#0a0b0e]/85 backdrop-blur-md px-4 flex items-center justify-between z-30 flex-shrink-0">
    <div class="flex items-center gap-3">
      <a href="index.html"
         class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition"
         title="Kembali"
         aria-label="Kembali">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>

      <!-- LOGO OOER SERBA PUTIH + BADGE AI -->
      <div class="flex items-center gap-2 select-none">
        <span class="text-lg font-extrabold tracking-tight text-white">OoeR</span>
        <span class="text-[10px] font-semibold tracking-wider px-1.5 py-0.5 rounded-full bg-white/10 text-gray-300 border border-white/10">AI</span>
      </div>
    </div>

    <!-- Tombol Hapus Riwayat -->
    <button type="button"
            onclick="clearChatHistory()"
            class="text-gray-400 hover:text-white w-8 h-8 rounded-full hover:bg-white/10 transition flex items-center justify-center text-sm"
            title="Bersihkan Percakapan"
            aria-label="Bersihkan Percakapan">
      <i class="fa-regular fa-trash-can"></i>
    </button>
  </header>

  <!-- KONTEN CHAT UTAMA -->
  <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 w-full max-w-2xl mx-auto">

    <!-- WELCOME HERO (LOGO PUTIH BESAR) -->
    <div id="welcome-card" class="py-12 text-center select-none flex flex-col items-center">
      <!-- Icon Sparkle Minimalis -->
      <div class="w-12 h-12 rounded-2xl bg-white/[0.05] border border-white/10 flex items-center justify-center mb-4 shadow-xl">
        <i class="fa-solid fa-wand-magic-sparkles text-white text-lg"></i>
      </div>

      <!-- LOGO OOER BESAR SERBA PUTIH -->
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
        OoeR
      </h1>
      <p class="text-xs sm:text-sm text-gray-400 max-w-xs font-normal">
        Asisten AI pintar untuk menjawab, merangkum, dan mencari ide.
      </p>
    </div>

    <!-- PESAN SAMBUTAN AWAL -->
    <div id="opening-message" class="flex items-start gap-3">
      <!-- Avatar AI Sparkle -->
      <div class="w-7 h-7 rounded-full bg-white/10 border border-white/15 flex-shrink-0 flex items-center justify-center text-white text-[11px] shadow-sm">
        <i class="fa-solid fa-sparkles"></i>
      </div>

      <!-- Bubble Pembuka -->
      <div class="bg-[#14161f] border border-white/[0.09] rounded-2xl rounded-tl-sm p-4 max-w-[88%] shadow-sm">
        <p class="text-sm text-gray-200 leading-relaxed">Halo! Ada yang bisa saya bantu hari ini?</p>
        <div class="mt-3 flex justify-end">
          <button type="button"
                  onclick="copyMessageText(this)"
                  class="text-[11px] text-gray-400 hover:text-white transition flex items-center gap-1.5">
            <i class="fa-regular fa-copy"></i> Salin
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- FOOTER & INPUT KEKINIAN -->
  <footer class="w-full bg-[#0a0b0e] border-t border-white/[0.08] px-3 pt-2.5 pb-4 sm:px-4 sm:pb-5 flex-shrink-0">
    <div class="max-w-2xl mx-auto">
      
      <!-- QUICK PROMPT PILLS -->
      <div id="quick-prompts" class="flex items-center gap-2 overflow-x-auto pb-2.5 no-scrollbar text-xs">
        <button type="button"
                onclick="useQuickPrompt('Rangkum teks berikut secara padat dan jelas:')"
                class="flex items-center gap-1.5 bg-[#14161f] hover:bg-white/10 text-gray-300 hover:text-white px-3 py-1.5 rounded-full border border-white/[0.09] whitespace-nowrap transition text-[12px]">
          <i class="fa-regular fa-file-lines text-gray-400"></i> Rangkum artikel
        </button>

        <button type="button"
                onclick="useQuickPrompt('Jelaskan topik ini dengan sederhana:')"
                class="flex items-center gap-1.5 bg-[#14161f] hover:bg-white/10 text-gray-300 hover:text-white px-3 py-1.5 rounded-full border border-white/[0.09] whitespace-nowrap transition text-[12px]">
          <i class="fa-solid fa-book-open text-gray-400"></i> Jelaskan topik
        </button>

        <button type="button"
                onclick="useQuickPrompt('Berikan ide kreatif dan unik untuk:')"
                class="flex items-center gap-1.5 bg-[#14161f] hover:bg-white/10 text-gray-300 hover:text-white px-3 py-1.5 rounded-full border border-white/[0.09] whitespace-nowrap transition text-[12px]">
          <i class="fa-regular fa-lightbulb text-gray-400"></i> Cari ide
        </button>
      </div>

      <!-- KOTAK INPUT PILL PREMIUM -->
      <form id="chat-form"
            onsubmit="handleSubmit(event)"
            class="relative flex items-end gap-2 bg-[#13151c] border border-white/[0.12] rounded-2xl p-2 transition focus-within:border-white/30 focus-within:bg-[#161821] shadow-lg">

        <textarea id="user-input"
                  rows="1"
                  maxlength="12000"
                  placeholder="Ketik pesan..."
                  aria-label="Ketik pesan"
                  class="w-full bg-transparent text-gray-100 text-sm px-2.5 py-2 focus:outline-none resize-none max-h-32 placeholder:text-gray-500 leading-relaxed font-normal"
                  oninput="adjustTextareaHeight(this); checkInputStatus();"
                  onkeydown="handleKeyDown(event)"></textarea>

        <div class="flex items-center gap-1.5 pb-0.5 pr-0.5">
          <!-- Tombol Mikrofon -->
          <button type="button"
                  id="mic-btn"
                  onclick="toggleSpeechRecognition()"
                  class="w-9 h-9 text-gray-400 hover:text-white rounded-xl hover:bg-white/10 transition flex items-center justify-center text-sm"
                  title="Input suara">
            <i class="fa-solid fa-microphone"></i>
          </button>

          <!-- Tombol Kirim Bundar Premium -->
          <button type="submit"
                  id="send-btn"
                  disabled
                  class="w-9 h-9 bg-white text-black rounded-xl transition disabled:opacity-30 disabled:cursor-not-allowed hover:bg-gray-200 flex items-center justify-center shadow-md flex-shrink-0"
                  aria-label="Kirim">
            <i class="fa-solid fa-arrow-up text-sm font-bold"></i>
          </button>
        </div>
      </form>

      <p class="text-[10px] text-gray-500 text-center mt-2 font-normal">
        OoeR AI dapat membuat kesalahan. Harap periksa kembali info penting.
      </p>

    </div>
  </footer>

<script>
const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const welcomeCard = document.getElementById('welcome-card');

let isGenerating = false;
let recognition = null;

/* KONEKSI SUPABASE LAMA TETAP AMAN & AKTIF */
const SUPABASE_URL = 'https://jhopfzmyxuafdbwwkjbf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_FE4-8ZuWD3FgKCcjxjaErg_w97N3fwk';
const EDGE_FUNCTION_NAME = 'smooth-handler';

function adjustTextareaHeight(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}

function checkInputStatus() {
  sendBtn.disabled = !userInput.value.trim() || isGenerating;
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isGenerating && userInput.value.trim()) {
      document.getElementById('chat-form').requestSubmit();
    }
  }
}

function useQuickPrompt(text) {
  if (isGenerating) return;
  userInput.value = text;
  adjustTextareaHeight(userInput);
  checkInputStatus();
  userInput.focus();
}

async function handleSubmit(e) {
  e.preventDefault();
  const text = userInput.value.trim();
  if (!text || isGenerating) return;

  if (welcomeCard) welcomeCard.style.display = 'none';

  userInput.value = '';
  userInput.style.height = 'auto';
  isGenerating = true;
  checkInputStatus();

  appendUserBubble(text);
  const typingId = appendTypingIndicator();

  try {
    const answer = await fetchGeminiResponse(text);
    removeElement(typingId);
    appendAIBubble(answer);
  } catch (error) {
    removeElement(typingId);
    appendAIBubble('Maaf, permintaan belum dapat dijawab.\n\n*Kendala:* ' + (error.message || 'Koneksi terputus.'));
  } finally {
    isGenerating = false;
    checkInputStatus();
    userInput.focus();
  }
}

/* BUBBLE USER (PREMIUM ELEVATED) */
function appendUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'flex justify-end';

  const bubble = document.createElement('div');
  bubble.className = 'bg-[#232733] border border-white/[0.08] text-white rounded-2xl rounded-tr-sm px-4 py-3 max-w-[88%] shadow-sm';

  const p = document.createElement('p');
  p.className = 'text-sm leading-relaxed whitespace-pre-wrap select-text';
  p.textContent = text;

  bubble.appendChild(p);
  row.appendChild(bubble);
  chatContainer.appendChild(row);
  scrollToBottom();
}

/* BUBBLE AI DENGAN MARKDOWN & TOMBOL SALIN */
function appendAIBubble(text) {
  const row = document.createElement('div');
  row.className = 'flex items-start gap-3';

  const avatar = document.createElement('div');
  avatar.className = 'w-7 h-7 rounded-full bg-white/10 border border-white/15 flex-shrink-0 flex items-center justify-center text-white text-[11px] shadow-sm';
  avatar.innerHTML = '<i class="fa-solid fa-sparkles"></i>';

  const bubble = document.createElement('div');
  bubble.className = 'bg-[#14161f] border border-white/[0.09] rounded-2xl rounded-tl-sm p-4 max-w-[88%] shadow-sm';

  const markdown = document.createElement('div');
  markdown.className = 'markdown-body text-sm text-gray-200 select-text';
  markdown.innerHTML = renderSafeMarkdown(text);

  const actions = document.createElement('div');
  actions.className = 'mt-3 pt-2.5 border-t border-white/[0.06] flex justify-end';

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'text-[11px] text-gray-400 hover:text-white transition flex items-center gap-1.5';
  copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin';
  copyBtn.onclick = () => copyMessageText(copyBtn);

  actions.appendChild(copyBtn);
  bubble.append(markdown, actions);
  row.append(avatar, bubble);

  // Tombol Salin Kode di dalam blok <pre>
  markdown.querySelectorAll('pre').forEach(pre => {
    const codeBtn = document.createElement('button');
    codeBtn.type = 'button';
    codeBtn.className = 'absolute top-2.5 right-2.5 bg-white/10 hover:bg-white/20 text-gray-300 hover:text-white px-2.5 py-1 rounded-md text-xs border border-white/10 transition';
    codeBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin kode';

    codeBtn.onclick = async () => {
      const code = pre.querySelector('code');
      if (!code) return;
      const ok = await copyToClipboard(code.innerText);
      codeBtn.innerHTML = ok ? '<i class="fa-solid fa-check"></i> Tersalin' : 'Gagal';
      setTimeout(() => { codeBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin kode'; }, 1800);
    };
    pre.appendChild(codeBtn);
  });

  chatContainer.appendChild(row);
  scrollToBottom();
}

function renderSafeMarkdown(text) {
  const raw = window.marked
    ? marked.parse(text, { breaks: true, gfm: true })
    : escapeHTML(text).replace(/\n/g, '<br>');

  const doc = new DOMParser().parseFromString(raw, 'text/html');
  doc.querySelectorAll('script, iframe, object, embed, form, input, button, link, meta, style').forEach(el => el.remove());
  return doc.body.innerHTML;
}

/* TYPING INDICATOR MODERN */
function appendTypingIndicator() {
  const id = 'typing-' + Date.now();
  const row = document.createElement('div');
  row.id = id;
  row.className = 'flex items-start gap-3';

  row.innerHTML = `
    <div class="w-7 h-7 rounded-full bg-white/10 border border-white/15 flex-shrink-0 flex items-center justify-center text-white text-[11px] shadow-sm">
      <i class="fa-solid fa-sparkles"></i>
    </div>
    <div class="bg-[#14161f] border border-white/[0.09] rounded-2xl rounded-tl-sm px-4 py-3.5 flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 bg-gray-400 rounded-full dot-1"></span>
      <span class="w-1.5 h-1.5 bg-gray-400 rounded-full dot-2"></span>
      <span class="w-1.5 h-1.5 bg-gray-400 rounded-full dot-3"></span>
    </div>`;

  chatContainer.appendChild(row);
  scrollToBottom();
  return id;
}

/* EDGE FUNCTION SUPABASE */
async function fetchGeminiResponse(prompt) {
  const endpoint = `${SUPABASE_URL}/functions/v1/${EDGE_FUNCTION_NAME}`;

  const response = await fetch(endpoint, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_PUBLISHABLE_KEY,
      'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
    },
    body: JSON.stringify({ message: prompt })
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data.error?.message || data.message || `Error HTTP ${response.status}`);
  return (data.reply || data.answer || '').trim();
}

function clearChatHistory() {
  if (isGenerating) return alert('Tunggu sampai jawaban selesai.');
  if (!confirm('Hapus riwayat percakapan?')) return;

  chatContainer.innerHTML = '';
  if (welcomeCard) {
    welcomeCard.style.display = 'flex';
    chatContainer.appendChild(welcomeCard);
  }

  const row = document.createElement('div');
  row.id = 'opening-message';
  row.className = 'flex items-start gap-3';
  row.innerHTML = `
    <div class="w-7 h-7 rounded-full bg-white/10 border border-white/15 flex-shrink-0 flex items-center justify-center text-white text-[11px] shadow-sm">
      <i class="fa-solid fa-sparkles"></i>
    </div>
    <div class="bg-[#14161f] border border-white/[0.09] rounded-2xl rounded-tl-sm p-4 max-w-[88%] shadow-sm">
      <p class="text-sm text-gray-200 leading-relaxed">Halo! Ada yang bisa saya bantu hari ini?</p>
      <div class="mt-3 flex justify-end">
        <button type="button" onclick="copyMessageText(this)" class="text-[11px] text-gray-400 hover:text-white transition flex items-center gap-1.5">
          <i class="fa-regular fa-copy"></i> Salin
        </button>
      </div>
    </div>`;
  chatContainer.appendChild(row);
  userInput.focus();
}

async function copyMessageText(btn) {
  const bubble = btn.closest('.bg-\\[\\#14161f\\]') || btn.closest('div');
  const content = bubble.querySelector('.markdown-body') || bubble.querySelector('p');
  if (!content) return;

  const ok = await copyToClipboard(content.innerText);
  const orig = btn.innerHTML;
  btn.innerHTML = ok ? '<i class="fa-solid fa-check"></i> Tersalin' : 'Gagal';
  setTimeout(() => { btn.innerHTML = orig; }, 1800);
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  return false;
}

/* PENCARIAN SUARA */
function toggleSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert('Input suara tidak didukung browser ini.');

  if (!recognition) {
    recognition = new SR();
    recognition.lang = 'id-ID';
    recognition.onstart = () => micBtn.classList.add('text-white', 'scale-110');
    recognition.onresult = (e) => {
      userInput.value += (userInput.value ? ' ' : '') + e.results[0][0].transcript;
      adjustTextareaHeight(userInput);
      checkInputStatus();
    };
    recognition.onend = () => micBtn.classList.remove('text-white', 'scale-110');
  }
  try { recognition.start(); } catch {}
}

function removeElement(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function scrollToBottom() {
  requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
}

function escapeHTML(str) {
  return String(str).replace(/[&<>'"]/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[ch]));
}

checkInputStatus();
</script>

</body>
</html>
