<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#131314">
<title>OoeR Search — Cerdas, Resmi & Lengkap</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  color-scheme: dark;
  --bg: #131314;
  --card-bg: #1e1f20;
  --search-bg: #282a2d;
  --text: #ffffff;
  --muted: #9aa0a6;
  --border: #3c4043;
  --link-blue: #8ab4f8;
  --green: #34a853;
  --yellow: #fbbc05;
  --red: #ea4335;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100vh; background-color: var(--bg);
  color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { cursor: pointer; border: 0; background: transparent; }

.ooer-header {
  height: 56px; padding: 0 16px; display: flex;
  align-items: center; justify-content: space-between;
}
.back-btn {
  color: #cfd3dc; display: flex; align-items: center;
  justify-content: center; width: 36px; height: 36px; border-radius: 50%;
  transition: background .2s ease;
}
.back-btn:hover { background: #282a2d; }
.ooer-brand {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: 26px; font-weight: 700; color: #fff; user-select: none;
}

.search-wrapper { padding: 4px 14px 10px; }
.search-pill {
  background-color: var(--search-bg); border-radius: 28px;
  display: flex; align-items: center; padding: 0 10px 0 14px; height: 48px;
  border: 1px solid transparent; transition: border-color .2s;
}
.search-pill:focus-within { border-color: var(--link-blue); }
#query {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 15px; min-width: 0;
}
.pill-tools { display: flex; align-items: center; gap: 6px; }

.lang-box {
  background: #1e1f20; border: 1px solid var(--border);
  border-radius: 20px; padding: 2px 8px;
}
.lang-select {
  background: transparent; color: #8ab4f8; border: none;
  font-size: 12px; font-weight: 600; outline: none; cursor: pointer; max-width: 95px;
}
.lang-select option, .lang-select optgroup { background: #202124; color: #fff; }

.nav-tabs {
  display: flex; gap: 20px; overflow-x: auto; padding: 0 16px;
  border-bottom: 1px solid var(--border); scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.tab-item {
  color: var(--muted); font-size: 14px; font-weight: 500;
  padding: 10px 0 12px; white-space: nowrap; position: relative;
}
.tab-item.active { color: #ffffff; font-weight: 600; }
.tab-item.active::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px; background-color: #ffffff; border-radius: 3px 3px 0 0;
}

.main-container { max-width: 650px; margin: 0 auto; padding: 14px; }
.status-msg { padding: 16px 0; color: var(--muted); font-size: 13px; text-align: center; }

/* ANIMASI KERANGKA SKELETON (SHIMMER) */
.skeleton {
  background: linear-gradient(90deg, #1e1f20 25%, #2a2c2e 50%, #1e1f20 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 8px;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-card {
  background-color: var(--card-bg); border-radius: 18px;
  padding: 18px; margin-bottom: 16px; border: 1px solid #2d3033;
}
.skeleton-line { height: 14px; margin-bottom: 10px; border-radius: 6px; }
.skeleton-line.short { width: 35%; }
.skeleton-line.medium { width: 70%; }
.skeleton-line.full { width: 100%; }

/* KARTU AI */
.ai-card {
  background-color: var(--card-bg); border-radius: 18px;
  padding: 18px; margin-bottom: 16px; border: 1px solid #2d3033;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.ai-header-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; color: #8ab4f8; margin-bottom: 8px;
}
.ai-text { font-size: 14px; line-height: 1.65; color: #e3e3e3; white-space: pre-line; }

/* GRID GAMBAR */
.gallery-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  margin-bottom: 16px;
}
.image-item-wrap {
  position: relative; border-radius: 12px; overflow: hidden;
  background: #282a2c; cursor: pointer; aspect-ratio: 4/3;
}
.image-item-wrap img {
  width: 100%; height: 100%; object-fit: cover; transition: transform .2s ease;
}
.image-item-wrap:hover img { transform: scale(1.04); }
.image-license-tag {
  position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,.75);
  backdrop-filter: blur(4px); padding: 3px 7px; border-radius: 6px;
  font-size: 10px; font-weight: 600; color: #a8c7fa;
}

/* KARTU ARTIKEL (BEBAS BLOKIR) */
.article-card {
  padding: 14px 0; border-bottom: 1px solid #282a2d; cursor: pointer;
  animation: fadeIn 0.25s ease;
}
.article-source { font-size: 11px; color: #9aa0a6; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
.article-title { color: var(--link-blue); font-size: 17px; line-height: 1.35; margin-bottom: 4px; font-weight: 500; }
.article-snippet { font-size: 13px; line-height: 1.5; color: #bdc1c6; }

/* KARTU VIDEO */
.video-card { background: var(--card-bg); padding: 14px; border-radius: 14px; margin-bottom: 14px; }
.video-title { font-size: 14px; margin-top: 10px; color: #e8eaed; }

/* MODAL LISENSI GAMBAR */
#imageModal {
  display: none; position: fixed; inset: 0; z-index: 10000;
  background: rgba(0,0,0,.92); backdrop-filter: blur(10px);
  align-items: center; justify-content: center; padding: 16px;
}
#imageModal.active { display: flex; }
.image-dialog {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 20px; width: min(100%, 540px); overflow: hidden;
  box-shadow: 0 20px 60px #000;
}
.image-dialog-preview { width: 100%; max-height: 50vh; object-fit: contain; background: #000; display: block; }
.image-dialog-body { padding: 18px; }
.image-dialog-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.badge-license {
  display: inline-block; padding: 5px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600; margin-bottom: 12px;
}
.badge-free { background: rgba(52,168,83,.2); color: #81c995; border: 1px solid #34a853; }
.badge-warn { background: rgba(251,188,5,.2); color: #fdd663; border: 1px solid #fbbc05; }
.image-meta-item { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.image-meta-item b { color: #e8eaed; }
.image-close-btn {
  width: 100%; padding: 12px; border-radius: 10px; background: var(--search-bg);
  color: #fff; font-size: 14px; font-weight: 600; margin-top: 10px;
}
</style>
</head>
<body>

<header class="ooer-header">
  <a class="back-btn" href="./" title="Kembali ke Beranda">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>
  <a class="ooer-brand" href="./">OoeR</a>
</header>

<div class="search-wrapper">
  <form id="searchForm" class="search-pill">
    <input id="query" name="q" type="search" placeholder="Telusuri di OoeR..." autocomplete="off">
    <div class="pill-tools">
      <div class="lang-box">
        <select id="langSelect" class="lang-select">
          <optgroup label="Asia Tenggara">
            <option value="Indonesia">🇮🇩 ID</option>
            <option value="Melayu (Malaysia)">🇲🇾 MY</option>
            <option value="Tagalog (Filipina)">🇵🇭 PH</option>
            <option value="Thailand">🇹🇭 TH</option>
            <option value="Vietnam">🇻🇳 VN</option>
          </optgroup>
          <optgroup label="Asia Timur & Selatan">
            <option value="Jepang">🇯🇵 JP</option>
            <option value="Korea">🇰🇷 KR</option>
            <option value="Mandarin">🇨🇳 ZH</option>
            <option value="Hindi (India)">🇮🇳 IN</option>
            <option value="Arab">🇸🇦 AR</option>
          </optgroup>
          <optgroup label="Global / Barat">
            <option value="English (US)">🇺🇸 US</option>
            <option value="English (UK)">🇬🇧 UK</option>
          </optgroup>
        </select>
      </div>
    </div>
  </form>
</div>

<nav class="nav-tabs">
  <button class="tab-item active" data-tab="all" id="tabAll">Semua</button>
  <button class="tab-item" data-tab="ai" id="tabAi">✨ OoeR AI</button>
  <button class="tab-item" data-tab="images" id="tabImages">Gambar</button>
  <button class="tab-item" data-tab="news" id="tabNews">Berita</button>
  <button class="tab-item" data-tab="videos" id="tabVideos">Video</button>
</nav>

<main class="main-container">
  <div id="statusBox" class="status-msg">Ketik kata kunci untuk mencari...</div>
  <div id="resultsArea"></div>
</main>

<div id="imageModal">
  <div class="image-dialog">
    <img id="imgModalPreview" class="image-dialog-preview" src="" alt="Preview">
    <div class="image-dialog-body">
      <div id="imgModalBadge" class="badge-license badge-free">✅ Diperbolehkan Untuk Konten</div>
      <div class="image-dialog-title" id="imgModalTitle">Judul Gambar</div>
      <div class="image-meta-item"><b>Lisensi:</b> <span id="imgModalLicense">-</span></div>
      <div class="image-meta-item"><b>Pencipta / Penulis:</b> <span id="imgModalAuthor">-</span></div>
      <div class="image-meta-item"><b>Sumber Legal:</b> <span id="imgModalSource">-</span></div>
      <button class="image-close-btn" id="closeImgModal">Tutup Pratinjau</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const input = $("query");
  const statusBox = $("statusBox");
  const resultsArea = $("resultsArea");
  const langSelect = $("langSelect");
  const tabs = document.querySelectorAll(".tab-item");

  const imageModal = $("imageModal");
  const imgModalPreview = $("imgModalPreview");
  const imgModalTitle = $("imgModalTitle");
  const imgModalBadge = $("imgModalBadge");
  const imgModalLicense = $("imgModalLicense");
  const imgModalAuthor = $("imgModalAuthor");
  const imgModalSource = $("imgModalSource");

  let currentTab = "all";
  let activeData = null;

  /* KONFIGURASI SUPABASE & EDGE FUNCTIONS */
  const SUPABASE_URL = "https://jhopfzmyxuafdbwwkjbf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FE4-8ZuWD3FgKCcjxjaErg_w97N3fwk";
  const COLLECTOR_URL = "https://jhopfzmyxuafdbwwkjbf.supabase.co/functions/v1/rapid-task";
  const GROK_TRANSLATOR_URL = "https://jhopfzmyxuafdbwwkjbf.supabase.co/functions/v1/Grok.ai";

  const supabase = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  /* KAMUS TERJEMAHAN 12 BAHASA LENGKAP */
  const UI_DICT = {
    "Indonesia": { all: "Semua", ai: "✨ OoeR AI", img: "Gambar", news: "Berita", vid: "Video", license: "🔍 Cek Lisensi", sum: "✨ Ringkasan OoeR AI", mem: "⚡ Memori Cepat OoeR", noVid: "Tidak ada video terbuka untuk topik ini.", ph: "Telusuri di OoeR...", translating: "Menerjemahkan dengan Grok.ai..." },
    "English (US)": { all: "All", ai: "✨ OoeR AI", img: "Images", news: "News", vid: "Videos", license: "🔍 Check License", sum: "✨ OoeR AI Summary", mem: "⚡ OoeR Instant Memory", noVid: "No open videos for this topic.", ph: "Search in OoeR...", translating: "Translating with Grok.ai..." },
    "English (UK)": { all: "All", ai: "✨ OoeR AI", img: "Images", news: "News", vid: "Videos", license: "🔍 Check Licence", sum: "✨ OoeR AI Summary", mem: "⚡ OoeR Instant Memory", noVid: "No open videos for this topic.", ph: "Search in OoeR...", translating: "Translating with Grok.ai..." },
    "Melayu (Malaysia)": { all: "Semua", ai: "✨ OoeR AI", img: "Imej", news: "Berita", vid: "Video", license: "🔍 Semak Lesen", sum: "✨ Ringkasan OoeR AI", mem: "⚡ Memori Pantas OoeR", noVid: "Tiada video dibuka untuk topik ini.", ph: "Cari di OoeR...", translating: "Menterjemah dengan Grok.ai..." },
    "Tagalog (Filipina)": { all: "Lahat", ai: "✨ OoeR AI", img: "Mga Larawan", news: "Balita", vid: "Mga Video", license: "🔍 Suriin ang Lisensya", sum: "✨ Buod ng OoeR AI", mem: "⚡ Mabilisang Memorya ng OoeR", noVid: "Walang bukas na video para sa paksang ito.", ph: "Maghanap sa OoeR...", translating: "Isinasalin gamit ang Grok.ai..." },
    "Thailand": { all: "ทั้งหมด", ai: "✨ OoeR AI", img: "รูปภาพ", news: "ข่าว", vid: "วิดีโอ", license: "🔍 ตรวจสอบใบอนุญาต", sum: "✨ บทสรุป OoeR AI", mem: "⚡ หน่วยความจำด่วน OoeR", noVid: "ไม่มีวิดีโอสำหรับหัวข้อนี้", ph: "ค้นหาใน OoeR...", translating: "กำลังแปลภาษาด้วย Grok.ai..." },
    "Vietnam": { all: "Tất cả", ai: "✨ OoeR AI", img: "Hình ảnh", news: "Tin tức", vid: "Video", license: "🔍 Kiểm tra giấy phép", sum: "✨ Tóm tắt OoeR AI", mem: "⚡ Bộ nhớ nhanh OoeR", noVid: "Không có video cho chủ đề này.", ph: "Tìm kiếm trên OoeR...", translating: "Đang dịch bằng Grok.ai..." },
    "Jepang": { all: "すべて", ai: "✨ OoeR AI", img: "画像", news: "ニュース", vid: "動画", license: "🔍 ライセンス確認", sum: "✨ OoeR AI 要約", mem: "⚡ OoeR 高速メモリ", noVid: "このトピックの動画はありません。", ph: "OoeR で検索...", translating: "Grok.ai で翻訳中..." },
    "Korea": { all: "전체", ai: "✨ OoeR AI", img: "이미지", news: "뉴스", vid: "동영상", license: "🔍 라이선스 확인", sum: "✨ OoeR AI 요약", mem: "⚡ OoeR 빠른 메모리", noVid: "이 주제에 대한 동영상이 없습니다.", ph: "OoeR 에서 검색...", translating: "Grok.ai로 번역 중..." },
    "Mandarin": { all: "全部", ai: "✨ OoeR AI", img: "图片", news: "新闻", vid: "视频", license: "🔍 检查许可证", sum: "✨ OoeR AI 摘要", mem: "⚡ OoeR 极速记忆", noVid: "该主题没有开放视频。", ph: "在 OoeR 中搜索...", translating: "正在通过 Grok.ai 翻译..." },
    "Hindi (India)": { all: "सभी", ai: "✨ OoeR AI", img: "चित्र", news: "समाचार", vid: "वीडियो", license: "🔍 लाइसेंस जांचें", sum: "✨ OoeR AI सारांश", mem: "⚡ OoeR त्वरित मेमोरी", noVid: "इस विषय के लिए कोई video नहीं है।", ph: "OoeR में खोजें...", translating: "Grok.ai द्वारा अनुवाद किया जा रहा है..." },
    "Arab": { all: "الكل", ai: "✨ OoeR AI", img: "الصور", news: "الأخبار", vid: "الفيديوهات", license: "🔍 فحص الترخيص", sum: "✨ ملخص OoeR AI", mem: "⚡ ذاكرة OoeR السريعة", noVid: "لا توجد مقاطع فيديو متاحة لهذا الموضوع.", ph: "ابحث في OoeR...", translating: "جارٍ الترجمة بواسطة Grok.ai..." }
  };

  function applyUILanguage(lang) {
    const d = UI_DICT[lang] || UI_DICT["Indonesia"];
    $("tabAll").textContent = d.all;
    $("tabAi").textContent = d.ai;
    $("tabImages").textContent = d.img;
    $("tabNews").textContent = d.news;
    $("tabVideos").textContent = d.vid;
    if (input) input.placeholder = d.ph;
  }

  function showSkeleton() {
    statusBox.hidden = true;
    resultsArea.innerHTML = `
      <div class="skeleton-card">
        <div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line full"></div>
        <div class="skeleton skeleton-line full"></div>
        <div class="skeleton skeleton-line medium"></div>
      </div>
      <div style="padding: 14px 0; border-bottom: 1px solid #282a2d;">
        <div class="skeleton skeleton-line short" style="height:10px;"></div>
        <div class="skeleton skeleton-line medium" style="height:16px;"></div>
        <div class="skeleton skeleton-line full" style="height:12px;"></div>
      </div>
      <div style="padding: 14px 0;">
        <div class="skeleton skeleton-line short" style="height:10px;"></div>
        <div class="skeleton skeleton-line medium" style="height:16px;"></div>
        <div class="skeleton skeleton-line full" style="height:12px;"></div>
      </div>
    `;
  }

  async function terjemahkanDenganGrok(teks, targetLang) {
    if (targetLang === "Indonesia" || !teks) return teks;

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4500);

    try {
      const res = await fetch(GROK_TRANSLATOR_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          message: `Translate this summary into ${targetLang} naturally and concisely without intro:\n\n${teks}`,
          max_tokens: 600
        }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      const d = await res.json();
      return d.reply || teks;
    } catch (e) {
      clearTimeout(timeoutId);
      return teks;
    }
  }

  const params = new URLSearchParams(location.search);
  const langFromUrl = params.get("lang");
  const currentSavedLang = langFromUrl || localStorage.getItem("ooer_user_lang") || "Indonesia";
  langSelect.value = currentSavedLang;
  localStorage.setItem("ooer_user_lang", currentSavedLang);
  applyUILanguage(currentSavedLang);

  langSelect.addEventListener("change", async () => {
    const chosen = langSelect.value;
    localStorage.setItem("ooer_user_lang", chosen);
    applyUILanguage(chosen);

    if (activeData && activeData.answer) {
      const d = UI_DICT[chosen] || UI_DICT["Indonesia"];
      statusBox.textContent = d.translating;
      statusBox.hidden = false;
      activeData.answer = await terjemahkanDenganGrok(activeData.answer, chosen);
      statusBox.hidden = true;
      renderView();
    } else if (input.value.trim()) {
      runSearch(input.value);
    }
  });

  function openImageInspector(imgObj) {
    imgModalPreview.src = typeof imgObj === "string" ? imgObj : imgObj.url;
    imgModalTitle.textContent = imgObj.title || "Foto Terverifikasi OoeR";
    imgModalLicense.textContent = imgObj.license || "Creative Commons / Domain Publik";
    imgModalAuthor.textContent = imgObj.author || "Arsip Terbuka Media";
    imgModalSource.textContent = imgObj.source || "Wikimedia / Wikipedia";

    if (imgObj.allow_content !== false) {
      imgModalBadge.className = "badge-license badge-free";
      imgModalBadge.textContent = "✅ Diperbolehkan Untuk Konten (CC / Domain Publik)";
    } else {
      imgModalBadge.className = "badge-license badge-warn";
      imgModalBadge.textContent = "⚠️ Hak Cipta Warta Media (Perlu Izin Penerbit)";
    }

    imageModal.classList.add("active");
  }

  $("closeImgModal").addEventListener("click", () => imageModal.classList.remove("active"));
  imageModal.addEventListener("click", e => { if (e.target === imageModal) imageModal.classList.remove("active"); });

  function renderView() {
    if (!activeData) return;
    resultsArea.replaceChildren();

    const d = UI_DICT[langSelect.value] || UI_DICT["Indonesia"];

    if (currentTab === "all") {
      const aiBox = document.createElement("div");
      aiBox.className = "ai-card";
      aiBox.innerHTML = `
        <div class="ai-header-badge">${activeData.is_memory ? d.mem : d.sum}</div>
        <div class="ai-text">${activeData.answer || ""}</div>
      `;
      resultsArea.appendChild(aiBox);

      if (activeData.images && activeData.images.length > 0) {
        const gal = document.createElement("div");
        gal.className = "gallery-grid";
        activeData.images.slice(0, 4).forEach(img => {
          const item = document.createElement("div");
          item.className = "image-item-wrap";
          const src = typeof img === "string" ? img : img.url;
          item.innerHTML = `
            <img src="${src}" alt="Foto" loading="lazy">
            <span class="image-license-tag">${d.license}</span>
          `;
          item.addEventListener("click", () => openImageInspector(img));
          gal.appendChild(item);
        });
        resultsArea.appendChild(gal);
      }

      if (activeData.articles && activeData.articles.length > 0) {
        activeData.articles.forEach(art => {
          const card = document.createElement("div");
          card.className = "article-card";
          card.innerHTML = `
            <div class="article-source">🌐 ${art.source || "Web"}</div>
            <div class="article-title">${art.title || ""} ↗</div>
            <div class="article-snippet">${art.snippet || ""}</div>
          `;
          card.addEventListener("click", () => {
            window.open(art.url, "_blank", "noopener,noreferrer");
          });
          resultsArea.appendChild(card);
        });
      }
    } else if (currentTab === "ai") {
      resultsArea.innerHTML = `
        <div class="ai-card">
          <div class="ai-header-badge">✦ OoeR Deep AI Intel</div>
          <div class="ai-text">${activeData.answer || ""}</div>
        </div>
      `;
    } else if (currentTab === "images") {
      const gal = document.createElement("div");
      gal.className = "gallery-grid";
      (activeData.images || []).forEach(img => {
        const item = document.createElement("div");
        item.className = "image-item-wrap";
        item.style.aspectRatio = "1/1";
        const src = typeof img === "string" ? img : img.url;
        item.innerHTML = `
          <img src="${src}" alt="Foto" loading="lazy">
          <span class="image-license-tag">${d.license}</span>
        `;
        item.addEventListener("click", () => openImageInspector(img));
        gal.appendChild(item);
      });
      resultsArea.appendChild(gal);
    } else if (currentTab === "news") {
      (activeData.articles || []).forEach(art => {
        const card = document.createElement("div");
        card.className = "article-card";
        card.innerHTML = `
          <div class="article-source">📰 ${art.source || "News"}</div>
          <div class="article-title">${art.title || ""} ↗</div>
          <div class="article-snippet">${art.snippet || ""}</div>
        `;
        card.addEventListener("click", () => {
          window.open(art.url, "_blank", "noopener,noreferrer");
        });
        resultsArea.appendChild(card);
      });
    } else if (currentTab === "videos") {
      resultsArea.replaceChildren();

      let videoList = activeData.videos || [];

      if (!videoList || videoList.length === 0) {
        const queryClean = encodeURIComponent(input.value.trim() || "video populer");
        
        const mainVideoCard = document.createElement("div");
        mainVideoCard.className = "video-card";
        mainVideoCard.innerHTML = `
          <div style="font-size:12px; color:#8ab4f8; margin-bottom:8px; font-weight:600;">
            🎬 Rekomendasi Video OoeR untuk: "${input.value.trim()}"
          </div>
          <div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:12px; background:#000;">
            <iframe 
              src="https://www.youtube-nocookie.com/embed?listType=search&list=${queryClean}" 
              title="YouTube Video" 
              style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
          </div>
          <div class="video-title" style="margin-top:10px; font-weight:600;">
            Putar Koleksi Video: ${input.value.trim()}
          </div>
        `;
        resultsArea.appendChild(mainVideoCard);

        const videoChannels = [
          { name: "YouTube Video Terpopuler", icon: "▶", color: "#ea4335", url: `https://www.youtube.com/results?search_query=${queryClean}` },
          { name: "Video Shorts & Pendek", icon: "⚡", color: "#fbbc05", url: `https://www.youtube.com/results?search_query=${queryClean}+shorts` },
          { name: "Live Streaming & Berita Video", icon: "🔴", color: "#34a853", url: `https://www.youtube.com/results?search_query=${queryClean}+live` }
        ];

        videoChannels.forEach(item => {
          const itemCard = document.createElement("div");
          itemCard.style.cssText = "background:var(--card-bg); padding:14px; border-radius:14px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; border:1px solid #282a2d;";
          itemCard.innerHTML = `
            <div style="display:flex; align-items:center; gap:12px;">
              <span style="background:${item.color}; color:#fff; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:14px;">
                ${item.icon}
              </span>
              <div>
                <div style="font-weight:600; font-size:14px; color:#fff;">${item.name}</div>
                <div style="font-size:12px; color:var(--muted);">Koleksi video terkait "${input.value.trim()}"</div>
              </div>
            </div>
            <span style="color:#8ab4f8; font-size:14px; font-weight:600;">Buka ↗</span>
          `;
          itemCard.addEventListener("click", () => {
            window.open(item.url, "_blank", "noopener,noreferrer");
          });
          resultsArea.appendChild(itemCard);
        });

      } else {
        videoList.forEach(vid => {
          const card = document.createElement("div");
          card.className = "video-card";
          const url = vid.url || "";
          const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([a-zA-Z0-9_-]{11})/);

          if (ytMatch && ytMatch[1]) {
            card.innerHTML = `
              <div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:12px; background:#000;">
                <iframe 
                  src="https://www.youtube-nocookie.com/embed/${ytMatch[1]}" 
                  title="${vid.title || 'Video'}" 
                  style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" 
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                  allowfullscreen>
                </iframe>
              </div>
              <div class="video-title" style="margin-top:10px; font-weight:600;">🎬 ${vid.title || "Video OoeR"}</div>
            `;
          } else {
            card.innerHTML = `
              <div style="background:#282a2d; padding:15px; border-radius:12px; cursor:pointer;" onclick="window.open('${url}','_blank')">
                <div style="font-weight:600; color:#8ab4f8;">🎬 ${vid.title || "Tonton Video"} ↗</div>
                <div style="font-size:12px; color:#aaa; margin-top:4px;">Klik untuk memutar langsung</div>
              </div>
            `;
          }
          resultsArea.appendChild(card);
        });
      }
    }
  }
async function runSearch(keyword) {
    const q = keyword.trim().toLowerCase();
    if (!q) return;

    input.value = keyword.trim();

    // ⚡ 1. CEK CACHE LOKAL DI HP PENGGUNA (0.01 DETIK - INSTAN!)
    const localCacheKey = `ooer_cache_${q}_${langSelect.value}`;
    const cachedData = sessionStorage.getItem(localCacheKey);
    
    if (cachedData) {
      try {
        activeData = JSON.parse(cachedData);
        statusBox.hidden = true;
        renderView(); // Langsung muncul tanpa loading sama sekali!
        return;
      } catch (e) {}
    }

    // Tampilkan skeleton hanya jika belum ada di memori
    showSkeleton();

    // ⚡ 2. CEK SUPABASE VAULT (CEPAT)
    if (supabase) {
      try {
        const { data: vData } = await supabase
          .from("ooer_ai_vault")
          .select("*")
          .ilike("query", q)
          .maybeSingle();

        if (vData && vData.answer) {
          activeData = {
            is_memory: true,
            query: q,
            answer: vData.answer,
            images: vData.images || [],
            articles: vData.articles || [],
            videos: vData.videos || []
          };

          // Render dulu hasil mentahnya agar layar tidak kosong!
          statusBox.hidden = true;
          renderView();

          // Simpan ke HP untuk pencarian berikutnya
          sessionStorage.setItem(localCacheKey, JSON.stringify(activeData));

          // Terjemahkan di latar belakang jika perlu
          if (langSelect.value !== "Indonesia") {
            terjemahkanDenganGrok(activeData.answer, langSelect.value).then(trans => {
              activeData.answer = trans;
              renderView();
            });
          }
          return;
        }
      } catch (e) {
        console.warn("Vault check error:", e);
      }
    }

    // ⚡ 3. JIKA BELUM ADA, AMBIL DARI COLLECTOR
    try {
      const res = await fetch(COLLECTOR_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify({
          query: q,
          lang: langSelect.value
        })
      });

      const data = await res.json();
      activeData = data;

      // Langsung render hasil web, gambar, dan video seketika
      statusBox.hidden = true;
      renderView();

      // Simpan ke memori HP agar pencarian kedua instan
      sessionStorage.setItem(localCacheKey, JSON.stringify(activeData));

    } catch (err) {
      statusBox.textContent = "Gagal memuat data pencarian. Silakan coba lagi.";
      statusBox.hidden = false;
    }
  }
 </script>
