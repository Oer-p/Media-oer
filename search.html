<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#131314">
<title>OoeR Search — Cerdas & Lengkap</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  color-scheme: dark;
  --bg: #131314;
  --card-bg: #1e1f20;
  --search-bg: #282a2d;
  --text: #ffffff;
  --muted: #9aa0a6;
  --border: #3c4043;
  --link-blue: #8ab4f8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100vh; background-color: var(--bg);
  color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { cursor: pointer; border: 0; background: transparent; }

.ooer-header {
  height: 56px; padding: 0 16px; display: flex;
  align-items: center; justify-content: space-between;
}
.back-btn {
  color: #cfd3dc; display: flex; align-items: center;
  justify-content: center; width: 36px; height: 36px; border-radius: 50%;
}
.ooer-brand {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: 26px; font-weight: 700; color: #fff; user-select: none;
}

.search-wrapper { padding: 4px 14px 10px; }
.search-pill {
  background-color: var(--search-bg); border-radius: 28px;
  display: flex; align-items: center; padding: 0 10px 0 14px; height: 48px;
}
#query {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 15px; min-width: 0;
}
.pill-tools { display: flex; align-items: center; gap: 6px; }

/* DROPDOWN BAHASA LENGKAP */
.lang-box {
  background: #1e1f20; border: 1px solid var(--border);
  border-radius: 20px; padding: 2px 8px;
}
.lang-select {
  background: transparent; color: #8ab4f8; border: none;
  font-size: 12px; font-weight: 600; outline: none; cursor: pointer; max-width: 95px;
}
.lang-select option, .lang-select optgroup { background: #202124; color: #fff; }

/* TABS KATEGORI */
.nav-tabs {
  display: flex; gap: 20px; overflow-x: auto; padding: 0 16px;
  border-bottom: 1px solid var(--border); scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.tab-item {
  color: var(--muted); font-size: 14px; font-weight: 500;
  padding: 10px 0 12px; white-space: nowrap; position: relative;
}
.tab-item.active { color: #ffffff; font-weight: 600; }
.tab-item.active::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px; background-color: #ffffff; border-radius: 3px 3px 0 0;
}

.main-container { max-width: 650px; margin: 0 auto; padding: 14px; }
.status-msg { padding: 20px 0; color: var(--muted); font-size: 13px; text-align: center; }

/* KARTU OVERVIEW & AI */
.ai-card {
  background-color: var(--card-bg); border-radius: 18px;
  padding: 18px; margin-bottom: 16px; border: 1px solid #2d3033;
}
.ai-header-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; color: #8ab4f8; margin-bottom: 8px;
}
.ai-text { font-size: 14px; line-height: 1.65; color: #e3e3e3; white-space: pre-line; }

/* GRID GAMBAR */
.gallery-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  margin-bottom: 16px; border-radius: 14px; overflow: hidden;
}
.gallery-grid img {
  width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #282a2c; border-radius: 8px;
}

/* KARTU ARTIKEL / BERITA */
.article-card {
  padding: 14px 0; border-bottom: 1px solid #282a2d;
}
.article-source { font-size: 11px; color: #9aa0a6; margin-bottom: 2px; }
.article-title { color: var(--link-blue); font-size: 17px; line-height: 1.35; margin-bottom: 4px; display: block; }
.article-snippet { font-size: 13px; line-height: 1.5; color: #bdc1c6; }

/* VIDEO CARD */
.video-card {
  background: var(--card-bg); padding: 14px; border-radius: 14px; margin-bottom: 12px;
}
.video-card video { width: 100%; border-radius: 8px; max-height: 240px; background: #000; }
.video-title { font-size: 14px; margin-top: 6px; color: #e8eaed; }
</style>
</head>
<body>

<header class="ooer-header">
  <a class="back-btn" href="./" title="Kembali ke Beranda">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>
  <a class="ooer-brand" href="./">OoeR</a>
</header>

<div class="search-wrapper">
  <form id="searchForm" class="search-pill">
    <input id="query" name="q" type="search" placeholder="Telusuri di OoeR..." autocomplete="off">
    <div class="pill-tools">
      <div class="lang-box">
        <select id="langSelect" class="lang-select">
          <optgroup label="Asia Tenggara">
            <option value="Indonesia">🇮🇩 ID</option>
            <option value="Melayu (Malaysia)">🇲🇾 MY</option>
            <option value="Tagalog (Filipina)">🇵🇭 PH</option>
            <option value="Thailand">🇹🇭 TH</option>
            <option value="Vietnam">🇻🇳 VN</option>
          </optgroup>
          <optgroup label="Asia Timur & Selatan">
            <option value="Jepang">🇯🇵 JP</option>
            <option value="Korea">🇰🇷 KR</option>
            <option value="Mandarin">🇨🇳 ZH</option>
            <option value="Hindi (India)">🇮🇳 IN</option>
            <option value="Arab">🇸🇦 AR</option>
          </optgroup>
          <optgroup label="Global / Barat">
            <option value="English (US)">🇺🇸 US</option>
            <option value="English (UK)">🇬🇧 UK</option>
          </optgroup>
        </select>
      </div>
    </div>
  </form>
</div>

<!-- SEMUA MENU KATEGORI -->
<nav class="nav-tabs">
  <button class="tab-item active" data-tab="all">Semua</button>
  <button class="tab-item" data-tab="ai">✨ OoeR AI</button>
  <button class="tab-item" data-tab="images">Gambar</button>
  <button class="tab-item" data-tab="news">Berita</button>
  <button class="tab-item" data-tab="videos">Video</button>
  <button class="tab-item" data-tab="books">Buku</button>
</nav>

<main class="main-container">
  <div id="statusBox" class="status-msg">Ketik kata kunci untuk mencari...</div>
  <div id="resultsArea"></div>
</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const input = $("query");
  const statusBox = $("statusBox");
  const resultsArea = $("resultsArea");
  const langSelect = $("langSelect");
  const tabs = document.querySelectorAll(".tab-item");

  let currentTab = "all";
  let activeData = null;

  // KUNCI & ENDPOINT RESMI SUPABASE (RAPID-TASK)
  const SUPABASE_KEY = "sb_publishable_FE4-8ZuWD3FgKCcjxjaErg_w97N3fwk";
  const COLLECTOR_URL = "https://jhopfzmyxuafdbwwkjbf.supabase.co/functions/v1/rapid-task";

  // Muat bahasa permanen dari localStorage
  const savedLang = localStorage.getItem("ooer_user_lang") || "Indonesia";
  langSelect.value = savedLang;

  langSelect.addEventListener("change", () => {
    localStorage.setItem("ooer_user_lang", langSelect.value);
    if (input.value.trim()) runSearch(input.value);
  });

  function showStatus(text) {
    statusBox.textContent = text;
    statusBox.hidden = false;
  }

  // RENDER SESUAI MENU TAB YANG DIKLIK
  function renderView() {
    if (!activeData) return;
    resultsArea.replaceChildren();

    // 1. TAB SEMUA (Gabungan Cerdas)
    if (currentTab === "all") {
      // Kotak AI Overview
      const aiBox = document.createElement("div");
      aiBox.className = "ai-card";
      aiBox.innerHTML = `
        <div class="ai-header-badge">${activeData.is_memory ? "⚡ Memori OoeR Permanen" : "✨ Ringkasan OoeR AI"}</div>
        <div class="ai-text">${activeData.answer || "Tidak ada ringkasan tersedia."}</div>
      `;
      resultsArea.appendChild(aiBox);

      // Gambar 2-4 Kolom
      if (activeData.images && activeData.images.length > 0) {
        const gal = document.createElement("div");
        gal.className = "gallery-grid";
        activeData.images.slice(0, 4).forEach(src => {
          gal.innerHTML += `<img src="${src}" alt="Gambar">`;
        });
        resultsArea.appendChild(gal);
      }

      // Daftar Artikel Web
      if (activeData.articles && activeData.articles.length > 0) {
        activeData.articles.forEach(art => {
          resultsArea.innerHTML += `
            <div class="article-card">
              <div class="article-source">${art.source || "Wikipedia Ensiklopedia"}</div>
              <a href="${art.url}" target="_blank" rel="noopener" class="article-title">${art.title}</a>
              <div class="article-snippet">${art.snippet}</div>
            </div>
          `;
        });
      }
    }

    // 2. TAB OoeR AI (Fokus Jawaban AI Mendalam)
    else if (currentTab === "ai") {
      resultsArea.innerHTML = `
        <div class="ai-card">
          <div class="ai-header-badge">✦ OoeR Deep AI Intel</div>
          <div class="ai-text">${activeData.answer || "Informasi tersimpan di OoER Vault."}</div>
        </div>
      `;
    }

    // 3. TAB GAMBAR (Galeri Penuh)
    else if (currentTab === "images") {
      if (!activeData.images || activeData.images.length === 0) {
        resultsArea.innerHTML = `<div class="status-msg">Tidak ada gambar ditemukan.</div>`;
      } else {
        const gal = document.createElement("div");
        gal.className = "gallery-grid";
        activeData.images.forEach(src => {
          gal.innerHTML += `<img src="${src}" style="aspect-ratio:1/1;" alt="Galeri">`;
        });
        resultsArea.appendChild(gal);
      }
    }

    // 4. TAB BERITA & ARTIKEL
    else if (currentTab === "news" || currentTab === "books") {
      if (!activeData.articles || activeData.articles.length === 0) {
        resultsArea.innerHTML = `<div class="status-msg">Tidak ada warta / pustaka untuk topik ini.</div>`;
      } else {
        activeData.articles.forEach(art => {
          resultsArea.innerHTML += `
            <div class="article-card">
              <div class="article-source">${currentTab === 'books' ? '📚 Pustaka Terbuka' : '📰 Warta Media'}</div>
              <a href="${art.url}" target="_blank" rel="noopener" class="article-title">${art.title}</a>
              <div class="article-snippet">${art.snippet}</div>
            </div>
          `;
        });
      }
    }

    // 5. TAB VIDEO
    else if (currentTab === "videos") {
      if (!activeData.videos || activeData.videos.length === 0) {
        resultsArea.innerHTML = `<div class="status-msg">Belum ada video terbuka untuk topik ini.</div>`;
      } else {
        activeData.videos.forEach(vid => {
          resultsArea.innerHTML += `
            <div class="video-card">
              <video src="${vid.url}" controls></video>
              <div class="video-title">🎬 ${vid.title}</div>
            </div>
          `;
        });
      }
    }
  }

  // PENCARIAN UTAMA
  async function runSearch(keyword) {
    const q = keyword.trim();
    if (!q) return;

    input.value = q;
    showStatus("Menghubungkan ke Gudang Memori & Menjelajah Web...");
    resultsArea.replaceChildren();

    // 1. CEK CACHE DARI HOME (Jika baru pindah dari Home, data langsung tampil 0 detik)
    try {
      const cached = sessionStorage.getItem("ooer_latest_vault");
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed.query && parsed.query.toLowerCase() === q.toLowerCase()) {
          activeData = parsed;
          statusBox.hidden = true;
          renderView();
          sessionStorage.removeItem("ooer_latest_vault"); // Bersihkan setelah dipakai
          return;
        }
      }
    } catch(e) {}

    // 2. JIKA BELUM ADA DI CACHE, PANGGIL RAPID-TASK
    try {
      const res = await fetch(COLLECTOR_URL, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify({
          query: q,
          lang: langSelect.value
        })
      });

      if (!res.ok) throw new Error("Gagal memanggil API");

      const data = await res.json();
      activeData = data;
      statusBox.hidden = true;
      renderView();
    } catch (err) {
      console.error(err);
      showStatus("Gagal memuat data pencarian. Periksa koneksi internet.");
    }
  }

  // GANTI TAB
  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentTab = tab.dataset.tab;
      renderView();
    });
  });

  $("searchForm").addEventListener("submit", e => {
    e.preventDefault();
    runSearch(input.value);
  });

  // Baca parameter ?q= dan ?lang= dari URL
  const params = new URLSearchParams(location.search);
  const qParam = params.get("q");
  const langParam = params.get("lang");

  if (langParam && langSelect.querySelector(`option[value="${langParam}"]`)) {
    langSelect.value = langParam;
  }

  if (qParam) {
    runSearch(qParam);
  }
})();
</script>
</body>
</html>
