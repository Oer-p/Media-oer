<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OoeR Search — Hasil Pencarian</title>
<style>
  :root {
    --bg: #ffffff; --text: #202124; --muted: #5f6368; --border: #dfe1e5;
    --card-bg: #ffffff; --blue: #1a0dab; --green: #006621; --shadow: 0 1px 6px rgba(32,33,36,0.1);
  }
  body.dark {
    --bg: #202124; --text: #e8eaed; --muted: #9aa0a6; --border: #3c4043;
    --card-bg: #303134; --blue: #8ab4f8; --green: #81c995; --shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
  
  header { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid var(--border); }
  .logo { font-size: 22px; font-weight: bold; text-decoration: none; color: var(--text); }
  .search-box { flex: 1; max-width: 600px; display: flex; align-items: center; border: 1px solid var(--border); border-radius: 24px; padding: 8px 16px; }
  .search-box input { width: 100%; border: none; outline: none; background: transparent; color: var(--text); font-size: 15px; }

  main { max-width: 800px; margin: 20px auto; padding: 0 15px; }
  .search-info { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

  /* KARTU HASIL PENCARIAN BERGAMBAR (RICH CARD) */
  .result-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px; display: flex; gap: 16px; align-items: flex-start;
    box-shadow: var(--shadow); transition: transform 0.1s ease;
  }
  .result-card:hover { transform: translateY(-2px); }
  
  .result-thumb {
    width: 120px; height: 90px; border-radius: 8px; object-fit: cover;
    background: var(--border); flex-shrink: 0;
  }
  
  .result-content { flex: 1; min-width: 0; }
  .result-meta { font-size: 12px; color: var(--green); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .result-title { font-size: 18px; color: var(--blue); text-decoration: none; font-weight: bold; display: block; margin-bottom: 6px; line-height: 1.3; }
  .result-title:hover { text-decoration: underline; }
  .result-snippet { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  @media (max-width: 500px) {
    .result-card { flex-direction: column-reverse; }
    .result-thumb { width: 100%; height: 160px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">OoeR</a>
  <div class="search-box">
    <input type="search" id="searchInput" placeholder="Cari berita atau web di OoeR...">
  </div>
</header>

<main>
  <div class="search-info" id="searchInfo">Menampilkan hasil pencarian...</div>
  <div id="resultsList"></div>
</main>

<script>
(() => {
  "use strict";

  // Membaca kata kunci pencarian dari URL (?q=...)
  const urlParams = new URLSearchParams(window.location.search);
  const query = urlParams.get("q") || "";
  document.getElementById("searchInput").value = query;

  function loadSearchResults() {
    const list = document.getElementById("resultsList");
    const info = document.getElementById("searchInfo");
    list.innerHTML = "";

    if (!query.trim()) {
      info.textContent = "Ketik kata kunci untuk mulai mencari di OoeR.";
      return;
    }

    // 1. Ambil data berita/karya dari Puisi & Cerita
    const works = JSON.parse(localStorage.getItem("oer_puisi_cerita_works") || "[]");
    
    // 2. Ambil data postingan/web yang dibuat pengguna
    const userWebs = JSON.parse(localStorage.getItem("oer_user_websites") || "[]");

    // Gabungkan semua data konten
    const allContent = [...works, ...userWebs];

    // Filter berdasarkan kata kunci pencarian
    const results = allContent.filter(item => {
      const q = query.toLowerCase();
      const titleMatch = (item.title || item.nama || "").toLowerCase().includes(q);
      const contentMatch = (item.content || item.deskripsi || "").toLowerCase().includes(q);
      const catMatch = (item.category || item.kategori || "").toLowerCase().includes(q);
      return titleMatch || contentMatch || catMatch;
    });

    info.textContent = `Menemukan ${results.length} hasil untuk "${query}"`;

    if (results.length === 0) {
      list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted);">
        Tidak ada berita atau postingan yang cocok dengan "<b>${query}</b>".
      </div>`;
      return;
    }

    // Tampilkan hasil dengan gambar otomatis
    results.forEach(item => {
      const card = document.createElement("div");
      card.className = "result-card";

      const titleText = item.title || item.nama || "Postingan Tanpa Judul";
      const snippetText = (item.content || item.deskripsi || "").replace(/<[^>]*>?/gm, '');
      const imageSrc = item.image || item.gambar || "";
      const categoryText = item.category || item.kategori || "Berita / Web";
      const authorText = item.author || item.pembuat || "Kreator OoeR";

      card.innerHTML = `
        <div class="result-content">
          <div class="result-meta">
            <span><b>${categoryText}</b></span> • 
            <span>Oleh ${authorText}</span>
          </div>
          <a href="${item.url || 'puisi_cerita.html'}" class="result-title">${titleText}</a>
          <p class="result-snippet">${snippetText}</p>
        </div>
        ${imageSrc ? `<img src="${imageSrc}" class="result-thumb" alt="Thumbnail" onerror="this.style.display='none'">` : ''}
      `;

      list.appendChild(card);
    });
  }

  document.getElementById("searchInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      const q = e.target.value.trim();
      if (q) window.location.href = `search.html?q=${encodeURIComponent(q)}`;
    }
  });

  loadSearchResults();
})();
</script>

</body>
</html>
