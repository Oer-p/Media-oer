<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#131314">
<title>OoeR Search — Cerdas, Resmi & Kilat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  color-scheme: dark;
  --bg: #131314;
  --card-bg: #1e1f20;
  --search-bg: #282a2d;
  --text: #ffffff;
  --muted: #9aa0a6;
  --border: #3c4043;
  --link-blue: #8ab4f8;
  --purple-glow: #c58af9;
  --green: #34a853;
  --red: #ea4335;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100vh; background-color: var(--bg);
  color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { cursor: pointer; border: 0; background: transparent; }

/* HEADER */
.ooer-header {
  height: 56px; padding: 0 16px; display: flex;
  align-items: center; justify-content: space-between; position: relative;
}
.back-btn, .menu-dots-btn {
  color: #cfd3dc; display: flex; align-items: center;
  justify-content: center; width: 38px; height: 38px; border-radius: 50%;
  transition: background .2s ease; font-size: 20px;
}
.back-btn:hover, .menu-dots-btn:hover { background: #282a2d; }
.ooer-brand {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: 26px; font-weight: 700; color: #fff; user-select: none;
}

/* DROPDOWN MENU (⋮) */
.menu-dropdown {
  display: none; position: absolute; top: 52px; right: 14px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 14px; width: 230px; box-shadow: 0 12px 36px rgba(0,0,0,.7);
  z-index: 1000; overflow: hidden; animation: fadeIn .2s ease;
}
.menu-dropdown.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.menu-item {
  padding: 12px 14px; display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: #e8eaed; border-bottom: 1px solid #282a2d;
  cursor: pointer; width: 100%; text-align: left;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover { background: #282a2d; }
.menu-item select {
  background: transparent; color: #8ab4f8; border: none; font-size: 13px;
  font-weight: 600; outline: none; width: 100%; cursor: pointer;
}
.menu-item select option { background: #202124; color: #fff; }

/* SEARCH BAR + MIC */
.search-wrapper { padding: 4px 14px 10px; }
.search-pill {
  background-color: var(--search-bg); border-radius: 28px;
  display: flex; align-items: center; padding: 0 8px 0 16px; height: 48px;
  border: 1px solid transparent; transition: border-color .2s;
}
.search-pill:focus-within { border-color: var(--link-blue); }
#query {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 15px; min-width: 0;
}
.mic-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid;
  place-items: center; color: #8ab4f8; font-size: 18px; transition: all .2s;
}
.mic-btn.listening {
  background: rgba(234,67,53,.25); color: #ea4335; animation: pulseMic 1s infinite;
}
@keyframes pulseMic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

/* TAB NAVIGASI RENGGANG & PAS (FULL WIDTH) */
.nav-tabs {
  display: flex; width: 100%; padding: 0 8px;
  border-bottom: 1px solid var(--border);
}
.tab-item {
  flex: 1; text-align: center; color: var(--muted);
  font-size: 15px; font-weight: 600; padding: 12px 2px;
  white-space: nowrap; position: relative; transition: color .2s ease;
}
.tab-item.active {
  color: #8ab4f8; font-weight: 700;
}
/* EFEK MENIKUNG & MENJALAR GRADASI WARNA */
.tab-item.active::after {
  content: ""; position: absolute; bottom: -1px; left: 12%; right: 12%;
  height: 3px; background: linear-gradient(90deg, #8ab4f8 0%, #c58af9 100%);
  border-radius: 3px 3px 0 0;
}

.main-container { max-width: 650px; margin: 0 auto; padding: 14px; }
.status-msg { padding: 16px 0; color: var(--muted); font-size: 13px; text-align: center; }

/* KARTU OR AI */
.ai-card {
  background-color: var(--card-bg); border-radius: 18px;
  padding: 20px; margin-bottom: 16px; border: 1px solid #2d3033;
}
.ai-header-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: #8ab4f8; margin-bottom: 12px;
}
.ai-text { font-size: 15px; line-height: 1.7; color: #e3e3e3; white-space: pre-line; word-break: break-word; }
.ai-cursor {
  display: inline-block; width: 7px; height: 16px; background-color: #8ab4f8;
  margin-left: 4px; vertical-align: middle; border-radius: 2px; animation: blinkCursor 0.75s infinite;
}
@keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* GAMBAR LEGAL */
.gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.image-item-wrap {
  position: relative; border-radius: 12px; overflow: hidden; background: #282a2c; cursor: pointer; aspect-ratio: 4/3;
}
.image-item-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .2s ease; }
.image-item-wrap:hover img { transform: scale(1.04); }
.image-license-tag {
  position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,.8);
  backdrop-filter: blur(4px); padding: 3px 7px; border-radius: 6px;
  font-size: 10px; font-weight: 600; color: #81c995;
}

/* SARAN KATA */
.suggested-box {
  background: #18191a; border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 14px; margin: 16px 0;
}
.suggested-title { font-size: 12px; font-weight: 600; color: #8ab4f8; margin-bottom: 8px; }
.suggested-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.suggested-chips::-webkit-scrollbar { display: none; }
.s-chip {
  background: #282a2d; color: #e8eaed; padding: 6px 12px; border-radius: 16px;
  font-size: 12px; white-space: nowrap; border: 1px solid #3c4043; cursor: pointer;
}
.s-chip:hover { border-color: var(--link-blue); color: var(--link-blue); }

/* ARTIKEL WEB */
.article-card { padding: 14px 0; border-bottom: 1px solid #282a2d; cursor: pointer; }
.article-source { font-size: 11px; color: #9aa0a6; margin-bottom: 3px; }
.article-title { color: var(--link-blue); font-size: 17px; line-height: 1.35; margin-bottom: 4px; font-weight: 500; }
.article-snippet { font-size: 13px; line-height: 1.5; color: #bdc1c6; }

/* BERITA */
.news-card {
  display: flex; gap: 14px; align-items: flex-start; padding: 14px 0;
  border-bottom: 1px solid #282a2d; cursor: pointer;
}
.news-left { flex: 1; min-width: 0; }
.news-title { color: var(--link-blue); font-size: 15px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
.news-snippet { font-size: 12px; color: #bdc1c6; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news-thumb {
  width: 90px; height: 72px; border-radius: 10px; object-fit: cover;
  background: #282a2c; flex-shrink: 0;
}

/* SKELETON & LOADER */
.skeleton {
  background: linear-gradient(90deg, #1e1f20 25%, #2a2c2e 50%, #1e1f20 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skeleton-line { height: 14px; margin-bottom: 10px; border-radius: 6px; }
.scroll-loader {
  padding: 18px 0; text-align: center; color: #8ab4f8; font-size: 12px; font-weight: 600;
}

/* PANEL HALAMAN RIWAYAT MODERN (BUKAN ALERT BROWSER) */
#historyModal {
  display: none; position: fixed; inset: 0; z-index: 10001;
  background: rgba(0,0,0,.85); backdrop-filter: blur(8px);
  align-items: flex-end; justify-content: center;
}
#historyModal.active { display: flex; }
.history-sheet {
  background: #18191a; border: 1px solid var(--border);
  border-radius: 24px 24px 0 0; width: 100%; max-width: 600px;
  max-height: 82vh; display: flex; flex-direction: column; overflow: hidden;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.history-header {
  padding: 16px 20px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 1px solid #282a2d;
}
.history-title { font-size: 16px; font-weight: 700; color: #fff; }
.close-sheet-btn { font-size: 20px; color: #9aa0a6; }

/* FILTER HAPUS RIWAYAT */
.history-filters {
  padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto;
  border-bottom: 1px solid #242526; scrollbar-width: none;
}
.history-filters::-webkit-scrollbar { display: none; }
.h-filter-btn {
  background: #242526; color: #bdc1c6; padding: 6px 12px;
  border-radius: 14px; font-size: 12px; white-space: nowrap; font-weight: 500;
}
.h-filter-btn.danger { background: rgba(234,67,53,.15); color: #ea4335; font-weight: 600; }

.history-list {
  padding: 10px 16px; overflow-y: auto; flex: 1;
}
.history-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; background: #202124; border-radius: 12px; margin-bottom: 8px;
}
.h-query { font-size: 14px; color: #8ab4f8; font-weight: 500; cursor: pointer; }
.h-date { font-size: 11px; color: #9aa0a6; margin-top: 2px; }
.h-del-single { color: #ea4335; font-size: 16px; padding: 6px; }

/* MODAL LISENSI */
#imageModal {
  display: none; position: fixed; inset: 0; z-index: 10000;
  background: rgba(0,0,0,.92); backdrop-filter: blur(10px);
  align-items: center; justify-content: center; padding: 16px;
}
#imageModal.active { display: flex; }
.image-dialog {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 20px; width: min(100%, 540px); overflow: hidden;
}
.image-dialog-preview { width: 100%; max-height: 50vh; object-fit: contain; background: #000; display: block; }
.image-dialog-body { padding: 18px; }
.image-dialog-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.badge-license {
  display: inline-block; padding: 5px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600; margin-bottom: 12px;
}
.badge-free { background: rgba(52,168,83,.2); color: #81c995; border: 1px solid #34a853; }
.image-meta-item { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.image-meta-item b { color: #e8eaed; }
.image-close-btn {
  width: 100%; padding: 12px; border-radius: 10px; background: var(--search-bg);
  color: #fff; font-size: 14px; font-weight: 600; margin-top: 10px;
}
</style>
</head>
<body>

<header class="ooer-header">
  <a class="back-btn" href="./" title="Kembali ke Beranda">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>
  <a class="ooer-brand" href="./">OoeR</a>
  <button class="menu-dots-btn" id="menuDotsBtn" title="Menu OoeR">⋮</button>

  <!-- MENU TITIK TIGA -->
  <div class="menu-dropdown" id="menuDropdown">
    <div class="menu-item" id="itemPrivacy">
      <span>🛡️</span>
      <div>
        <div style="font-weight:600;">Info Iklan & Pelacak</div>
        <div style="font-size:11px; color:#81c995;">0 Iklan • 100% Bersih</div>
      </div>
    </div>
    <div class="menu-item">
      <span>🌐</span>
      <select id="langSelect">
        <option value="Indonesia">🇮🇩 Indonesia</option>
        <option value="Melayu (Malaysia)">🇲🇾 Malaysia</option>
        <option value="English (US)">🇺🇸 English</option>
        <option value="Tagalog (Filipina)">🇵🇭 Filipina</option>
        <option value="Thailand">🇹🇭 Thailand</option>
        <option value="Vietnam">🇻🇳 Vietnam</option>
        <option value="Jepang">🇯🇵 Jepang</option>
        <option value="Korea">🇰🇷 Korea</option>
        <option value="Mandarin">🇨🇳 Mandarin</option>
        <option value="Arab">🇸🇦 Arab</option>
      </select>
    </div>
    <div class="menu-item" id="itemHistory">
      <span>🕒</span>
      <div>
        <div style="font-weight:600;">Riwayat Pencarian</div>
        <div style="font-size:11px; color:#9aa0a6;">Buka Halaman Riwayat</div>
      </div>
    </div>
  </div>
</header>

<div class="search-wrapper">
  <form id="searchForm" class="search-pill">
    <input id="query" name="q" type="search" placeholder="Teks pencarian..." autocomplete="off">
    <button type="button" class="mic-btn" id="micBtn" title="Bicara untuk mencari">🎙️</button>
  </form>
</div>

<!-- TAB NAVIGASI RENGGANG & PAS FULL WIDTH -->
<nav class="nav-tabs">
  <button class="tab-item" data-tab="ai" id="tabAi">Or Ai</button>
  <button class="tab-item active" data-tab="all" id="tabAll">Semua</button>
  <button class="tab-item" data-tab="images" id="tabImages">Gambar Legal</button>
  <button class="tab-item" data-tab="news" id="tabNews">Berita</button>
</nav>

<main class="main-container">
  <div id="statusBox" class="status-msg">Ketik kata kunci atau tekan mic untuk mencari...</div>
  <div id="resultsArea"></div>

  <div id="scrollSentinel"></div>
  <div id="scrollLoading" class="scroll-loader" style="display:none;">
    ⚡ Memuat lebih banyak secara otomatis...
  </div>
</main>

<!-- HALAMAN PANEL RIWAYAT PENCARIAN CERDAS -->
<div id="historyModal">
  <div class="history-sheet">
    <div class="history-header">
      <div class="history-title">🕒 Riwayat Pencarian OoeR</div>
      <button class="close-sheet-btn" id="closeHistoryBtn">✕</button>
    </div>
    <div class="history-filters">
      <button class="h-filter-btn danger" id="delTodayBtn">Hapus Hari Ini</button>
      <button class="h-filter-btn danger" id="delWeekBtn">Hapus Minggu Ini</button>
      <button class="h-filter-btn danger" id="delMonthBtn">Hapus Bulan Ini</button>
      <button class="h-filter-btn danger" id="delAllBtn">Hapus Semua</button>
    </div>
    <div class="history-list" id="historyContainer">
      <!-- Data riwayat akan dimuat di sini -->
    </div>
  </div>
</div>

<!-- MODAL LISENSI GAMBAR -->
<div id="imageModal">
  <div class="image-dialog">
    <img id="imgModalPreview" class="image-dialog-preview" src="" alt="Preview">
    <div class="image-dialog-body">
      <div id="imgModalBadge" class="badge-license badge-free">✅ Diperbolehkan Untuk Konten</div>
      <div class="image-dialog-title" id="imgModalTitle">Judul Gambar</div>
      <div class="image-meta-item"><b>Lisensi:</b> <span id="imgModalLicense">-</span></div>
      <div class="image-meta-item"><b>Pencipta:</b> <span id="imgModalAuthor">-</span></div>
      <div class="image-meta-item"><b>Sumber Legal:</b> <span id="imgModalSource">-</span></div>
      <button class="image-close-btn" id="closeImgModal">Tutup Pratinjau</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const input = $("query");
  const micBtn = $("micBtn");
  const statusBox = $("statusBox");
  const resultsArea = $("resultsArea");
  const langSelect = $("langSelect");
  const tabs = document.querySelectorAll(".tab-item");
  const menuDotsBtn = $("menuDotsBtn");
  const menuDropdown = $("menuDropdown");
  const scrollSentinel = $("scrollSentinel");
  const scrollLoading = $("scrollLoading");

  const historyModal = $("historyModal");
  const closeHistoryBtn = $("closeHistoryBtn");
  const historyContainer = $("historyContainer");

  const imageModal = $("imageModal");
  const imgModalPreview = $("imgModalPreview");
  const imgModalTitle = $("imgModalTitle");
  const imgModalBadge = $("imgModalBadge");
  const imgModalLicense = $("imgModalLicense");
  const imgModalAuthor = $("imgModalAuthor");
  const imgModalSource = $("imgModalSource");

  let currentTab = "all";
  let activeData = null;
  let typewriterTimer = null;
  let currentOffset = 0;
  let isFetchingMore = false;
  let hasMoreData = true;

  const SUPABASE_URL = "https://jhopfzmyxuafdbwwkjbf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FE4-8ZuWD3FgKCcjxjaErg_w97N3fwk";
  const COLLECTOR_URL = "https://jhopfzmyxuafdbwwkjbf.supabase.co/functions/v1/rapid-task";

  const supabase = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  const WIKI_LANG_MAP = {
    "Indonesia": "id", "Melayu (Malaysia)": "ms", "Tagalog (Filipina)": "tl",
    "Thailand": "th", "Vietnam": "vi", "Jepang": "ja", "Korea": "ko",
    "Mandarin": "zh", "Arab": "ar", "English (US)": "en"
  };

  /* 🌐 SETEL & SIMPAN PILIHAN BAHASA */
  const savedLang = localStorage.getItem("ooer_user_lang") || "Indonesia";
  langSelect.value = savedLang;

  langSelect.addEventListener("change", () => {
    const chosenLang = langSelect.value;
    localStorage.setItem("ooer_user_lang", chosenLang);
    menuDropdown.classList.remove("active");

    // Jika sedang mencari kata kunci, langsung cari ulang dengan bahasa baru!
    if (input.value.trim()) {
      runSearch(input.value.trim());
    }
  });

  menuDotsBtn.addEventListener("click", e => {
    e.stopPropagation();
    menuDropdown.classList.toggle("active");
  });
  document.addEventListener("click", () => menuDropdown.classList.remove("active"));

  $("itemPrivacy").addEventListener("click", () => {
    alert("🛡️ Info Privasi OoeR:\n- 0 Cookie Pelacak Iklan\n- 0 Penjualan Data ke Pihak Ketiga\n- 100% Bersih & Terbuka");
  });

  /* 🕒 SISTEM RIWAYAT PENCARIAN BERDASARKAN TANGGAL */
  function getHistory() {
    return JSON.parse(localStorage.getItem("ooer_history_v2") || "[]");
  }

  function saveHistoryItem(q) {
    let hist = getHistory();
    hist = hist.filter(h => h.query.toLowerCase() !== q.toLowerCase());
    hist.unshift({ query: q, time: Date.now() });
    localStorage.setItem("ooer_history_v2", JSON.stringify(hist.slice(0, 40)));
  }

  function formatTime(timestamp) {
    const d = new Date(timestamp);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (isToday) return `Hari ini, ${timeStr}`;
    return `${d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}, ${timeStr}`;
  }

  function renderHistoryList() {
    const hist = getHistory();
    historyContainer.replaceChildren();

    if (hist.length === 0) {
      historyContainer.innerHTML = `<div style="text-align:center; padding:30px 0; color:var(--muted); font-size:13px;">Tidak ada riwayat pencarian.</div>`;
      return;
    }

    hist.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "history-item";
      row.innerHTML = `
        <div>
          <div class="h-query">${item.query}</div>
          <div class="h-date">${formatTime(item.time)}</div>
        </div>
        <button class="h-del-single" title="Hapus item ini">✕</button>
      `;

      row.querySelector(".h-query").addEventListener("click", () => {
        historyModal.classList.remove("active");
        input.value = item.query;
        runSearch(item.query);
      });

      row.querySelector(".h-del-single").addEventListener("click", () => {
        const updated = getHistory().filter((_, i) => i !== index);
        localStorage.setItem("ooer_history_v2", JSON.stringify(updated));
        renderHistoryList();
      });

      historyContainer.appendChild(row);
    });
  }

  $("itemHistory").addEventListener("click", () => {
    menuDropdown.classList.remove("active");
    renderHistoryList();
    historyModal.classList.add("active");
  });

  closeHistoryBtn.addEventListener("click", () => historyModal.classList.remove("active"));
  historyModal.addEventListener("click", e => { if (e.target === historyModal) historyModal.classList.remove("active"); });

  /* TOMBOL FILTER HAPUS RIWAYAT (HARI INI, MINGGU INI, BULAN INI, SEMUA) */
  $("delTodayBtn").addEventListener("click", () => {
    const now = new Date();
    const updated = getHistory().filter(item => {
      const d = new Date(item.time);
      return d.toDateString() !== now.toDateString();
    });
    localStorage.setItem("ooer_history_v2", JSON.stringify(updated));
    renderHistoryList();
  });

  $("delWeekBtn").addEventListener("click", () => {
    const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
    const updated = getHistory().filter(item => item.time < sevenDaysAgo);
    localStorage.setItem("ooer_history_v2", JSON.stringify(updated));
    renderHistoryList();
  });

  $("delMonthBtn").addEventListener("click", () => {
    const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
    const updated = getHistory().filter(item => item.time < thirtyDaysAgo);
    localStorage.setItem("ooer_history_v2", JSON.stringify(updated));
    renderHistoryList();
  });

  $("delAllBtn").addEventListener("click", () => {
    if (confirm("Yakin ingin menghapus seluruh riwayat pencarian?")) {
      localStorage.removeItem("ooer_history_v2");
      sessionStorage.clear();
      renderHistoryList();
    }
  });

  /* 🎙️ FITUR MIC PENCARIAN SUARA */
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;

    micBtn.addEventListener("click", () => {
      recognition.lang = langSelect.value === "Indonesia" ? "id-ID" : "en-US";
      try {
        recognition.start();
        micBtn.classList.add("listening");
      } catch (e) {
        recognition.stop();
        micBtn.classList.remove("listening");
      }
    });

    recognition.onresult = event => {
      const spokenText = event.results[0][0].transcript;
      input.value = spokenText;
      micBtn.classList.remove("listening");
      runSearch(spokenText);
    };

    recognition.onerror = () => micBtn.classList.remove("listening");
    recognition.onend = () => micBtn.classList.remove("listening");
  } else {
    micBtn.addEventListener("click", () => {
      alert("Browser ini belum mendukung pencarian suara langsung.");
    });
  }

  function openImageInspector(imgObj) {
    imgModalPreview.src = typeof imgObj === "string" ? imgObj : imgObj.url;
    imgModalTitle.textContent = imgObj.title || "Foto Terverifikasi OoeR";
    imgModalLicense.textContent = imgObj.license || "Creative Commons / Domain Publik";
    imgModalAuthor.textContent = imgObj.author || "Arsip Terbuka Wikimedia";
    imgModalSource.textContent = imgObj.source || "Wikimedia Commons";
    imageModal.classList.add("active");
  }

  $("closeImgModal").addEventListener("click", () => imageModal.classList.remove("active"));
  imageModal.addEventListener("click", e => { if (e.target === imageModal) imageModal.classList.remove("active"); });

  function streamTypewriterText(targetEl, fullText, speed = 16, onComplete) {
    if (!targetEl) return;
    if (typewriterTimer) clearInterval(typewriterTimer);

    targetEl.textContent = "";
    const cursor = document.createElement("span");
    cursor.className = "ai-cursor";
    targetEl.appendChild(cursor);

    const tokens = fullText.split(/(\s+)/);
    let index = 0;

    typewriterTimer = setInterval(() => {
      if (index < tokens.length) {
        const textNode = document.createTextNode(tokens[index]);
        targetEl.insertBefore(textNode, cursor);
        index++;
      } else {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
        cursor.remove();
        if (onComplete) onComplete();
      }
    }, speed);
  }

  /* ⚡ AMBIL DATA DENGAN TINGKAT RELEVANSI LEBIH AKURAT */
  async function fetchOpenData(keyword, lang, offset = 0) {
    const langCode = WIKI_LANG_MAP[lang] || "id";
    const apiUrl = `https://${langCode}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(keyword)}&gsrsort=relevance&gsrlimit=8&gsroffset=${offset}&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=600&exintro=1&explaintext=1&exsentences=2&format=json&origin=*`;

    try {
      const res = await fetch(apiUrl);
      const data = await res.json();
      if (!data || !data.query || !data.query.pages) return { articles: [], images: [], hasMore: false };

      const articles = [];
      const images = [];

      Object.values(data.query.pages).forEach(page => {
        if (page.extract) {
          articles.push({
            title: page.title,
            snippet: page.extract,
            url: `https://${langCode}.wikipedia.org/?curid=${page.pageid}`,
            source: "Ensiklopedia Bebas Iklan",
            thumbnail: page.thumbnail ? page.thumbnail.source : null
          });
        }
        if (page.thumbnail && page.thumbnail.source) {
          images.push({
            url: page.thumbnail.source,
            title: page.title,
            license: "Creative Commons Attribution",
            author: "Wikimedia Contributor",
            source: "Wikimedia Commons"
          });
        }
      });

      return { articles, images, hasMore: !!data.continue };
    } catch (e) {
      return { articles: [], images: [], hasMore: false };
    }
  }

  function renderView() {
    if (!activeData) return;
    if (typewriterTimer) { clearInterval(typewriterTimer); typewriterTimer = null; }

    resultsArea.replaceChildren();

    // 1. TAB: Or Ai (KHUSUS MENJAWAB DI SINI)
    if (currentTab === "ai") {
      const aiCard = document.createElement("div");
      aiCard.className = "ai-card";
      aiCard.innerHTML = `
        <div class="ai-header-badge">✨ Ruang Jawaban Khusus Or Ai</div>
        <div class="ai-text" id="deepAiText">${activeData.aiLoading ? "Or Ai sedang merangkum jawaban mendalam..." : ""}</div>
      `;
      resultsArea.appendChild(aiCard);

      const target = aiCard.querySelector("#deepAiText");
      if (target && !activeData.aiLoading && activeData.answer) {
        if (!activeData.hasStreamed) {
          streamTypewriterText(target, activeData.answer, 16, () => { activeData.hasStreamed = true; });
        } else {
          target.textContent = activeData.answer;
        }
      }
    }

    // 2. TAB: SEMUA (BERSIH TOTAL DARI KOTAK AI)
    else if (currentTab === "all") {
      if (activeData.images && activeData.images.length > 0) {
        const gal = document.createElement("div");
        gal.className = "gallery-grid";
        activeData.images.slice(0, 4).forEach(img => {
          const item = document.createElement("div");
          item.className = "image-item-wrap";
          item.innerHTML = `
            <img src="${img.url}" alt="Foto" loading="lazy">
            <span class="image-license-tag">✅ Lisensi Legal</span>
          `;
          item.addEventListener("click", () => openImageInspector(img));
          gal.appendChild(item);
        });
        resultsArea.appendChild(gal);
      }

      const firstBatch = (activeData.articles || []).slice(0, 3);
      firstBatch.forEach(art => {
        const card = document.createElement("div");
        card.className = "article-card";
        card.innerHTML = `
          <div class="article-source">🌐 ${art.source}</div>
          <div class="article-title">${art.title} ↗</div>
          <div class="article-snippet">${art.snippet}</div>
        `;
        card.addEventListener("click", () => window.open(art.url, "_blank", "noopener,noreferrer"));
        resultsArea.appendChild(card);
      });

      if (activeData.articles && activeData.articles.length > 0) {
        const suggestBox = document.createElement("div");
        suggestBox.className = "suggested-box";
        suggestBox.innerHTML = `
          <div class="suggested-title">💡 Saran Kata Terkait:</div>
          <div class="suggested-chips">
            <button class="s-chip" data-q="${input.value.trim()} sejarah">${input.value.trim()} sejarah</button>
            <button class="s-chip" data-q="${input.value.trim()} habitat">${input.value.trim()} habitat</button>
            <button class="s-chip" data-q="${input.value.trim()} fakta menarik">${input.value.trim()} fakta menarik</button>
          </div>
        `;
        suggestBox.querySelectorAll(".s-chip").forEach(btn => {
          btn.addEventListener("click", () => runSearch(btn.dataset.q));
        });
        resultsArea.appendChild(suggestBox);
      }

      const secondBatch = (activeData.articles || []).slice(3);
      secondBatch.forEach(art => {
        const card = document.createElement("div");
        card.className = "article-card";
        card.innerHTML = `
          <div class="article-source">🌐 ${art.source}</div>
          <div class="article-title">${art.title} ↗</div>
          <div class="article-snippet">${art.snippet}</div>
        `;
        card.addEventListener("click", () => window.open(art.url, "_blank", "noopener,noreferrer"));
        resultsArea.appendChild(card);
      });
    }

    // 3. TAB: GAMBAR LEGAL (INFINITE GRID)
    else if (currentTab === "images") {
      const gal = document.createElement("div");
      gal.className = "gallery-grid";
      gal.id = "infiniteImagesGrid";
      (activeData.images || []).forEach(img => {
        const item = document.createElement("div");
        item.className = "image-item-wrap";
        item.style.aspectRatio = "1/1";
        item.innerHTML = `
          <img src="${img.url}" alt="Foto" loading="lazy">
          <span class="image-license-tag">✅ Legal</span>
        `;
        item.addEventListener("click", () => openImageInspector(img));
        gal.appendChild(item);
      });
      resultsArea.appendChild(gal);
    }

    // 4. TAB: BERITA (TEKS DI KIRI, GAMBAR DI KANAN)
    else if (currentTab === "news") {
      (activeData.articles || []).forEach(art => {
        const card = document.createElement("div");
        card.className = "news-card";
        card.innerHTML = `
          <div class="news-left">
            <div class="news-title">${art.title} ↗</div>
            <div class="news-snippet">${art.snippet}</div>
          </div>
          ${art.thumbnail ? `<img class="news-thumb" src="${art.thumbnail}" alt="Thumbnail" loading="lazy">` : `<div class="news-thumb" style="display:grid;place-items:center;color:#666;">📰</div>`}
        `;
        card.addEventListener("click", () => window.open(art.url, "_blank", "noopener,noreferrer"));
        resultsArea.appendChild(card);
      });
    }
  }

  async function loadMoreContent() {
    if (isFetchingMore || !hasMoreData || !activeData || currentTab === "ai") return;

    isFetchingMore = true;
    scrollLoading.style.display = "block";
    currentOffset += 8;

    const more = await fetchOpenData(input.value.trim(), langSelect.value, currentOffset);

    if (more.articles.length > 0 || more.images.length > 0) {
      activeData.articles = [...(activeData.articles || []), ...more.articles];
      activeData.images = [...(activeData.images || []), ...more.images];
      hasMoreData = more.hasMore;

      if (currentTab === "images") {
        const grid = $("infiniteImagesGrid");
        if (grid) {
          more.images.forEach(img => {
            const item = document.createElement("div");
            item.className = "image-item-wrap";
            item.style.aspectRatio = "1/1";
            item.innerHTML = `
              <img src="${img.url}" alt="Foto" loading="lazy">
              <span class="image-license-tag">✅ Legal</span>
            `;
            item.addEventListener("click", () => openImageInspector(img));
            grid.appendChild(item);
          });
        }
      } else if (currentTab === "news") {
        more.articles.forEach(art => {
          const card = document.createElement("div");
          card.className = "news-card";
          card.innerHTML = `
            <div class="news-left">
              <div class="news-title">${art.title} ↗</div>
              <div class="news-snippet">${art.snippet}</div>
            </div>
            ${art.thumbnail ? `<img class="news-thumb" src="${art.thumbnail}" alt="Thumbnail" loading="lazy">` : `<div class="news-thumb" style="display:grid;place-items:center;color:#666;">📰</div>`}
          `;
          card.addEventListener("click", () => window.open(art.url, "_blank", "noopener,noreferrer"));
          resultsArea.appendChild(card);
        });
      } else if (currentTab === "all") {
        more.articles.forEach(art => {
          const card = document.createElement("div");
          card.className = "article-card";
          card.innerHTML = `
            <div class="article-source">🌐 ${art.source}</div>
            <div class="article-title">${art.title} ↗</div>
            <div class="article-snippet">${art.snippet}</div>
          `;
          card.addEventListener("click", () => window.open(art.url, "_blank", "noopener,noreferrer"));
          resultsArea.appendChild(card);
        });
      }
    } else {
      hasMoreData = false;
    }

    scrollLoading.style.display = "none";
    isFetchingMore = false;
  }

  const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) {
      loadMoreContent();
    }
  }, { rootMargin: "250px" });

  observer.observe(scrollSentinel);

  async function runSearch(keyword) {
    const q = keyword.trim();
    if (!q) return;

    input.value = q;
    saveHistoryItem(q);
    statusBox.hidden = true;
    currentOffset = 0;
    hasMoreData = true;

    const cacheKey = `ooer_v6_${q.toLowerCase()}_${langSelect.value}`;
    const localHit = sessionStorage.getItem(cacheKey);
    if (localHit) {
      try {
        activeData = JSON.parse(localHit);
        activeData.hasStreamed = true;
        renderView();
        return;
      } catch (e) {}
    }

    activeData = {
      query: q,
      answer: "",
      aiLoading: true,
      hasStreamed: false,
      images: [],
      articles: []
    };

    renderView();

    fetchOpenData(q, langSelect.value, 0).then(fast => {
      if (fast.articles.length > 0 || fast.images.length > 0) {
        activeData.articles = fast.articles;
        activeData.images = fast.images;
        renderView();
      }
    });

    if (supabase) {
      try {
        const { data: vData } = await supabase
          .from("ooer_ai_vault")
          .select("*")
          .ilike("query", q)
          .maybeSingle();

        if (vData && vData.answer) {
          activeData.answer = vData.answer;
          activeData.aiLoading = false;
          if (currentTab === "ai") renderView();
          sessionStorage.setItem(cacheKey, JSON.stringify(activeData));
          return;
        }
      } catch (e) {}
    }

    try {
      const res = await fetch(COLLECTOR_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({ query: q, lang: langSelect.value })
      });
      const data = await res.json();
      activeData.answer = data.answer || "Informasi ditemukan melalui indeks terbuka OoeR.";
      activeData.aiLoading = false;
      if (currentTab === "ai") renderView();
      sessionStorage.setItem(cacheKey, JSON.stringify(activeData));
    } catch (err) {
      activeData.aiLoading = false;
      if (!activeData.answer) activeData.answer = "Informasi dirangkum melalui arsip terbuka OoeR.";
      if (currentTab === "ai") renderView();
    }
  }

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentTab = tab.dataset.tab;
      renderView();
    });
  });

  $("searchForm").addEventListener("submit", e => {
    e.preventDefault();
    runSearch(input.value);
  });

  const urlParams = new URLSearchParams(location.search);
  const qParam = urlParams.get("q");
  if (qParam) runSearch(decodeURIComponent(qParam));
})();
</script>
