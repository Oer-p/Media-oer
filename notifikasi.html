<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050707">
<title>Sistem Notifikasi — OER</title>

<style>
:root {
  --bg: #050707;
  --panel: #0d1115;
  --panel2: #11171c;
  --line: #202a30;
  --text: #f4f8fa;
  --muted: #87949d;
  --cyan: #00e5ff;
  --danger: #ff5263;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, sans-serif;
}

button { font: inherit; cursor: pointer; }

/* TOPBAR */
.topbar {
  height: 62px;
  padding: 0 20px;
  background: #080b0d;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand { font-size: 23px; font-weight: 900; letter-spacing: 2px; color: var(--cyan); }
.top-actions { display: flex; gap: 10px; align-items: center; }
.btn {
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 14px;
  font-weight: 700;
  font-size: 13px;
}
.btn:hover { border-color: var(--cyan); }

/* DROPDOWN NOTIFIKASI */
.dropdown-menu {
  position: absolute;
  top: 52px;
  right: 0;
  width: 340px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 200;
}
.dropdown-menu.hidden { display: none !important; }

/* TAB KATEGORI NOTIFIKASI */
.notif-tabs {
  display: flex;
  background: #080c0f;
  border-bottom: 1px solid var(--line);
  padding: 4px;
  gap: 2px;
}
.notif-tab {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 8px 4px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 8px;
  text-align: center;
  white-space: nowrap;
  transition: all 0.2s;
}
.notif-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.notif-tab.active {
  background: var(--panel2);
  color: var(--cyan);
  border: 1px solid var(--line);
}

/* ITEM NOTIFIKASI */
.notif-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  display: flex;
  gap: 12px;
  align-items: center;
  transition: background 0.2s;
}
.notif-item:hover { background: rgba(0, 229, 255, 0.04); }
.notif-item.unread { background: rgba(0, 229, 255, 0.08); }

.notif-icon-badge {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--panel2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 15px;
  flex-shrink: 0;
}

main { max-width: 700px; margin: 40px auto; padding: 0 20px; text-align: center; }
h1 { font-size: 22px; margin-bottom: 10px; }
p { color: var(--muted); font-size: 14px; line-height: 1.6; }
</style>
</head>

<body>

<!-- HEADER / TOPBAR OER -->
<header class="topbar">
  <div class="brand">OER</div>
  <div class="top-actions">
   <!-- TOMBOL MENU NOTIFIKASI MENUJU HALAMAN TERPISAH -->
<div style="position: relative; display: inline-block;">
  <button id="notifBellBtn" type="button" class="btn" data-feature="notifications" style="position: relative; padding: 9px 12px;">
    🔔 <span id="notifBadge" style="display: none; position: absolute; top: -5px; right: -5px; background: var(--danger, #ff5263); color: #fff; font-size: 10px; font-weight: 800; border-radius: 10px; padding: 2px 6px;">0</span>
  </button>
</div> 
   
  </div>
</header>

<main>
  <h1>Halaman Utama OER</h1>
  <p>Sistem notifikasi bertab (Chat, Teman, dan Interaksi Postingan) telah terpasang aktif di tombol lonceng atas. Silakan klik ikon lonceng untuk melihat daftar notifikasi secara realtime.</p>
</main>

<!-- SUPABASE JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const OER_CONFIG = {
  SUPABASE_URL: "https://jhopfzmyxuafdbwwkjbf.supabase.co",
  SUPABASE_KEY: "sb_publishable_FE4-8ZuWD3FgKCcjxjaErg_w97N3fwk"
};

const db = window.supabase
  ? window.supabase.createClient(OER_CONFIG.SUPABASE_URL, OER_CONFIG.SUPABASE_KEY)
  : null;

let currentUser = null;
let allNotificationsData = [];
let activeNotifCategory = 'all';

async function initNotificationSystem() {
  if (!db) return;

  const { data } = await db.auth.getSession();
  currentUser = data.session?.user || null;

  if (currentUser) {
    loadNotifications(currentUser.id);
  }
}

// 1. Ambil Data Notifikasi dari Supabase
async function loadNotifications(userId) {
  const { data, error } = await db
    .from('notifications')
    .select('*, profiles:actor_id(full_name, username, avatar_url)')
    .eq('user_id', userId)
    .order('created_at', { ascending: false })
    .limit(30);

  if (error) return;

  allNotificationsData = data || [];
  renderFilteredNotifications();
  subscribeToRealtimeNotifications(userId);
}

// 2. Render & Filter Berdasarkan Tab Aktif
function renderFilteredNotifications() {
  const listEl = document.getElementById('notifList');
  const badgeEl = document.getElementById('notifBadge');
  if (!listEl) return;

  const unreadCount = allNotificationsData.filter(n => !n.is_read).length;
  if (badgeEl) {
    badgeEl.textContent = unreadCount > 99 ? '99+' : unreadCount;
    badgeEl.style.display = unreadCount > 0 ? 'inline-block' : 'none';
  }

  let filtered = allNotificationsData;
  if (activeNotifCategory === 'chat') {
    filtered = allNotificationsData.filter(n => n.type === 'chat');
  } else if (activeNotifCategory === 'friend_request') {
    filtered = allNotificationsData.filter(n => n.type === 'friend_request' || n.type === 'friend_accept');
  } else if (activeNotifCategory === 'interaction') {
    filtered = allNotificationsData.filter(n => n.type === 'post_like' || n.type === 'comment');
  }

  listEl.replaceChildren();

  if (filtered.length === 0) {
    listEl.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--muted); font-size: 12px;">Belum ada notifikasi di kategori ini.</div>`;
    return;
  }

  const typeIcons = {
    chat: '💬',
    friend_request: '👤',
    friend_accept: '🤝',
    post_like: '❤️',
    comment: '💬',
    system: '📢'
  };

  filtered.forEach(notif => {
    const actor = notif.profiles || {};
    const actorName = actor.full_name || (actor.username ? '@' + actor.username : 'Seseorang');
    const icon = typeIcons[notif.type] || '🔔';

    const item = document.createElement('div');
    item.className = `notif-item ${notif.is_read ? '' : 'unread'}`;
    item.innerHTML = `
      <div class="notif-icon-badge">${icon}</div>
      <div style="min-width: 0; flex: 1;">
        <div style="font-weight: 700; font-size: 12px; color: var(--text); overflow-wrap: anywhere;">${notif.title}</div>
        <div style="color: var(--muted); font-size: 11px; margin-top: 2px; overflow-wrap: anywhere;">
          <strong>${actorName}</strong> ${notif.message}
        </div>
      </div>
    `;

    item.onclick = async () => {
      if (!notif.is_read) {
        await db.from('notifications').update({ is_read: true }).eq('id', notif.id);
        notif.is_read = true;
      }
      if (notif.link_url) window.location.href = notif.link_url;
    };

    listEl.appendChild(item);
  });
}

// 3. Pindah Tab Kategori
function switchNotifTab(category) {
  activeNotifCategory = category;
  document.querySelectorAll('.notif-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.tab === category);
  });
  renderFilteredNotifications();
}

// 4. Tandai Semua Telah Dibaca
async function markAllNotifsAsRead() {
  if (!currentUser) return;
  await db.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id).eq('is_read', false);
  allNotificationsData.forEach(n => n.is_read = true);
  renderFilteredNotifications();
}

// 5. Realtime Listener Supabase
function subscribeToRealtimeNotifications(userId) {
  db.channel('realtime-notifs-' + userId)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'notifications',
      filter: `user_id=eq.${userId}`
    }, () => {
      loadNotifications(userId);
    })
    .subscribe();
}

// Event Toggle Dropdown
document.getElementById('notifBellBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('notifDropdown').classList.toggle('hidden');
});

// Mencegah dropdown tertutup saat diklik di dalam area dropdown
document.getElementById('notifDropdown').addEventListener('click', (e) => {
  e.stopPropagation();
});

window.addEventListener('click', () => {
  document.getElementById('notifDropdown').classList.add('hidden');
});

// Jalankan inisialisasi sistem notifikasi
initNotificationSystem();
</script>
</body>
</html>
