<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050707">
<meta name="description" content="OER — Connect Everything">
<title>OER — Home</title>

<style>
:root {
  --bg: #050707;
  --surface: #0b1011;
  --surface-hover: #111a1b;
  --border: #1c2b2c;
  --text: #f2fafa;
  --muted: #819394;
  --cyan: #00e5d0;
  --cyan-soft: rgba(0,229,208,.09);
  --green: #20d890;
  --red: #ff5d72;
}

- {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, rgba(0,229,208,.055), transparent 42%),
    var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
}

button, input {
  font: inherit;
}

button {
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

/* HEADER */

.topbar {
  height: 72px;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(5,7,7,.94);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  max-width: 1240px;
  height: 100%;
  padding: 0 24px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 28px;
}

.brand {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 42px;
  height: 42px;
  object-fit: contain;
  display: block;
  border-radius: 10px; /* biar cocok dengan bentuk logo yang rounded */
}

/*
  LOGO OER / QER:
  Logo sudah di-embed sebagai base64 dari file yang kamu kirim.
*/

.brand-word {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
}

.brand-word span {
  color: var(--cyan);
}

.search-box {
  max-width: 410px;
  flex: 1;
  height: 42px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
}

.search-box svg {
  width: 18px;
  height: 18px;
  color: var(--muted);
  flex-shrink: 0;
}

.search-box input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  color: var(--text);
  background: transparent;
  font-size: 13px;
}

.search-box input::placeholder {
  color: var(--muted);
}

.header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-button {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
  cursor: pointer;
  transition: .2s;
}

.header-button:hover {
  background: var(--surface-hover);
  border-color: var(--cyan);
}

.header-button svg {
  width: 19px;
  height: 19px;
  stroke: currentColor;
}

/* LAYOUT */

.layout {
  max-width: 1240px;
  min-height: calc(100vh - 72px);
  margin: auto;
  padding: 25px 24px 40px;
  display: grid;
  grid-template-columns: 225px minmax(0, 1fr) 245px;
  gap: 24px;
  align-items: start;
}

/* SIDEBAR */

.sidebar {
  position: sticky;
  top: 96px;
}

.sidebar-label {
  padding: 0 12px;
  margin: 5px 0 13px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.nav-item {
  width: 100%;
  min-height: 47px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  gap: 13px;
  border: 1px solid transparent;
  border-radius: 13px;
  color: #a9baba;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: .2s;
}

.nav-item:hover {
  color: var(--text);
  background: var(--surface);
}

.nav-item.active {
  color: var(--cyan);
  background: var(--cyan-soft);
  border-color: rgba(0,229,208,.14);
}

.nav-item svg {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
}

.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}

.sidebar-note {
  margin-top: 22px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
}

.sidebar-note strong {
  display: block;
  font-size: 12px;
  margin-bottom: 7px;
}

.sidebar-note p {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

/* MAIN HOME */

.main {
  min-width: 0;
}

.welcome {
  min-height: 166px;
  padding: 25px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(0,229,208,.18);
  border-radius: 20px;
  background:
    radial-gradient(circle at 100% 0%, rgba(0,229,208,.13), transparent 45%),
    linear-gradient(135deg, #0c1516, #080c0d);
}

.welcome::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  right: -50px;
  bottom: -85px;
  border: 1px solid rgba(0,229,208,.15);
  border-radius: 50%;
  box-shadow:
    0 0 0 20px rgba(0,229,208,.025),
    0 0 0 40px rgba(0,229,208,.02);
  pointer-events: none;
}

.eyebrow {
  color: var(--cyan);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.welcome h1 {
  margin-top: 12px;
  font-size: clamp(23px, 3vw, 32px);
  letter-spacing: -.8px;
  line-height: 1.2;
}

.welcome h1 span {
  color: var(--cyan);
}

.welcome p {
  max-width: 410px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

/* SECTION */

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 28px 0 14px;
}

.section-heading h2 {
  font-size: 15px;
  font-weight: 750;
}

.section-heading p {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
}

.section-count {
  padding: 6px 9px;
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--muted);
  font-size: 10px;
}

/* FEATURE GRID */

.feature-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.feature-card {
  min-width: 0;
  min-height: 133px;
  padding: 17px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition: border-color .2s, background .2s, transform .2s;
}

.feature-card:hover {
  background: var(--surface-hover);
  border-color: rgba(0,229,208,.4);
  transform: translateY(-2px);
}

.feature-icon {
  width: 38px;
  height: 38px;
  margin-bottom: 13px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(0,229,208,.16);
  border-radius: 12px;
  color: var(--cyan);
  background: var(--cyan-soft);
}

.feature-icon svg {
  width: 19px;
  height: 19px;
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.feature-card strong {
  font-size: 13px;
  font-weight: 750;
}

.feature-card small {
  margin-top: 6px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.6;
}

.feature-arrow {
  position: absolute;
  top: 19px;
  right: 17px;
  color: #536465;
  font-size: 17px;
}

/* EMPTY AREA */

.empty-state {
  min-height: 150px;
  margin-top: 16px;
  padding: 25px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px dashed #263738;
  border-radius: 16px;
  text-align: center;
}

.empty-icon {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  margin-bottom: 12px;
  border-radius: 13px;
  color: var(--muted);
  background: var(--surface);
}

.empty-icon svg {
  width: 19px;
  height: 19px;
  stroke: currentColor;
  fill: none;
}

.empty-state h3 {
  font-size: 13px;
  font-weight: 700;
}

.empty-state p {
  max-width: 290px;
  margin-top: 7px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

/* RIGHT PANEL */

.right-panel {
  position: sticky;
  top: 96px;
  min-width: 0;
}

.panel-card {
  padding: 17px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
}

.panel-card + .panel-card {
  margin-top: 14px;
}

.panel-title {
  font-size: 13px;
  font-weight: 750;
}

.panel-subtitle {
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

.system-line {
  margin-top: 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.system-line span:first-child {
  color: #bdcaca;
  font-size: 11px;
}

.system-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.system-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #536465;
}

.system-dot.online {
  background: var(--green);
  box-shadow: 0 0 9px rgba(32,216,144,.35);
}

.panel-link {
  width: 100%;
  margin-top: 17px;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #0e1516;
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
}

.panel-link:hover {
  border-color: var(--cyan);
  color: var(--cyan);
}

.info-mark {
  width: 33px;
  height: 33px;
  margin-bottom: 12px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--cyan-soft);
  color: var(--cyan);
  font-weight: 800;
}

/* TOAST */

.toast {
  position: fixed;
  z-index: 300;
  left: 50%;
  bottom: 24px;
  width: max-content;
  max-width: calc(100vw - 32px);
  padding: 13px 17px;
  border: 1px solid #284142;
  border-radius: 13px;
  background: #101819;
  color: var(--text);
  font-size: 12px;
  line-height: 1.6;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 12px);
  transition: .22s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* RESPONSIVE */

@media (max-width: 1050px) {
  .layout {
    grid-template-columns: 205px minmax(0, 1fr);
  }

  .right-panel {
    display: none;
  }
}

@media (max-width: 700px) {
  .topbar {
    height: 64px;
  }

  .topbar-inner {
    padding: 0 15px;
    gap: 12px;
  }

  .brand-logo {
    width: 36px;
    height: 36px;
  }

  .brand-word {
    font-size: 19px;
  }

  .search-box {
    height: 38px;
    padding: 0 10px;
  }

  .search-box input {
    font-size: 11px;
  }

  .header-actions {
    gap: 6px;
  }

  .header-button {
    width: 37px;
    height: 37px;
    border-radius: 11px;
  }

  .layout {
    display: block;
    padding: 18px 15px 35px;
  }

  .sidebar {
    position: static;
    margin-bottom: 19px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .sidebar::-webkit-scrollbar {
    display: none;
  }

  .sidebar-label,
  .sidebar-divider,
  .sidebar-note {
    display: none;
  }

  .nav-list {
    flex-direction: row;
    width: max-content;
    min-width: 100%;
    gap: 7px;
  }

  .nav-item {
    width: auto;
    min-height: 40px;
    padding: 0 12px;
    gap: 8px;
    border-color: var(--border);
    background: var(--surface);
    font-size: 11px;
    white-space: nowrap;
  }

  .nav-item svg {
    width: 16px;
    height: 16px;
  }

  .welcome {
    min-height: 155px;
    padding: 21px;
    border-radius: 17px;
  }

  .welcome h1 {
    font-size: 26px;
  }

  .section-heading {
    margin-top: 24px;
  }

  .feature-grid {
    gap: 10px;
  }

  .feature-card {
    min-height: 126px;
    padding: 14px;
  }

  .feature-arrow {
    top: 15px;
    right: 13px;
  }
}

@media (max-width: 380px) {
  .brand-word {
    display: none;
  }

  .topbar-inner {
    gap: 9px;
  }

  .feature-grid {
    grid-template-columns: 1fr;
  }

  .feature-card {
    min-height: 105px;
  }
}
 
/* HOME OER - FEED, STATUS DAN KREATOR */
.home-section {
  margin-top: 28px;
  min-width: 0;
}

.home-action {
  padding: 8px 11px;
  color: var(--cyan);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 11px;
  cursor: pointer;
}

.home-action:hover {
  border-color: var(--cyan);
}

.home-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.home-post,
.status-card {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: var(--surface);
  overflow-wrap: anywhere;
}

.home-post-header,
.status-header {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 12px;
}

.home-avatar {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 50%;
  background: var(--cyan-soft);
  color: var(--cyan);
  font-weight: 800;
}

.home-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.home-author {
  font-size: 12px;
  font-weight: 750;
}

.home-time {
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
}

.home-post-content,
.status-content {
  color: #dce7e7;
  font-size: 13px;
  line-height: 1.8;
  white-space: pre-wrap;
}

.home-post-media {
  display: block;
  width: 100%;
  max-height: 420px;
  margin-top: 12px;
  border-radius: 12px;
  object-fit: contain;
  background: #050707;
}

.home-message {
  padding: 20px 16px;
  border: 1px dashed var(--border);
  border-radius: 14px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
}

.creator-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.creator-card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 9px;
  padding: 17px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: .2s;
}

.creator-card:hover {
  border-color: var(--cyan);
  background: var(--surface-hover);
}

.creator-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--cyan-soft);
  color: var(--cyan);
  font-size: 21px;
}

.creator-card strong {
  font-size: 13px;
}

.creator-card > span:not(.creator-icon) {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

.creator-card .coming-label {
  padding: 6px 8px;
  border: 1px solid rgba(0,229,208,.2);
  border-radius: 8px;
  color: var(--cyan) !important;
  background: var(--cyan-soft);
}

@media (max-width: 380px) {
  .creator-grid {
    grid-template-columns: 1fr;
  }
  }
  
</style>
</head>
