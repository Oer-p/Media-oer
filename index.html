
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>OeR — Temukan Sesuatu yang Baru</title>
  <meta name="description" content="OeR, tempat untuk mencari dan menjelajahi konten.">

  <style>
    :root {
      --black: #111111;
      --green: #a3e635;
      --text: #202124;
      --muted: #5f6368;
      --border: #dfe1e5;
      --bg: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 22px;
      padding: 20px 26px;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .logo {
      display: inline-flex;
      align-items: baseline;
      font-size: 76px;
      font-weight: 800;
      letter-spacing: -6px;
      color: var(--black);
      line-height: 1;
    }

    .logo .e {
      color: #65a30d;
      font-size: .78em;
      letter-spacing: -3px;
    }

    header .logo {
      font-size: 25px;
      letter-spacing: -2px;
      margin-right: auto;
    }

    header .logo .e { letter-spacing: -1px; }

    .profile {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--green);
      background: var(--black);
      font-weight: bold;
    }

    main {
      width: min(600px, calc(100% - 36px));
      margin: auto;
      padding: 50px 0 100px;
      text-align: center;
    }

    .tagline {
      color: var(--muted);
      font-size: 15px;
      margin: 18px 0 28px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 0 17px;
      transition: box-shadow .2s, border-color .2s;
    }

    .search-box:hover,
    .search-box:focus-within {
      border-color: transparent;
      box-shadow: 0 1px 6px #0002;
    }

    .search-box input {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      font-size: 16px;
      background: transparent;
      color: var(--text);
    }

    .search-icon { color: var(--muted); font-size: 19px; }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }

    button, .action-link {
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 11px 17px;
      font-size: 14px;
      cursor: pointer;
      background: #f8f9fa;
      color: var(--text);
    }

    button:hover, .action-link:hover {
      border-color: #dadce0;
      text-decoration: none;
    }

    .primary {
      background: var(--black);
      color: var(--green);
    }

    .services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 58px;
    }

    .service {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 8px;
      border-radius: 14px;
      font-size: 14px;
    }

    .service:hover {
      background: #f7f8f8;
      text-decoration: none;
    }

    .service-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--black);
      color: var(--green);
      font-size: 21px;
    }

    #notice {
      min-height: 22px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 25px;
      border-top: 1px solid #eeeeee;
      background: #f8f9fa;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-links { display: flex; gap: 20px; }

    @media (max-width: 480px) {
      header { padding: 16px; }
      main { padding-top: 40px; }
      .logo { font-size: 65px; }
      .services { gap: 2px; margin-top: 42px; }
      .service { font-size: 12px; padding: 14px 3px; }
      footer { justify-content: center; }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="./" aria-label="OeR Beranda">
      <span>O</span><span class="e">e</span><span>R</span>
    </a>
    <a href="#layanan">Layanan</a>
    <a href="#profil" class="profile" aria-label="Profil">O</a>
  </header>

  <main>
    <a class="logo" href="./" aria-label="OeR">
      <span>O</span><span class="e">e</span><span>R</span>
    </a>

    <p class="tagline">Temukan sesuatu yang baru.</p>

    <form id="searchForm">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Cari di OeR..."
          aria-label="Cari di OeR"
          autocomplete="off"
        >
        <button type="submit" aria-label="Cari">Cari</button>
      </div>

      <div class="actions">
        <button class="primary" type="submit">Cari di OeR</button>
        <a class="action-link" href="#layanan">Jelajahi OeR</a>
      </div>
    </form>

    <p id="notice" role="status">
      Pencarian OeR sedang dikembangkan.
    </p>

    <section class="services" id="layanan" aria-label="Layanan OeR">
      <a class="service" href="#pencarian">
        <span class="service-icon" aria-hidden="true">⌕</span>
        <span>Pencarian</span>
      </a>
      <a class="service" href="#jelajahi">
        <span class="service-icon" aria-hidden="true">◎</span>
        <span>Jelajahi</span>
      </a>
      <a class="service" href="#profil" id="profileLink">
        <span class="service-icon" aria-hidden="true">♙</span>
        <span>Profil</span>
      </a>
    </section>
  </main>

  <footer>
    <span>OeR — Platform yang terus berkembang</span>
    <nav class="footer-links" aria-label="Informasi">
      <a href="#tentang">Tentang OeR</a>
      <a href="#bantuan">Bantuan</a>
    </nav>
  </footer>

  <script>
    // Demo antarmuka saja; belum melakukan pencarian ke Supabase.
    document.getElementById("searchForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const query = document.getElementById("searchInput").value.trim();
      const notice = document.getElementById("notice");

      notice.textContent = query
        ? "Pencarian OeR untuk “" + query + "” sedang dikembangkan."
        : "Masukkan kata yang ingin dicari.";
    });
  </script>
</body>
</html>
