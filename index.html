<style>
:root {
  --text:#e8eaed;
  --muted:#aeb4bc;
  --border:#41454c;
  --bg:#202124;
  --soft:#303134;
  --blue:#4285f4;
  --red:#ea4335;
  --yellow:#fbbc05;
  --green:#34a853;
  --shadow:0 2px 14px #0006;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column
}
body.light{
  --text:#202124;--muted:#5f6368;--border:#dfe1e5;
  --bg:#f1f3f4;--soft:#e8eaed;--shadow:0 2px 12px #20212420
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--blue);outline-offset:3px
}
header{
  position:relative;z-index:100;width:100%;min-height:60px;padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between
}
.header-right{
  display:flex;align-items:center;gap:10px
}
.account-area{position:relative;display:flex;align-items:center}
.account-button,.menu-toggle{
  display:grid;place-items:center;border:0;border-radius:50%;
  background:transparent;cursor:pointer
}
.account-button{padding:4px}
.account-button:hover,.menu-toggle:hover{background:var(--soft)}
.avatar{
  width:40px;height:40px;display:grid;place-items:center;overflow:hidden;
  border-radius:50%;background:#5f6368;color:white
}
.avatar img{width:100%;height:100%;object-fit:cover}
.account-menu,.site-menu{
  display:none;position:absolute;padding:10px;border:1px solid var(--border);
  border-radius:15px;background:var(--bg);box-shadow:var(--shadow);z-index:160
}
.account-menu{top:50px;left:0;width:min(280px,calc(100vw - 24px))}
.account-menu.show{display:block}
.account-menu-header{
  padding:10px 12px 12px;margin-bottom:6px;border-bottom:1px solid var(--border);
  font-size:12px;color:var(--muted);overflow-wrap:anywhere
}
.account-menu button,.site-menu button{
  width:100%;display:flex;align-items:center;gap:10px;padding:12px;
  border:0;border-radius:9px;background:transparent;color:var(--text);
  text-align:left;font-size:13px;cursor:pointer
}
.account-menu button:hover,.site-menu button:hover{background:var(--soft)}
.menu-toggle{width:42px;height:42px}
.menu-toggle svg{width:25px;height:25px}
.site-menu{top:55px;right:10px;width:min(260px,calc(100vw - 20px));padding:8px}
.site-menu.show{display:grid}

/* KOTAK BAHASA PERMANEN DI HEADER */
.lang-box-home{
  display:flex;align-items:center;background:var(--soft);
  border:1px solid var(--border);border-radius:20px;padding:3px 8px
}
.lang-dropdown-home{
  background:transparent;color:var(--blue);border:none;
  font-size:12px;font-weight:600;outline:none;cursor:pointer;max-width:115px
}
.lang-dropdown-home option, .lang-dropdown-home optgroup{
  background:var(--bg);color:var(--text)
}

main{
  width:100%;flex:1;display:flex;flex-direction:column;align-items:center;
  padding:35px 18px 30px
}
.hero{width:100%;display:flex;flex-direction:column;align-items:center}
.logo{
  height:85px;margin-bottom:22px;display:flex;align-items:center;
  justify-content:center;white-space:nowrap;user-select:none
}
.logo-o{
  width:65px;height:65px;position:relative;display:inline-block;flex-shrink:0;
  border-radius:50%;
  background:conic-gradient(from -43deg,var(--red) 0deg 105deg,
  var(--yellow) 105deg 225deg,var(--blue) 225deg 360deg)
}
.logo-o:after{
  content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg)
}
.logo-oe,.logo-r{
  font-size:80px;font-weight:500;line-height:1;letter-spacing:-5px
}
.logo-oe{color:var(--red);margin-left:6px}
.logo-r{color:var(--green);margin-left:2px;letter-spacing:-3px}
.search-wrap{position:relative;width:min(100%,760px)}
.search-box{
  width:100%;min-height:58px;display:flex;align-items:center;gap:14px;
  padding:0 20px;border:1px solid var(--border);border-radius:32px;
  background:transparent;transition:box-shadow .18s,border-color .18s
}
.search-box:hover,.search-box:focus-within{
  border-color:transparent;box-shadow:var(--shadow)
}
.search-icon{width:23px;height:23px;color:var(--muted);flex-shrink:0}
#searchInput{
  width:100%;min-width:0;padding:15px 0;border:0;outline:none;
  background:transparent;color:var(--text);font-size:16px
}
#searchInput::placeholder{color:var(--muted)}
.search-action{
  display:grid;place-items:center;padding:7px;border:0;border-radius:50%;
  background:transparent;color:var(--blue);cursor:pointer;flex-shrink:0;
  transition:all 0.2s ease
}
.search-action svg{width:23px;height:23px}
/* Efek saat Mic aktif mendengarkan */
.search-action.listening {
  color: #ea4335 !important;
  background: rgba(234, 67, 53, 0.15) !important;
  transform: scale(1.15);
  animation: pulseMic 1.2s infinite;
}
@keyframes pulseMic {
  0% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(234, 67, 53, 0); }
  100% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
}

.suggestions{
  display:none;position:absolute;top:64px;left:0;right:0;z-index:50;
  overflow:hidden;padding:8px 0;border-radius:18px;background:var(--bg);
  box-shadow:var(--shadow)
}
.suggestions.show{display:block}
.suggestion{
  display:flex;align-items:center;gap:13px;width:100%;padding:12px 20px;
  border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer
}
.suggestion:hover{background:var(--soft)}

/* Tiga tombol utama */
.search-buttons{
  display:flex;justify-content:center;align-items:center;
  gap:10px;margin-top:20px;flex-wrap:wrap
}
.search-buttons button{
  min-height:46px;padding:12px 21px;border:1px solid transparent;
  border-radius:999px;background:#30343B;color:#f1f3f4;
  font-size:14px;font-weight:500;cursor:pointer;
  transition:background .18s ease,transform .18s ease
}
.search-buttons button:hover{background:#454950}
.search-buttons button:active{transform:scale(.97)}
.search-buttons button.selected{background:#808080;color:#fff}
body.light .search-buttons button{background:#30343B;color:#f1f3f4}
body.light .search-buttons button.selected{background:#808080;color:#fff}

#notice{
  min-height:18px;margin:12px 0 0;color:var(--muted);
  font-size:12px;text-align:center
}
.shortcuts,#oer-bola,#reels,.about-section,footer{display:none!important}

/* Dialog umum */
.overlay{
  display:none;position:fixed;inset:0;z-index:200;
  align-items:center;justify-content:center;padding:18px;background:#0009
}
.overlay.show{display:flex}
.dialog{
  width:min(100%,470px);max-height:85vh;overflow:auto;padding:22px;
  border:1px solid var(--border);border-radius:18px;background:var(--bg);
  box-shadow:var(--shadow)
}
.dialog-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;margin-bottom:16px
}
.dialog-head h2{font-size:19px;margin:0}
.close-button{
  width:35px;height:35px;border:0;border-radius:50%;
  background:var(--soft);cursor:pointer;font-size:20px
}
.dialog-list{display:grid;gap:8px}
.dialog-item{
  display:flex;align-items:center;gap:12px;padding:12px;
  border-radius:10px;overflow-wrap:anywhere
}
.dialog-item:hover{background:var(--soft)}
.dialog-item button{
  margin-left:auto;border:0;background:transparent;
  cursor:pointer;color:var(--muted)
}
.dialog-empty{color:var(--muted);font-size:14px;line-height:1.6}
.primary-button{
  width:100%;padding:12px 16px;border:0;border-radius:9px;
  background:var(--blue);color:white;cursor:pointer;font-weight:600
}
.settings-group{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;padding:14px 0;border-bottom:1px solid var(--border)
}
.settings-group:last-of-type{border-bottom:0}
.settings-text h4{margin:0 0 4px;font-size:15px}
.settings-text p{margin:0;font-size:12px;color:var(--muted)}

/* Login Popup */
#loginGate{
  display:none;position:fixed;inset:0;z-index:99999;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(12,13,15,.88);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px)
}
#loginGate.show{display:flex}
.login-card{
  width:min(100%,390px);padding:30px 24px;text-align:center;
  border:1px solid #484b50;border-radius:22px;background:#242629;
  color:#f1f3f4;box-shadow:0 18px 70px #0008
}
.login-logo{
  display:flex;align-items:center;justify-content:center;
  font-size:42px;font-weight:600;letter-spacing:-3px;margin-bottom:16px
}
.login-logo .oe{color:#ea4335}
.login-logo .r{color:#34a853}
.login-logo .o{
  width:34px;height:34px;border:8px solid #4285f4;
  border-radius:50%;margin-right:4px
}
.login-card h1{font-size:22px;margin:0 0 10px}
.login-card p{
  font-size:14px;line-height:1.6;color:#c4c7cc;margin:0 0 22px
}
.google-button{
  width:100%;min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:12px;padding:12px 16px;
  border:1px solid #5f6368;border-radius:10px;background:#f8f9fa;
  color:#202124;font-weight:600;cursor:pointer
}
.google-button:hover{background:#e8eaed}
.google-button:disabled{opacity:.65;cursor:wait}
.google-mark{font-size:21px;font-weight:bold;color:#4285f4}
#loginMessage{min-height:20px;margin:14px 0 0;font-size:12px;color:#ffb4ab}

/* KUNCI POINTER SUDAH DIHAPUS SUPAYA LAYAR TIDAK PERNAH MACET */
body.login-locked{overflow:hidden}

@media(max-width:700px){
  header{min-height:56px;padding:8px 10px}
  main{padding:35px 18px 30px}
  .search-box{min-height:54px;padding:0 15px;gap:10px}
  #searchInput{font-size:15px}
  .search-buttons{width:100%;gap:8px}
  .search-buttons button{flex:1;padding:11px 8px;font-size:13px}
}
@media(max-width:380px){
  .logo-o{width:55px;height:55px}
  .logo-o:after{inset:10px}
  .logo-oe,.logo-r{font-size:68px}
  .search-buttons button{font-size:12px;padding:11px 6px}
}
</style>
</head>

  /* FITUR BICARA (TEXT-TO-SPEECH) */
  function oerSpeak(text, lang) {
    if (!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const dict = UI_DICTIONARY[lang] || UI_DICTIONARY["Indonesia"];
      utter.lang = dict.speechLang || "id-ID";
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    } catch(e) {}
  }

  function updateThemeButton() {
    if (!themeButton) return;
    const curLang = langSelectHome ? langSelectHome.value : "Indonesia";
    const dict = UI_DICTIONARY[curLang] || UI_DICTIONARY["Indonesia"];
    themeButton.textContent = document.body.classList.contains("light") ? dict.darkMode : dict.lightMode;
  }

  function applyLanguage(lang) {
    const dict = UI_DICTIONARY[lang] || UI_DICTIONARY["Indonesia"];
    
    if (input) {
      input.placeholder = dict.placeholder;
      input.setAttribute("aria-label", dict.placeholder);
    }
    if ($("txtLuckyButton")) $("txtLuckyButton").textContent = dict.explore;
    if ($("loginTitle")) $("loginTitle").textContent = dict.loginTitle;
    if ($("txtLoginDesc")) $("txtLoginDesc").textContent = dict.loginDesc;
    if ($("gateGoogleText")) $("gateGoogleText").textContent = dict.loginBtn;
    if ($("txtMenuHistory")) $("txtMenuHistory").textContent = dict.history;
    if ($("txtMenuFavorites")) $("txtMenuFavorites").textContent = dict.favorites;
    if ($("txtSiteSettings")) $("txtSiteSettings").textContent = dict.settings;
    if ($("txtSiteBusiness")) $("txtSiteBusiness").textContent = dict.business;
    if ($("txtSiteCookies")) $("txtSiteCookies").textContent = dict.cookies;
    if ($("txtSiteHelp")) $("txtSiteHelp").textContent = dict.help;

    if ($("historyTitle")) $("historyTitle").textContent = dict.history;
    if ($("clearHistoryButton")) $("clearHistoryButton").textContent = dict.clearHist;
    if ($("favoritesTitle")) $("favoritesTitle").textContent = dict.favorites;
    if ($("txtFavEmpty")) $("txtFavEmpty").textContent = dict.emptyFav;
    if ($("settingsTitle")) $("settingsTitle").textContent = "OoeR " + dict.settings;
    if ($("txtThemeTitle")) $("txtThemeTitle").textContent = dict.themeTitle;
    if ($("txtThemeDesc")) $("txtThemeDesc").textContent = dict.themeDesc;
    if ($("txtHistTitle")) $("txtHistTitle").textContent = dict.history;
    if ($("settingsHistoryBtn")) $("settingsHistoryBtn").textContent = dict.openBtn;

    updateThemeButton();

    if (!currentSession) {
      if ($("accountMenuHeader")) $("accountMenuHeader").textContent = dict.guestStatus;
      if ($("googleAuthText")) $("googleAuthText").textContent = dict.loginBtn;
    } else {
      if ($("googleAuthText")) $("googleAuthText").textContent = dict.logoutBtn;
    }
  }

  // Muat bahasa permanen
  const savedLang = localStorage.getItem("ooer_user_lang") || "Indonesia";
  if (langSelectHome) langSelectHome.value = savedLang;
  applyLanguage(savedLang);

  if (langSelectHome) {
    langSelectHome.addEventListener("change", () => {
      const chosen = langSelectHome.value;
      localStorage.setItem("ooer_user_lang", chosen);
      applyLanguage(chosen);
    });
  }

  // Event saat pengguna kembali dari search: Bebas macet & Sinkron
  window.addEventListener("pageshow", () => {
    document.body.classList.remove("login-locked");
    const currentLang = localStorage.getItem("ooer_user_lang") || "Indonesia";
    if (langSelectHome) langSelectHome.value = currentLang;
    applyLanguage(currentLang);
    if (currentSession) unlockPage(currentSession);
  });

  /* SUPABASE AUTH */
  if (window.supabase?.createClient) {
    try {
      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: "pkce"
          }
        }
      );
    } catch (error) {
      console.error("Supabase gagal diinisialisasi:", error);
    }
  }

  function readStorage(key, fallback = []) {
    try {
      const value = JSON.parse(localStorage.getItem(key) || "null");
      return Array.isArray(fallback) ? (Array.isArray(value) ? value : fallback) : (value ?? fallback);
    } catch {
      return fallback;
    }
  }

  function writeStorage(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {
      console.warn("Penyimpanan lokal tidak tersedia:", error);
    }
  }

  function lockPage() {
    if (loginGate) loginGate.classList.add("show");
    const curLang = langSelectHome ? langSelectHome.value : "Indonesia";
    const dict = UI_DICTIONARY[curLang] || UI_DICTIONARY["Indonesia"];
    if ($("accountMenuHeader")) $("accountMenuHeader").textContent = dict.guestStatus;
  }

  function unlockPage(session) {
    currentSession = session;
    document.body.classList.remove("login-locked");
    if (loginGate) loginGate.classList.remove("show");

    const curLang = langSelectHome ? langSelectHome.value : "Indonesia";
    const dict = UI_DICTIONARY[curLang] || UI_DICTIONARY["Indonesia"];
    const user = session.user;
    const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || "Pengguna OoeR";
    const picture = user.user_metadata?.avatar_url || user.user_metadata?.picture;

    if ($("accountMenuHeader")) {
      $("accountMenuHeader").textContent = name + (user.email ? " · " + user.email : "");
    }
    if ($("googleAuthText")) $("googleAuthText").textContent = dict.logoutBtn;

    const avatar = $("avatar");
    if (avatar) {
      avatar.replaceChildren();
      if (picture) {
        const img = document.createElement("img");
        img.src = picture;
        img.alt = "Foto profil";
        img.referrerPolicy = "no-referrer";
        img.onerror = () => { avatar.textContent = (name[0] || "O").toUpperCase(); };
        avatar.appendChild(img);
      } else {
        avatar.textContent = (name[0] || "O").toUpperCase();
      }
    }
  }

  function showLoginError(message) {
    if ($("loginMessage")) $("loginMessage").textContent = message;
  }

  async function signInWithGoogle() {
    if (authBusy) return;
    if (!supabaseClient) {
      showLoginError("Supabase belum berhasil dimuat. Periksa koneksi internet.");
      return;
    }

    authBusy = true;
    const button = $("gateGoogleLogin");
    if (button) button.disabled = true;
    if ($("gateGoogleText")) $("gateGoogleText").textContent = "Menghubungkan...";
    showLoginError("");

    try {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: SITE_URL,
          queryParams: { prompt: "select_account" }
        }
      });
      if (error) throw error;
    } catch (error) {
      console.error("Google OAuth error:", error);
      showLoginError("Login gagal: " + (error.message || "Periksa konfigurasi."));
      authBusy = false;
      if (button) button.disabled = false;
      const curLang = langSelectHome ? langSelectHome.value : "Indonesia";
      const dict = UI_DICTIONARY[curLang] || UI_DICTIONARY["Indonesia"];
      if ($("gateGoogleText")) $("gateGoogleText").textContent = dict.loginBtn;
    }
  }

  async function signOut() {
    if (!supabaseClient) return;
    if (!confirm("Keluar dari akun Google OoeR?")) return;

    const { error } = await supabaseClient.auth.signOut();
    if (error) {
      alert("Gagal keluar: " + error.message);
      return;
    }

    currentSession = null;
    if (accountMenu) accountMenu.classList.remove("show");
    applyLanguage(langSelectHome ? langSelectHome.value : "Indonesia");
  }

  if ($("gateGoogleLogin")) $("gateGoogleLogin").addEventListener("click", signInWithGoogle);

  if ($("menuGoogleLogin")) {
    $("menuGoogleLogin").addEventListener("click", async () => {
      if (accountMenu) accountMenu.classList.remove("show");
      if (currentSession) await signOut();
      else await signInWithGoogle();
    });
  }

  async function initializeAuth() {
    if (!supabaseClient) {
      authReady = true;
      return;
    }

    try {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) throw error;
      authReady = true;
      if (data.session?.user) unlockPage(data.session);
    } catch (error) {
      authReady = true;
    }
  }

  if (supabaseClient) {
    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentSession = session;
      if (session?.user) {
        unlockPage(session);
        showLoginError("");
      } else if (authReady || event === "SIGNED_OUT") {
        document.body.classList.remove("login-locked");
      }
    });
  }

  /* Menu akun dan menu situs */
  if ($("accountMenuButton")) {
    $("accountMenuButton").addEventListener("click", event => {
      event.stopPropagation();
      if (accountMenu) {
        accountMenu.classList.toggle("show");
        $("accountMenuButton").setAttribute(
          "aria-expanded",
          accountMenu.classList.contains("show") ? "true" : "false"
        );
      }
    });
  }

  if (accountMenu) accountMenu.addEventListener("click", event => event.stopPropagation());

  if ($("siteMenuButton")) {
    $("siteMenuButton").addEventListener("click", event => {
      event.stopPropagation();
      if (siteMenu) siteMenu.classList.toggle("show");
    });
  }

  if (siteMenu) siteMenu.addEventListener("click", event => event.stopPropagation());

  document.addEventListener("click", () => {
    if (accountMenu) accountMenu.classList.remove("show");
    if (siteMenu) siteMenu.classList.remove("show");
    if ($("accountMenuButton")) $("accountMenuButton").setAttribute("aria-expanded", "false");
    hideSuggestions();
  });

  if ($("siteSettings")) {
    $("siteSettings").addEventListener("click", () => {
      if (siteMenu) siteMenu.classList.remove("show");
      openOverlay("settingsOverlay");
    });
  }

  if ($("siteBusiness")) {
    $("siteBusiness").addEventListener("click", () => {
      window.location.href = "mailto:oerplatfrom@gmail.com?subject=Kerja%20Sama%20Bisnis%20OoeR";
    });
  }

  if ($("siteCookies")) {
    $("siteCookies").addEventListener("click", () => {
      alert("Pengaturan Cookie akan ditambahkan pada tahap berikutnya.");
    });
  }

  if ($("siteHelp")) {
    $("siteHelp").addEventListener("click", () => {
      window.location.href = "mailto:oerplatfrom@gmail.com?subject=Bantuan%20OoeR";
    });
  }

  function openOverlay(id) { $(id)?.classList.add("show"); }
  function closeOverlay(id) { $(id)?.classList.remove("show"); }

  if (loginGate) loginGate.addEventListener("click", event => { event.stopPropagation(); });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      document.querySelectorAll(".overlay.show").forEach(el => el.classList.remove("show"));
      if (accountMenu) accountMenu.classList.remove("show");
      if (siteMenu) siteMenu.classList.remove("show");
    }
  });

  /* Riwayat pencarian */
  function getHistory() {
    return readStorage("oer_search_history", []).filter(item => typeof item === "string");
  }

  function saveHistory(query) {
    const history = getHistory().filter(item => item.toLowerCase() !== query.toLowerCase());
    history.unshift(query);
    writeStorage("oer_search_history", history.slice(0, 20));
  }

  function hideSuggestions() { if (suggestions) suggestions.classList.remove("show"); }

  function renderSuggestions() {
    if (!suggestions || !input) return;
    const query = input.value.trim().toLowerCase();
    const items = getHistory().filter(item => !query || item.toLowerCase().includes(query)).slice(0, 5);

    suggestions.replaceChildren();
    if (!items.length) { hideSuggestions(); return; }

    items.forEach(item => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "suggestion";

      const icon = document.createElement("span");
      icon.textContent = "◷";
      const label = document.createElement("span");
      label.textContent = item;

      button.append(icon, label);
      button.addEventListener("click", event => {
        event.stopPropagation();
        input.value = item;
        performSearch();
      });

      suggestions.appendChild(button);
    });

    suggestions.classList.add("show");
  }

  function performSearch() {
    if (!input) return;
    const query = input.value.trim();

    if (!query) {
      const curLang = langSelectHome ? langSelectHome.value : "Indonesia";
      const dict = UI_DICTIONARY[curLang] || UI_DICTIONARY["Indonesia"];
      if (notice) notice.textContent = dict.emptySearch;
      input.focus();
      return;
    }

    saveHistory(query);
    hideSuggestions();

    const normalized = query.toLowerCase();
    const mlbbKeywords = ["meta mlbb", "mlbb meta", "meta mobile legends", "mobile legends meta", "tier list mlbb", "mlbb 2026", "meta 2026", "mlbb tier list", "hero meta mlbb", "mlbb_ooer", "mlbb ooer", "mlbb", "mobile legends"];
    const gameKeywords = ["game", "games", "oer game", "oer games", "pubg mobile", "free fire", "genshin impact", "minecraft", "roblox", "valorant", "tekken", "god of war", "need for speed", "gran turismo", "stardew valley", "among us"];

    if (mlbbKeywords.some(keyword => normalized === keyword || normalized.includes(keyword))) {
      location.href = new URL("./Mlbb_ooer.html", location.href).href;
      return;
    }

    if (gameKeywords.includes(normalized)) {
      location.href = new URL("./games.html", location.href).href;
      return;
    }

    const url = new URL("./search.html", location.href);
    url.searchParams.set("q", query);
    location.href = url.href;
  }

  if (form) {
    form.addEventListener("submit", event => {
      event.preventDefault();
      performSearch();
    });
  }

  if (input) {
    input.addEventListener("input", renderSuggestions);
    input.addEventListener("focus", renderSuggestions);
  }

  /* Tombol utama OoeR */
  const mainButtons = [
    $("netnetButton"),
    $("aiButton"),
    $("luckyButton")
  ].filter(Boolean);

  mainButtons.forEach(button => {
    button.addEventListener("click", () => {
      mainButtons.forEach(item => item.classList.remove("selected"));
      button.classList.add("selected");

      if (button.id === "netnetButton") {
        if (notice) notice.textContent = "NetNet sedang disiapkan.";
        return;
      }
      if (button.id === "aiButton") {
        location.href = "https://oer-p.github.io/Media-oer/ai_chat.html";
        return;
      }
      if (button.id === "luckyButton") {
        location.href = "./search.html";
      }
    });
  });

  /* ===================================================
     FITUR MIC CANGGIH: MENDENGAR SESUAI BAHASA AKTIF & BISA BICARA
     =================================================== */
  if (voiceBtn) {
    voiceBtn.addEventListener("click", () => {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const curLang = langSelectHome ? langSelectHome.value : "Indonesia";
      const dict = UI_DICTIONARY[curLang] || UI_DICTIONARY["Indonesia"];

      if (!SpeechRec) {
        alert("Browser ini belum mendukung mikrofon.");
        return;
      }

      const mic = new SpeechRec();
      mic.lang = dict.speechLang || "id-ID";
      mic.interimResults = false;
      mic.maxAlternatives = 1;

      // Saat mic mulai mendengar
      mic.onstart = () => {
        voiceBtn.classList.add("listening");
        if (notice) notice.textContent = dict.listeningText;
      };

      // Saat suara berhasil ditangkap
      mic.onresult = event => {
        const hasilSuara = event.results[0][0].transcript;
        if (input) input.value = hasilSuara;
        if (notice) notice.textContent = "";
        
        // Beri respon suara kecil & langsung cari otomatis!
        oerSpeak(hasilSuara, curLang);
        performSearch();
      };

      // Jika suara tidak terdeteksi
      mic.onerror = () => {
        if (notice) notice.textContent = dict.micError;
      };

      // Saat mic selesai
      mic.onend = () => {
        voiceBtn.classList.remove("listening");
        if (notice && notice.textContent === dict.listeningText) {
          notice.textContent = "";
        }
      };

      mic.start();
    });
  }

  /* Dialog riwayat */
  function renderHistory() {
    const list = $("historyList");
    if (!list) return;
    list.replaceChildren();
    const history = getHistory();
    const curLang = langSelectHome ? langSelectHome.value : "Indonesia";
    const dict = UI_DICTIONARY[curLang] || UI_DICTIONARY["Indonesia"];

    if (!history.length) {
      const empty = document.createElement("p");
      empty.className = "dialog-empty";
      empty.textContent = dict.emptyHist;
      list.appendChild(empty);
      return;
    }

    history.forEach(query => {
      const row = document.createElement("div");
      row.className = "dialog-item";

      const label = document.createElement("span");
      label.textContent = "◷ " + query;
      label.style.cursor = "pointer";
      label.style.flex = "1";

      label.addEventListener("click", () => {
        if (input) input.value = query;
        closeOverlay("historyOverlay");
        performSearch();
      });

      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "×";
      remove.addEventListener("click", () => {
        writeStorage("oer_search_history", getHistory().filter(item => item !== query));
        renderHistory();
      });

      row.append(label, remove);
      list.appendChild(row);
    });
  }

  /* Favorit */
  function getFavorites() {
    return readStorage("oer_favorites", []).filter(item => typeof item === "string");
  }

  function renderFavorites() {
    const list = $("favoritesList");
    if (!list) return;
    list.replaceChildren();
    const favorites = getFavorites();
    const curLang = langSelectHome ? langSelectHome.value : "Indonesia";
    const dict = UI_DICTIONARY[curLang] || UI_DICTIONARY["Indonesia"];

    if (!favorites.length) {
      const empty = document.createElement("p");
      empty.className = "dialog-empty";
      empty.textContent = dict.emptyFav;
      list.appendChild(empty);
      return;
    }

    favorites.forEach(query => {
      const row = document.createElement("div");
      row.className = "dialog-item";

      const label = document.createElement("span");
      label.textContent = "☆ " + query;
      label.style.flex = "1";
      label.style.cursor = "pointer";

      label.addEventListener("click", () => {
        if (input) input.value = query;
        closeOverlay("favoritesOverlay");
        performSearch();
      });

      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "×";
      remove.addEventListener("click", () => {
        writeStorage("oer_favorites", getFavorites().filter(item => item !== query));
        renderFavorites();
      });

      row.append(label, remove);
      list.appendChild(row);
    });
  }

  if ($("menuHistory")) {
    $("menuHistory").addEventListener("click", () => {
      if (accountMenu) accountMenu.classList.remove("show");
      renderHistory();
      openOverlay("historyOverlay");
    });
  }

  if ($("menuFavorites")) {
    $("menuFavorites").addEventListener("click", () => {
      if (accountMenu) accountMenu.classList.remove("show");
      renderFavorites();
      openOverlay("favoritesOverlay");
    });
  }

  if ($("clearHistoryButton")) {
    $("clearHistoryButton").addEventListener("click", () => {
      if (confirm("Hapus semua riwayat pencarian?")) {
        localStorage.removeItem("oer_search_history");
        renderHistory();
      }
    });
  }

  if ($("settingsHistoryBtn")) {
    $("settingsHistoryBtn").addEventListener("click", () => {
      closeOverlay("settingsOverlay");
      renderHistory();
      openOverlay("historyOverlay");
    });
  }

  /* Tema */
  if (readStorage("oer_dark_mode", true) === false) {
    document.body.classList.add("light");
  }
  updateThemeButton();

  if (themeButton) {
    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("light");
      writeStorage("oer_dark_mode", !document.body.classList.contains("light"));
      updateThemeButton();
    });
  }

  document.querySelectorAll("[data-close]").forEach(button => {
    button.addEventListener("click", () => { closeOverlay(button.dataset.close); });
  });

  document.querySelectorAll(".overlay").forEach(overlay => {
    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeOverlay(overlay.id);
    });
  });

  /* Inisialisasi awal */
  initializeAuth();
})();
</script>
</body>
</html>
