
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>OeR — Temukan Sesuatu yang Baru</title>
  <meta name="description" content="OeR, tempat untuk mencari dan menjelajahi konten.">

  <style>
    :root {
      --black: #171717;
      --green: #a3e635;
      --green-dark: #65a30d;
      --text: #202124;
      --muted: #5f6368;
      --border: #dfe1e5;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    header {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 20px 26px;
    }

    /* Logo OeR */
    .logo {
      display: inline-flex;
      align-items: baseline;
      gap: 1px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 76px;
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
      color: var(--black);
      text-decoration: none;
      white-space: nowrap;
    }

    .logo .e {
      color: var(--green-dark);
      font-size: 0.78em;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo:hover {
      text-decoration: none;
    }

    header .logo {
      margin-right: auto;
      font-size: 25px;
      letter-spacing: -1px;
    }

    header .logo .e {
      letter-spacing: 0;
    }

    .header-link {
      font-size: 14px;
      color: var(--text);
    }

    .profile {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--green);
      background: var(--black);
      font-weight: bold;
    }

    main {
      width: min(600px, calc(100% - 36px));
      margin: auto;
      padding: 50px 0 100px;
      text-align: center;
    }

    .tagline {
      margin: 18px 0 28px;
      color: var(--muted);
      font-size: 15px;
    }

    /* Kolom pencarian */
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 28px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .search-box:hover,
    .search-box:focus-within {
      border-color: transparent;
      box-shadow: 0 1px 6px #0002;
    }

    .search-icon {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 20px;
    }

    .search-box input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 13px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
    }

    .search-box input::-webkit-search-cancel-button {
      cursor: pointer;
    }

    #notice {
      min-height: 22px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 17px 25px;
      border-top: 1px solid #eeeeee;
      background: #f8f9fa;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    @media (max-width: 480px) {
      header {
        gap: 16px;
        padding: 16px;
      }

      header .logo {
        font-size: 24px;
      }

      main {
        padding-top: 40px;
        padding-bottom: 70px;
      }

      main > .logo {
        font-size: 65px;
      }

      .tagline {
        margin-top: 16px;
      }

      .search-box {
        min-height: 46px;
        padding: 0 15px;
      }

      .search-box input {
        font-size: 15px;
      }

      footer {
        justify-content: center;
        text-align: center;
        padding: 18px 16px;
      }

      .footer-links {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="./" aria-label="OeR Beranda">
      <span>O</span><span class="e">e</span><span>R</span>
    </a>

    <a class="header-link" href="#tentang">Tentang</a>

    <a href="#profil" class="profile" aria-label="Profil OeR">O</a>
  </header>

  <main>
    <a class="logo" href="./" aria-label="OeR">
      <span>O</span><span class="e">e</span><span>R</span>
    </a>

    <p class="tagline">Temukan sesuatu yang baru.</p>

    <form id="searchForm" role="search">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Cari di OeR..."
          aria-label="Cari di OeR"
          autocomplete="off"
        >
      </div>
    </form>

    <p id="notice" role="status" aria-live="polite">
      Pencarian OeR sedang dikembangkan.
    </p>
  </main>

  <footer>
    <span>OeR — Platform yang terus berkembang</span>

    <nav class="footer-links" aria-label="Informasi">
      <a href="#tentang">Tentang OeR</a>
      <a href="#bantuan">Bantuan</a>
    </nav>
  </footer>

  <script>
    // Antarmuka demo: belum terhubung ke Supabase.
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const notice = document.getElementById("notice");

    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const query = searchInput.value.trim();

      notice.textContent = query
        ? 'Pencarian OeR untuk "' + query + '" sedang dikembangkan.'
        : "Masukkan kata yang ingin dicari.";
    });
  </script>
</body>
</html>
