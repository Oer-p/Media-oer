<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dompet & Monetisasi — OER</title>
  <style>
    :root {
      --bg: #050707;
      --panel: #0d1115;
      --panel2: #11171c;
      --line: #202a30;
      --text: #f4f8fa;
      --muted: #87949d;
      --cyan: #00e5ff;
      --green: #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }

    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }

    /* CARD HEADER DOMPET */
    .wallet-card {
      background: linear-gradient(135deg, #0d1115 0%, #15222e 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .wallet-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
    .wallet-balance { font-size: 36px; font-weight: 900; color: var(--cyan); margin: 8px 0 16px 0; }
    
    .wallet-stats { display: flex; gap: 20px; border-top: 1px solid var(--line); padding-top: 16px; margin-bottom: 20px; }
    .stat-item { flex: 1; }
    .stat-label { font-size: 11px; color: var(--muted); }
    .stat-value { font-size: 16px; font-weight: 700; color: var(--text); margin-top: 2px; }

    .btn-withdraw {
      width: 100%;
      background: var(--cyan);
      color: #050707;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-withdraw:hover { opacity: 0.9; }
    .btn-withdraw:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

    /* PROGRESS BAR SYARAT MONETISASI */
    .requirement-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title { font-size: 15px; font-weight: 800; color: var(--text); }
    .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
    .badge-locked { background: rgba(255, 82, 82, 0.15); color: #ff5252; }
    .badge-active { background: rgba(0, 230, 118, 0.15); color: var(--green); }

    .progress-group { margin-bottom: 16px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
    .progress-bar-bg { width: 100%; height: 8px; background: var(--panel2); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    .progress-fill { height: 100%; background: var(--cyan); width: 0%; transition: width 0.5s ease; }

    /* RIWAYAT PENDAPATAN */
    .history-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
    .history-list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .history-item:last-child { border-bottom: none; }
    .history-desc { font-size: 13px; font-weight: 600; }
    .history-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .history-amount { font-size: 13px; font-weight: 800; color: var(--green); }

    /* MODAL WITHDRAW */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; width: 100%; max-width: 400px; padding: 20px; }
    .input-field { width: 100%; padding: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; color: var(--text); margin-top: 6px; margin-bottom: 14px; outline: none; }
  </style>
</head>
<body>

  <div class="container">

    <!-- CARD DOMPET KREATOR -->
    <div class="wallet-card">
      <div class="wallet-title">Dompet Monetisasi OER</div>
      <div id="balanceDisplay" class="wallet-balance">Rp 0</div>

      <div class="wallet-stats">
        <div class="stat-item">
          <div class="stat-label">Pendapatan Bulan Ini</div>
          <div id="monthIncome" class="stat-value">Rp 0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Total Dicairkan</div>
          <div id="totalWithdrawn" class="stat-value">Rp 0</div>
        </div>
      </div>

      <button id="withdrawBtn" class="btn-withdraw" onclick="openWithdrawModal()" disabled>
        Tarik Saldo (Withdraw)
      </button>
    </div>

    <!-- SYARAT MONETISASI (2000 FOLLOWERS & 1000 JAM TAYANG) -->
    <div class="requirement-card">
      <div class="card-header">
        <div class="card-title">Syarat Monetisasi Konten</div>
        <span id="monetizeStatusBadge" class="status-badge badge-locked">Belum Memenuhi</span>
      </div>

      <!-- PROGRESS 1: 2000 Pengikut -->
      <div class="progress-group">
        <div class="progress-label">
          <span>👥 Pengikut Aktif</span>
          <span id="followersText">0 / 2.000</span>
        </div>
        <div class="progress-bar-bg">
          <div id="followersBar" class="progress-fill"></div>
        </div>
      </div>

      <!-- PROGRESS 2: 1000 Jam Tayang -->
      <div class="progress-group">
        <div class="progress-label">
          <span>⏱️ Jam Tayang Reels</span>
          <span id="watchHoursText">0 / 1.000 Jam</span>
        </div>
        <div class="progress-bar-bg">
          <div id="watchHoursBar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- RIWAYAT PENDAPATAN -->
    <div class="history-card">
      <div class="card-title">Riwayat Pendapatan Terbaru</div>
      <div id="historyList" class="history-list">
        <div style="text-align: center; color: var(--muted); font-size: 12px; padding: 10px;">Belum ada riwayat transaksi.</div>
      </div>
    </div>

  </div>

  <!-- MODAL PENARIKAN SALDO -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px;">Penarikan Saldo Ke Rekening</h3>
      
      <label style="font-size: 12px; color: var(--muted);">Pilih Bank / E-Wallet</label>
      <select id="bankName" class="input-field">
        <option value="BCA">BCA</option>
        <option value="Mandiri">Bank Mandiri</option>
        <option value="BRI">BRI</option>
        <option value="DANA">DANA</option>
        <option value="GoPay">GoPay</option>
        <option value="OVO">OVO</option>
      </select>

      <label style="font-size: 12px; color: var(--muted);">Nomor Rekening / HP</label>
      <input type="number" id="accountNumber" class="input-field" placeholder="Contoh: 081234567890">

      <label style="font-size: 12px; color: var(--muted);">Nominal Penarikan (Rp)</label>
      <input type="number" id="withdrawAmount" class="input-field" placeholder="Min. Rp 50.000">

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn-withdraw" style="background: var(--line); color: var(--text);" onclick="closeWithdrawModal()">Batal</button>
        <button class="btn-withdraw" onclick="submitWithdraw()">Kirim Pengajuan</button>
      </div>
    </div>
  </div>

  <script>
    // DATA KREATOR DIMULAI DARI NOL (0)
    const creatorData = {
      isMonetized: false,
      followers: 0,      // Mulai dari 0 followers
      watchHours: 0,     // Mulai dari 0 jam tayang
      balance: 0,        // Saldo awal Rp 0
      monthIncome: 0,    // Pendapatan bulan ini Rp 0
      totalWithdrawn: 0, // Total cair Rp 0
      history: []        // Riwayat kosong
    };

    // FUNGSI INIT TAMPILAN
    function initMonetizationPage() {
      // 1. Render Progress Followers
      const followerPct = Math.min(100, (creatorData.followers / 2000) * 100);
      document.getElementById('followersBar').style.width = followerPct + '%';
      document.getElementById('followersText').innerText = `${creatorData.followers.toLocaleString()} / 2.000`;

      // 2. Render Progress Jam Tayang
      const watchPct = Math.min(100, (creatorData.watchHours / 1000) * 100);
      document.getElementById('watchHoursBar').style.width = watchPct + '%';
      document.getElementById('watchHoursText').innerText = `${creatorData.watchHours.toLocaleString()} / 1.000 Jam`;

      // 3. Cek Status Monetisasi
      const isQualified = creatorData.followers >= 2000 && creatorData.watchHours >= 1000;
      const badge = document.getElementById('monetizeStatusBadge');
      
      if (isQualified || creatorData.isMonetized) {
        badge.className = 'status-badge badge-active';
        badge.innerText = 'Aktif Ter-Monetisasi';
        document.getElementById('withdrawBtn').disabled = false;
      } else {
        badge.className = 'status-badge badge-locked';
        badge.innerText = 'Belum Memenuhi';
        document.getElementById('withdrawBtn').disabled = true;
      }

      // 4. Render Saldo & Pendapatan (Mulai dari Nol)
      document.getElementById('balanceDisplay').innerText = 'Rp ' + creatorData.balance.toLocaleString('id-ID');
      document.getElementById('monthIncome').innerText = 'Rp ' + creatorData.monthIncome.toLocaleString('id-ID');
      document.getElementById('totalWithdrawn').innerText = 'Rp ' + creatorData.totalWithdrawn.toLocaleString('id-ID');

      // 5. Render Riwayat Pendapatan
      renderHistory(creatorData.history);
    }

    function renderHistory(list) {
      const container = document.getElementById('historyList');
      if (!list || list.length === 0) return;

      container.innerHTML = list.map(item => `
        <div class="history-item">
          <div>
            <div class="history-desc">${item.desc}</div>
            <div class="history-date">${item.date}</div>
          </div>
          <div class="history-amount">+Rp ${item.amount.toLocaleString('id-ID')}</div>
        </div>
      `).join('');
    }

    // FUNGSI MODAL WITHDRAW
    function openWithdrawModal() {
      document.getElementById('withdrawModal').style.display = 'flex';
    }

    function closeWithdrawModal() {
      document.getElementById('withdrawModal').style.display = 'none';
    }

    function submitWithdraw() {
      const bank = document.getElementById('bankName').value;
      const account = document.getElementById('accountNumber').value;
      const amount = parseInt(document.getElementById('withdrawAmount').value);

      if (!account || isNaN(amount) || amount < 50000) {
        alert('Mohon isi nomor rekening dan nominal penarikan minimal Rp 50.000.');
        return;
      }

      if (amount > creatorData.balance) {
        alert('Saldo Anda tidak mencukupi untuk penarikan ini.');
        return;
      }

      alert(`Pengajuan penarikan sebesar Rp ${amount.toLocaleString('id-ID')} ke ${bank} (${account}) berhasil dikirim.`);
      closeWithdrawModal();
    }

    // Jalankan saat halaman dibuka
    document.addEventListener('DOMContentLoaded', initMonetizationPage);
  </script>
</body>
</html>
