<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Profil — OER</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <div class="profile-page">
      <div class="profile-header">
        <div class="profile-cover"></div>
        
        <div class="profile-info">
          <img src="https://i.pravatar.cc/200?img=12" alt="Avatar" class="profile-avatar" />
          <h1 class="profile-name">Rizky Creative</h1>
          <p class="profile-username">@rizky.creative</p>
          <p class="profile-bio">Content Creator | Video Editor<br>Bali based 🌴 | Daily tips & cinematic vibes</p>
          
          <div class="profile-stats">
            <div class="stat">
              <div class="stat-value">128</div>
              <div class="stat-label">Video</div>
            </div>
            <div class="stat">
              <div class="stat-value">84.2K</div>
              <div class="stat-label">Followers</div>
            </div>
            <div class="stat">
              <div class="stat-value">312</div>
              <div class="stat-label">Following</div>
            </div>
          </div>
          
          <div class="profile-actions">
            <button class="btn-primary">Edit Profil</button>
            <button class="btn-secondary">Bagikan</button>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="video-grid-header">
        <div class="grid-tab active">Video</div>
        <div class="grid-tab">Reels</div>
        <div class="grid-tab">Disukai</div>
      </div>

      <!-- Video Grid -->
      <div class="video-grid">
        <div class="grid-item">
          <img src="https://picsum.photos/300/530?random=1" alt="Video" />
          <div class="views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            24.5K
          </div>
        </div>
        <div class="grid-item">
          <img src="https://picsum.photos/300/530?random=2" alt="Video" />
          <div class="views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            18.3K
          </div>
        </div>
        <div class="grid-item">
          <img src="https://picsum.photos/300/530?random=3" alt="Video" />
          <div class="views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            42.1K
          </div>
        </div>
        <div class="grid-item">
          <img src="https://picsum.photos/300/530?random=4" alt="Video" />
          <div class="views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            9.7K
          </div>
        </div>
        <div class="grid-item">
          <img src="https://picsum.photos/300/530?random=5" alt="Video" />
          <div class="views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            31.2K
          </div>
        </div>
        <div class="grid-item">
          <img src="https://picsum.photos/300/530?random=6" alt="Video" />
          <div class="views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            15.8K
          </div>
        </div>
        <div class="grid-item">
          <img src="https://picsum.photos/300/530?random=7" alt="Video" />
          <div class="views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            27.4K
          </div>
        </div>
        <div class="grid-item">
          <img src="https://picsum.photos/300/530?random=8" alt="Video" />
          <div class="views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            6.1K
          </div>
        </div>
        <div class="grid-item">
          <img src="https://picsum.photos/300/530?random=9" alt="Video" />
          <div class="views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            11.9K
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>

      <a href="upload.html" class="nav-item upload-btn">
        <div class="upload-circle">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
      </a>
      <a href="profile.html" class="nav-item active">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profil</span>
      </a>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
